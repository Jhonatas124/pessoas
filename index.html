.fi-fila{margin:0 0 12px; padding:10px 12px; border-radius:12px; font-size:13px; background:rgba(123,140,255,.1); border:1px solid rgba(123,140,255,.3); color:#c7cfff}
.fi-fila.esq{background:rgba(251,191,36,.08); border-color:rgba(251,191,36,.28); color:#fde68a}
.fi-ac{display:flex; gap:8px; margin:0 0 14px}
.fi-ac .btn{flex:1; justify-content:center; padding:11px 8px}
.fi-dd{display:grid; grid-template-columns:1fr 1fr; gap:1px; border:1px solid var(--line); border-radius:var(--r2); overflow:hidden; background:var(--line); margin:0 0 14px}
.fi-dd:empty{display:none}
.dd-i{background:var(--bg2); padding:9px 12px; min-width:0}
.dd-i:last-child:nth-child(odd){grid-column:1/-1}
.dd-i small{display:block; font-size:11px; color:var(--mut); margin-bottom:2px}
.dd-i span{display:block; font-size:13.5px; overflow-wrap:anywhere}
.fi-fam{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px 6px; margin-bottom:10px}
.mp{display:flex; flex-direction:column; align-items:center; text-align:center; color:var(--ink); text-decoration:none; min-width:0}
.mp:hover{text-decoration:none}
.mp-img{width:52px; height:52px; border-radius:50%; object-fit:cover; display:block; margin-bottom:4px}
.mp-img.none{display:grid; place-items:center; background:var(--surf2); font-size:20px; color:var(--mut2)}
.mp b{font-size:12px; font-weight:600; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.mp small{font-size:10.5px; color:var(--mut)}
.cel-chips.add{margin-bottom:0; flex-wrap:wrap}
.cel-chips.add button{font-size:12.5px; padding:7px 12px}
.fi-det{border:1px solid var(--line); border-radius:var(--r2); background:var(--surf); margin:0 0 10px; padding:0 12px}
.fi-det summary{cursor:pointer; list-style:none; padding:13px 0; font-weight:600; display:flex; align-items:center; gap:8px}
.fi-det summary::-webkit-details-marker{display:none}
.fi-det summary::after{content:'›'; margin-left:auto; color:var(--mut); font-size:18px; transition:transform .2s}
.fi-det[open] summary::after{transform:rotate(90deg)}
.fi-det[open]{padding-bottom:12px}
/* cadastro expresso */
.xp-topo{display:flex; align-items:center; gap:10px; margin:0 0 10px}
.xp-tog{display:inline-flex; align-items:center; gap:9px; cursor:pointer; user-select:none; -webkit-user-select:none}
.xp-tog input{position:absolute; opacity:0; pointer-events:none}
.xp-tog .sw{width:46px; height:28px; border-radius:99px; background:var(--surf3); border:1px solid var(--line2); position:relative; transition:background .2s; flex:none}
.xp-tog .sw::after{content:''; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:transform .2s}
.xp-tog input:checked + .sw{background:var(--ok); border-color:transparent}
.xp-tog input:checked + .sw::after{transform:translateX(18px)}
.xp{display:grid; gap:14px; margin:6px 0 18px}
.xp .campo input{font-size:17px; padding:13px 14px}
.xp .campo input.erro,#in_nasc.erro{border-color:var(--red)}
.xp-foto{display:flex; align-items:center; gap:12px; cursor:pointer; padding:10px 12px; border:1px dashed var(--line3); border-radius:var(--r3); color:var(--ink2)}
.xp-prev{width:54px; height:54px; border-radius:50%; display:grid; place-items:center; background:var(--surf2); font-size:22px; overflow:hidden; flex:none}
.xp-prev img{width:100%; height:100%; object-fit:cover}
.xp-chk{display:flex; gap:12px; align-items:flex-start; padding:12px; border-radius:var(--r3); background:rgba(123,140,255,.08); border:1px solid rgba(123,140,255,.25); cursor:pointer}
.xp-chk input{width:22px; height:22px; margin:1px 0 0; accent-color:var(--acc); flex:none}
.xp-chk b{display:block; font-size:14px}
.xp-chk small{display:block; color:var(--mut); font-size:12px; margin-top:2px}
@media (max-width:760px){
  .fita{display:none!important}
  main{padding-top:12px}
  .cel-chips{margin:0 -14px 14px; padding:0 14px}
  .cel-chips.add{margin:0; padding:0}
}
@media (min-width:761px){
  .grade-ta{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
  .fi-fam{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
}

<body>
<div class="app">

  <aside class="sb" id="sb">
    <div class="marca">
      <div class="sig">🗂️</div>
      <div class="txt"><b>Pessoas de Bolso</b><span>Banco de pessoas no celular</span></div>
      <button class="fechar" onclick="alternarSidebar()" title="Recolher o menu">‹</button>
    </div>
    <nav id="nav"></nav>
    <div class="rodape" id="saude"></div>
  </aside>

  <div class="conteudo">
    <div class="topo-barra">
      <div class="crumb" id="crumb"></div>
      <input id="busca" type="search" placeholder="Buscar pessoa, apelido, ofício…" autocomplete="off" autocorrect="off" spellcheck="false">

      <button class="icone tem" onclick="location.hash='#/pendencias'" title="Conferência do banco">🔔</button>
      <button class="btn p" onclick="abrirForm()" aria-label="Nova pessoa">＋<span class="t"> Nova pessoa</span></button>

    <main id="app"></main>
  </div>

</div>
<nav class="tabbar" id="tabbar" aria-label="Seções"></nav>
<div class="modal" id="modal"><div class="form" id="form"></div></div>
<div class="modal" id="modal2"><div class="form" id="form2"></div></div>
<div id="dlg"></div>
<div id="trava"></div>
<div class="toast" id="toast"></div>
<input type="file" id="arq-importar" accept=".json,application/json" hidden>
<script>
// ================================================================ painel (copiado do Mac)
// ------------------------------------------------------------ estado
let PESSOAS = {}, HOJE = new Date();
const $ = s => document.querySelector(s);
const app = $('#app');
const MSG_WA = 'Parabéns por esse dia tão especial. Pensa que eu esqueci, mas você é realmente muito especial pra mim. Eu te desejo toda a saúde, felicidade e paz que você merece.';

// brilho que segue o cursor: grava a posição relativa no elemento sob o mouse
document.addEventListener('pointermove',e=>{
  const el=e.target.closest?.('.card,.row,.pc,.btn,.fato,.stat>div,.perfil,.tabs button,header nav a,.alerta');
  if(!el)return;
  const r=el.getBoundingClientRect();
  el.style.setProperty('--mx',(e.clientX-r.left)+'px');
  el.style.setProperty('--my',(e.clientY-r.top)+'px');
},{passive:true});
// numera os filhos para a animação entrar escalonada
function escalonar(){document.querySelectorAll('.grid,.lista,.stat,.gen,.fatos,.chips').forEach(c=>
  [...c.children].forEach((f,i)=>f.style.setProperty('--i',Math.min(i,26))))}

function anosEntre(d1,d2){ // 'DD/MM/AAAA' -> anos completos, ou null
  const m=s=>{const x=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec((s||'').trim());return x?[+x[3],+x[2],+x[1]]:null};
  const a=m(d1),b=m(d2); if(!a||!b)return null;
  let n=b[0]-a[0]; if(b[1]<a[1]||(b[1]===a[1]&&b[2]<a[2]))n--;
  return (n>=0&&n<100)?n:null;
}

function norm(s){return (s||'').normalize('NFKD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/\s+/g,' ').trim()}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function nomeCurto(p){return p.nome}
function apelido(p){const m=/\(([^)]+)\)/.exec(p.nome||'');return m?m[1]:''}
function fem(p){return p.sexo==='Feminino'}
function ano(p){const m=/(\d{4})$/.exec(p.data_nascimento||'');return m?m[1]:''}
function foto(p,cls){cls=cls||'ph';return p.foto?`<img class="${cls}" src="${fotoSrc(p.foto)}" loading="lazy" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'${cls} none',textContent:'👤'}))">`:`<div class="${cls} none">${p.esqueleto?'?':(fem(p)?'👩':'👤')}</div>`}
function wa(p){
  let d=(p.telefone||'').replace(/\D/g,'');
  if(d.length===10||d.length===11) d='55'+d;
  if(d.length<12) return '';
  return `https://wa.me/${d}?text=${encodeURIComponent(MSG_WA)}`;
}
const FONTES={documento:['📄 documento','fd'],pessoa:['🗣️ a própria pessoa','fp'],terceiro:['👥 terceiro','ft'],esqueleto:['citado(a)','esq'],'':['sem fonte','fn']};
function tagFonte(p){const f=FONTES[p.fonte||'']||FONTES[''];return `<span class="tag ${f[1]}" title="fonte da informação">${f[0]}</span>`}
function tags(p){let t=p.pendente?'<span class="pend-cel" title="mudou no celular; ainda não foi pro Mac">📱 no celular</span> ':'';if(p.esqueleto)t+='<span class="tag esq">esqueleto</span> ';if(p.falecido)t+='<span class="tag fal">falecido</span> ';if(!p.esqueleto)t+=tagFonte(p);return t}
// CPF: dígito verificador
function cpfValido(c){c=(c||'').replace(/\D/g,'');if(c.length!==11||/^(\d)\1{10}$/.test(c))return false;
  for(const n of [9,10]){let s=0;for(let i=0;i<n;i++)s+=c[i]*(n+1-i);const d=(s*10)%11%10;if(d!=c[n])return false}return true}
function cpfStatus(v){if(/\*/.test(v||''))return '';const d=(v||'').replace(/\D/g,'');if(!d)return '';if(d.length<11)return 'CPF incompleto ('+d.length+' de 11 dígitos)';if(!cpfValido(d))return 'CPF inválido — dígito verificador não bate (erro de digitação?)';
  const dup=Object.values(PESSOAS).find(x=>(x.cpf||'').replace(/\D/g,'')===d&&x.id!==FORM_ID);return dup?'CPF já cadastrado em: '+dup.nome+' (id '+dup.id+')':''}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2600)}

try{if(localStorage.getItem('mini'))document.body.classList.add('mini')}catch(e){}
let RESUMO={}, PENDENTES=null, IMPPEND=null;
async function carregar(){
  const [r,r2]=await Promise.all([fetch('/api/pessoas'),fetch('/api/resumo')]);
  const j=await r.json();
  PESSOAS=j.pessoas; PAD=null; _cacheF=null; HOJE=new Date(j.hoje+'T12:00:00');
  try{RESUMO=await r2.json()}catch(e){RESUMO={}}
  contarPendencias();          // em segundo plano: os badges do menu
}
// Os números do menu não seguram a tela: chegam quando chegam e o menu se redesenha.
async function contarPendencias(){
  try{
    const C=await (await fetch('/api/coerencia')).json();
    PENDENTES=C.filter(a=>a.sev!=='info').length;
  }catch(e){PENDENTES=null}
  try{
    const l=(await (await fetch('/api/importacoes')).json()).lotes||[];
    IMPPEND=l.reduce((a,x)=>a+Math.max(0,(x.provaveis||0)+(x.novos||0)-(x.decididos||0)),0);
  }catch(e){IMPPEND=null}
  desenharMenu();
}

// ------------------------------------------------------------ rotas
window.addEventListener('hashchange',render);
$('#busca').addEventListener('input',()=>{ if(location.hash!=='#/pessoas'){location.hash='#/pessoas'} else render(); });
async function render(){
  await desenhar();
  requestAnimationFrame(escalonar);
}
// ------------------------------------------------------------ casca
// O menu é agrupado por intenção, não por tela: primeiro o que ele olha todo dia,
// depois as pessoas, depois o que é manutenção do banco.
const MENU=[
  ['Visão geral',[
    ['#/','🎂','Aniversários','aniv','bd_aniv'],
    ['#/descobertas','✨','Descobertas','desc',''],
    ['#/mapa','🗺️','Mapa','mapa','bd_mapa'],
  ]],
  ['Pessoas',[
    ['#/pessoas','👥','Todas as fichas','pessoas','bd_pes'],
    ['#/pessoas?f=esq','🧩','Esqueletos','esq','bd_esq'],
  ]],
  ['Manutenção',[
    ['#/pendencias','🔎','Conferência','pend','bd_pend'],
  ]],
  ['Aplicativo',[
    ['#/ajustes','⚙️','Ajustes e cofre','ajustes','bd_mud'],
  ]],
];
const TITULOS={aniv:['Visão geral','Aniversários'],mapa:['Visão geral','Mapa'],desc:['Visão geral','Descobertas'],
  pessoas:['Pessoas','Todas as fichas'],esq:['Pessoas','Esqueletos'],
  imp:['Manutenção','Importar contatos'],pend:['Manutenção','Conferência'],
  pessoa:['Pessoas','Ficha'],ajustes:['Aplicativo','Ajustes']};
function vAtual(){
  const h=location.hash||'#/';
  if(h.startsWith('#/p/'))return'pessoa';
  if(h.startsWith('#/descobertas'))return'desc';
  if(h.startsWith('#/mapa'))return'mapa';
  if(h.startsWith('#/pendencias'))return'pend';
  if(h.startsWith('#/ajustes'))return'ajustes';
  if(h.startsWith('#/pessoas'))return FILTRO==='esq'?'esq':'pessoas';
  return'aniv';
}
function desenharMenu(){
  const at=vAtual();
  $('#nav').innerHTML=MENU.map(([g,itens])=>`<div class="grupo">${g}</div>`+itens.map(([href,ic,rot,k,bd])=>
    `<a class="item ${at===k?'on':''}" href="${href}"><i>${ic}</i><span>${rot}</span>${bd?`<span class="badge" id="${bd}">·</span>`:''}</a>`).join('')).join('');
  const P=Object.values(PESSOAS);
  const põe=(id,v)=>{const e=document.getElementById(id); if(e)e.textContent=v};
  põe('bd_pes',P.length);
  põe('bd_esq',P.filter(p=>p.esqueleto).length);
  põe('bd_mapa',P.filter(p=>p.local).length);
  põe('bd_aniv',P.filter(p=>p.dias!==null&&!p.falecido&&(p.circ??0)>=ANIV_MIN&&p.dias<=30).length);
  põe('bd_pend',PENDENTES===null?'·':PENDENTES);
  põe('bd_imp',IMPPEND===null?'·':(IMPPEND>999?'999+':IMPPEND));
  const sino=document.querySelector('.icone.tem');
  if(sino)sino.classList.toggle('tem',!!PENDENTES);
  // saúde do banco no pé do menu: quantas fichas estão completas de verdade
  const comp=P.filter(p=>!p.esqueleto).length, pct=P.length?Math.round(100*comp/P.length):0;
  $('#saude').innerHTML=`<div class="saude" title="fichas completas (não esqueleto)">
    <div class="l"><span>Banco completo</span><b>${pct}%</b></div>
    <div class="tr"><i style="width:${pct}%"></i></div>
    <div class="pe">${comp} de ${P.length} fichas · ${P.length-comp} esqueletos a preencher</div></div>`;
  let [g,t]=TITULOS[at]||['',''];
  if(at==='pessoa'){const q=PESSOAS[(location.hash.slice(4)||'')]; if(q)t=q.nome;}
  $('#crumb').innerHTML=`<span class="casa">🗂️</span><span>${g}</span><span class="sep">/</span><b>${t}</b>`;
}
function alternarSidebar(){
  document.body.classList.toggle('mini');
  try{localStorage.setItem('mini',document.body.classList.contains('mini')?'1':'')}catch(e){}
  if(location.hash.startsWith('#/p/'))setTimeout(linhas,260);
}
// a fita do topo: quem faz aniversário nos próximos 30 dias, correndo devagar
function desenharFita(){
  const prox=Object.values(PESSOAS).filter(p=>p.dias!==null&&!p.falecido&&(p.circ??0)>=1&&p.dias<=45)
    .sort((a,b)=>a.dias-b.dias).slice(0,26);
  if(!prox.length){$('#fita').style.display='none';return}
  $('#fita').style.display='flex';
  const it=p=>`<a class="it" href="#/p/${p.id}"><b>${esc(p.nome.split(' ').slice(0,2).join(' '))}</b>
    <span class="q">${p.data_nascimento.slice(0,5)}</span>
    <span class="${p.dias===0?'hoje':'q'}">${p.dias===0?'🎉 hoje':p.dias===1?'amanhã':'em '+p.dias+'d'}</span></a>`;
  const linha=prox.map(it).join('');
  $('#fita').innerHTML=`<div class="rot">🎂 <b>${prox.length}</b> a caminho</div>
    <div class="trilho"><div class="correia">${linha}${linha}</div></div>`;
}

async function desenhar(){
  const h=location.hash||'#/';
  if(h.startsWith('#/pessoas')) FILTRO = h.includes('f=esq') ? 'esq' : (FILTRO==='esq'&&!h.includes('f=')?'todas':FILTRO);
  desenharMenu(); desenharFita(); desenharAbas();
  if(h.startsWith('#/ajustes')) return vAjustes();
  if(!BASE) return vBoasVindas();
  if(h.startsWith('#/p/')) return vPessoa(idAtual(decodeURIComponent(h.slice(4))));
  if(h.startsWith('#/pessoas')) return vPessoas();
  if(h.startsWith('#/pendencias')) return vPend();
  if(h.startsWith('#/descobertas')) return vDescobertas();
  if(h.startsWith('#/mapa')) return vMapa();
  return vAniv();
}

// ------------------------------------------------------------ aniversários
// ordem dos cards: do mais amplo ao mais próximo, como os status das referências
const CIRC=[[0,'Todos','todas as fichas, inclusive quem não tem ligação nenhuma com você'],
            [1,'Conhecidos','parente distante, ou quem está na sua agenda'],
            [2,'Família','entre 3 e 4 passos de parentesco'],
            [3,'Família próxima','até 2 passos de parentesco de você']];
let ANIV_MIN=(()=>{try{return +(localStorage.getItem('aniv_min')??1)}catch(e){return 1}})();
// ============================================================ aniversários v6
// Prioridade da tela, nesta ordem: HOJE → PRÓXIMOS 7 DIAS → PRÓXIMOS 30 DIAS.
// Todo número desta tela é sobre os aniversariantes da janela, e aparece como
// gráfico. Nada é digitado: idade, marco, dia da semana, parentesco com você,
// irmãos — tudo sai das datas e dos vínculos pai/mãe.
const MARCOS=new Set([1,15,18,21,25,30,40,50,60,70,75,80,90,100]);
const SEM=['dom','seg','ter','qua','qui','sex','sáb'];
const SEML=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const COR_C=['#848db0','#f5c65e','#8194ff','#82e8ae'];
const GLOW_C=['rgba(132,141,176,.45)','rgba(245,198,94,.5)','rgba(129,148,255,.55)','rgba(130,232,174,.5)'];
function fazAnos(p){return (p.idade||0)+(p.dias===0?0:1)}
function dataAniv(p){const d=new Date(HOJE);d.setDate(d.getDate()+p.dias);return d}
function proxMarco(n){for(const m of [...MARCOS].sort((a,b)=>a-b)) if(m>=n) return m; return Math.ceil((n+1)/10)*10}
function relTxt(p){
  if(p.id===ID_EU)return 'você';
  if(p.grau_eu)return p.grau_eu.charAt(0).toLowerCase()+p.grau_eu.slice(1)+(p.lado_eu?', '+p.lado_eu.replace('pelo lado ','lado '):'');
  // mesma regra do círculo: ter só um link de rede social não põe ninguém na sua agenda
  return (p.circ??0)>=1?'na sua agenda':'sem ligação com você';
}
function signoJS(dn){
  const m=/^(\d{1,2})\/(\d{1,2})/.exec(dn||''); if(!m)return'';
  const d=+m[1], mo=+m[2];
  const T=[[20,'Aquário'],[19,'Peixes'],[21,'Áries'],[20,'Touro'],[21,'Gêmeos'],[21,'Câncer'],
           [23,'Leão'],[23,'Virgem'],[23,'Libra'],[23,'Escorpião'],[22,'Sagitário'],[22,'Capricórnio']];
  return d>=T[mo-1][0]?T[mo-1][1]:T[(mo+10)%12][1];
}
function irmaosDe(p){
  return Object.values(PESSOAS).filter(x=>x.id!==p.id&&((p.pai_id&&x.pai_id===p.pai_id)||(p.mae_id&&x.mae_id===p.mae_id)));
}
// categoria de parentesco, para o gráfico "quem são para você"
function relCat(p){
  const g=(p.grau_eu||'').toLowerCase();
  if(p.id===ID_EU)return'Você';
  if(!g)return (p.circ??0)>=1?'Agenda (sem parentesco)':'Sem ligação';
  if(/^(pai|mãe|filh)/.test(g))return'Pais e filhos';
  if(/^irm/.test(g))return'Irmãos';
  if(/av[óô]|bisav|trisav|tatarav/.test(g))return'Avós e bisavós';
  if(/^ti[oa]/.test(g))return'Tios';
  if(/^prim/.test(g))return'Primos';
  if(/sobrinh/.test(g))return'Sobrinhos';
  if(/net[oa]/.test(g))return'Netos';
  if(/afinidade/.test(g))return'Por afinidade';
  return'Outros parentes';
}
function faixa(n){return n<=12?'0–12':n<=17?'13–17':n<=29?'18–29':n<=44?'30–44':n<=59?'45–59':'60+'}

// --- gráficos pequenos em SVG (sem biblioteca) ---
function sparkArea(vals,destaque,cor){
  if(vals.length<2)return'';
  const W=420,H=92,max=Math.max(...vals),min=Math.min(...vals),rg=(max-min)||1;
  const pts=vals.map((v,i)=>[i*W/(vals.length-1), H-10-((v-min)/rg)*(H-34)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const id='g'+Math.random().toString(36).slice(2,8);
  const dot=destaque>=0&&pts[destaque]?`<circle cx="${pts[destaque][0]}" cy="${pts[destaque][1]}" r="5.5" fill="#14151f" stroke="${cor}" stroke-width="2.4"/>`:'';
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="${cor}" stop-opacity=".32"/><stop offset="1" stop-color="${cor}" stop-opacity="0"/></linearGradient></defs>
    <path d="${d} L${W},${H} L0,${H} Z" fill="url(#${id})"/>
    <path d="${d}" fill="none" stroke="${cor}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke" opacity=".9"/>${dot}</svg>`;
}
function anel(frac,centro,sub,cor,tam){
  tam=tam||74; const r=tam/2-6, C=2*Math.PI*r, f=Math.max(0,Math.min(1,frac));
  return `<svg class="anelx" width="${tam}" height="${tam}" viewBox="0 0 ${tam} ${tam}">
    <circle cx="${tam/2}" cy="${tam/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="6"/>
    <circle cx="${tam/2}" cy="${tam/2}" r="${r}" fill="none" stroke="${cor}" stroke-width="6" stroke-linecap="round"
      stroke-dasharray="${f*C} ${C}" transform="rotate(-90 ${tam/2} ${tam/2})"/>
    <text x="50%" y="${tam/2+1}" text-anchor="middle" fill="#f3f4f9" font-size="15" font-weight="700">${centro}</text>
    <text x="50%" y="${tam/2+14}" text-anchor="middle" fill="#8b90a8" font-size="8.5">${sub}</text></svg>`;
}

// ============================================================ mapa
// Motor de mapa próprio, sem biblioteca: projeção Web Mercator, ladrilhos de 256px.
// Satélite: Esri World Imagery (gratuito para uso pessoal, com o crédito na tela).
// O endereço entra SÓ por ele: clicando no telhado no satélite, ou digitando o endereço.
const TS=256, ZMIN=3, ZMAX=21;   // acima do limite de foto do lugar, a última foto boa é ampliada
const CAMADAS={
  sat:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  ruas:'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}',
  nomes:'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}'};
const MAPA={lat:-5.8,lng:-36.6,z:8,rotulos:true,modo:null,balao:null,aba:'sem',q:'',endPend:'',iniciado:false};
function mX(lng,z){return (lng+180)/360*TS*2**z}
function mY(lat,z){const s=Math.sin(lat*Math.PI/180);return (0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*TS*2**z}
function lngDe(x,z){return x/(TS*2**z)*360-180}
function latDe(y,z){const n=Math.PI-2*Math.PI*y/(TS*2**z);return 180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n)))}
function localDe(p){const m=/^\s*(-?[\d.]+)\s*,\s*(-?[\d.]+)\s*$/.exec(p.local||'');return m?{lat:+m[1],lng:+m[2]}:null}
function noFiltroMapa(p){return (p.circ??0)>=ANIV_MIN}

function vMapa(){
  const pid=decodeURIComponent((location.hash.split('p=')[1]||'').split('&')[0]);
  const todos=Object.values(PESSOAS);
  // centro inicial: a pessoa pedida > onde estão os pinos > última vista > o Rio Grande do Norte
  if(!MAPA.iniciado){
    MAPA.iniciado=true;
    const comPino=todos.map(localDe).filter(Boolean);
    let salvo=null; try{salvo=JSON.parse(localStorage.getItem('mapa_vista')||'null')}catch(e){}
    if(salvo){Object.assign(MAPA,salvo)}
    else if(comPino.length){
      const med=a=>a.sort((x,y)=>x-y)[Math.floor(a.length/2)];
      MAPA.lat=med(comPino.map(c=>c.lat)); MAPA.lng=med(comPino.map(c=>c.lng)); MAPA.z=15;
    }
  }
  if(pid&&PESSOAS[pid]){const c=localDe(PESSOAS[pid]); if(c){MAPA.lat=c.lat;MAPA.lng=c.lng;MAPA.z=Math.max(MAPA.z,18.5);MAPA.balao=c.lat.toFixed(4)+','+c.lng.toFixed(4)}}
  const nPino=todos.filter(p=>localDe(p)).length;
  app.innerHTML=`
  <div class="cab-aniv"><div class="t">
    <div class="vivo"><i></i><span id="mcont"><b>${nPino}</b> ${nPino===1?'pessoa marcada':'pessoas marcadas'}</span> no mapa · imagem de satélite</div>
    <h1 class="titulo-g">Mapa</h1></div>
    <div class="seg">${[...CIRC].sort((a,b)=>b[0]-a[0]).map(([n,r,d])=>`<button class="${ANIV_MIN===n?'on':''}" title="${d}" onclick="selCircSeg(${n})">${r}</button>`).join('')}</div></div>
  <div class="mapa-wrap">
    <div class="mapa-vista" id="mv">
      <div class="camada" id="c_sat"></div><div class="camada rotulos" id="c_rot"></div>
      <div class="pinos" id="mpinos"></div>
      <div class="mapa-ctl">
        <button onclick="mapaZoom(1)" title="aproximar">＋</button>
        <button onclick="mapaZoom(-1)" title="afastar">－</button>
        <button onclick="MAPA.rotulos=!MAPA.rotulos;mapaDesenhar()" title="mostrar/esconder ruas e nomes">🏷️</button>
        <button onclick="mapaEnquadrar()" title="enquadrar todos os pinos">⤢</button>
      </div>
      <div class="mapa-topo"><input id="geo_in" placeholder="Ir para: cidade, bairro, rua…" autocomplete="off"
        onkeydown="if(event.key==='Enter')mapaBuscar(this.value)"></div>
      <div id="geo_res"></div><div id="faixa"></div>
      <div class="creditos">Imagens © Esri, Maxar, Earthstar Geographics · endereços © OpenStreetMap</div>
    </div>
    <div class="mapa-lado" id="mlado"></div>
  </div>`;
  mapaLigar(); mapaDesenhar(); mapaLado();
}

// ---------------------------------------------------------------- até onde há foto aqui?
// A Esri não tem satélite em todo zoom em todo lugar: acima do limite ela devolve um quadro
// cinza "Map data not yet available" (é uma imagem válida, não dá erro). O serviço `tilemap`
// diz, por ladrilho, se existe imagem. Acima do limite, o mapa AMPLIA a última foto boa.
const NATIVO={}, NATIVO_PADRAO=17;
function chaveArea(lat,lng){const z=12,n=2**z;return Math.floor((lng+180)/360*n)+'/'+Math.floor(mY(lat,z)/TS)}
function nativoAqui(){
  const k=chaveArea(MAPA.lat,MAPA.lng);
  if(NATIVO[k]!==undefined) return NATIVO[k]||NATIVO_PADRAO;
  NATIVO[k]=0; descobrirNativo(k,MAPA.lat,MAPA.lng);
  return NATIVO_PADRAO;
}
async function descobrirNativo(k,lat,lng){
  try{const salvo=JSON.parse(localStorage.getItem('nativo_'+k)||'0'); if(salvo){NATIVO[k]=salvo; agendar(); return}}catch(e){}
  for(let z=19;z>=13;z--){
    const n=2**z, x=Math.floor((lng+180)/360*n), y=Math.floor(mY(lat,z)/TS);
    try{
      const r=await fetch(`https://server.arcgisonline.com/arcgis/rest/services/World_Imagery/MapServer/tilemap/${z}/${y}/${x}/1/1`);
      const j=await r.json();
      if(j.data&&j.data[0]===1){NATIVO[k]=z; try{localStorage.setItem('nativo_'+k,z)}catch(e){} agendar(); return}
    }catch(e){NATIVO[k]=NATIVO_PADRAO; return}
  }
  NATIVO[k]=13; agendar();
}

// ---------------------------------------------------------------- desenho
// O zoom de exibição pode ser fracionário (zoom contínuo). Os ladrilhos vêm do nível inteiro
// mais próximo que tenha foto, e são escalados. Ladrilhos de OUTROS níveis ficam na tela,
// posicionados certinho, até os do nível atual carregarem — por isso nada pisca.
let _agendado=false;
function agendar(){if(_agendado)return;_agendado=true;requestAnimationFrame(()=>{_agendado=false;mapaDesenhar()})}
function mapaDesenhar(){
  const el=$('#mv'); if(!el)return;
  if(el.scrollTop||el.scrollLeft){el.scrollTop=0;el.scrollLeft=0}
  const W=el.clientWidth,H=el.clientHeight,z=MAPA.z;
  const cx=mX(MAPA.lng,z), cy=mY(MAPA.lat,z), x0=cx-W/2, y0=cy-H/2;
  const nat=nativoAqui();
  const camada=(id,urls,maxN)=>{
    const box=$('#'+id); box._c=box._c||{};
    const nz=Math.max(ZMIN,Math.min(maxN,Math.round(z)));
    const esc2=2**(z-nz), lado=TS*esc2, n=2**nz;
    const precisa=new Set(); let faltando=0;
    if(urls.length) for(let tx=Math.floor(x0/lado);tx<=Math.floor((x0+W)/lado);tx++)
      for(let ty=Math.max(0,Math.floor(y0/lado));ty<=Math.min(n-1,Math.floor((y0+H)/lado));ty++){
        const wx=((tx%n)+n)%n;
        urls.forEach((u,k)=>{
          const key=k+'/'+nz+'/'+tx+'/'+ty; precisa.add(key);
          let img=box._c[key];
          if(!img){img=document.createElement('img');img.alt='';img.draggable=false;
            img.dataset.nz=nz;img.dataset.tx=tx;img.dataset.ty=ty;
            img.onload=()=>{img.classList.add('ok');agendar()};
            img.src=u.replace('{z}',nz).replace('{y}',ty).replace('{x}',wx);box._c[key]=img;box.appendChild(img)}
          if(!img.classList.contains('ok'))faltando++;
        });
      }
    for(const [key,img] of Object.entries(box._c)){
      const inz=+img.dataset.nz;
      // de outro nível e o atual já carregou? sai. Do nível atual mas fora da tela? sai.
      if(!precisa.has(key)&&(inz===nz||faltando===0||Math.abs(inz-nz)>2)){img.remove();delete box._c[key];continue}
      const s=2**(z-inz), L=TS*s;
      img.style.transform=`translate(${(+img.dataset.tx)*L-x0}px,${(+img.dataset.ty)*L-y0}px) scale(${s})`;
      img.style.zIndex=inz===nz?2:1;
    }
  };
  camada('c_sat',[CAMADAS.sat],nat);
  camada('c_rot',MAPA.rotulos?[CAMADAS.ruas,CAMADAS.nomes]:[],Math.min(nat,19));
  desenharPinos(W,H,x0,y0,z);
  el.classList.toggle('marcando',!!MAPA.modo);
  $('#faixa').innerHTML=MAPA.modo&&PESSOAS[MAPA.modo]?`<div class="faixa-marcar">📍 Clique no telhado da casa de <b>&nbsp;${esc(PESSOAS[MAPA.modo].nome.split(' ').slice(0,2).join(' '))}</b>
    <span style="opacity:.8;font-weight:400">&nbsp;— ou num pino que já existe, se mora junto</span>
    <button onclick="mapaEndereco()">digitar endereço</button><button onclick="MAPA.modo=null;MAPA.endPend='';agendar();mapaLado()">cancelar (Esc)</button></div>`:'';
  const nP=Object.values(PESSOAS).filter(p=>p.local).length, mc=$('#mcont');
  if(mc) mc.innerHTML=`<b>${nP}</b> ${nP===1?'pessoa marcada':'pessoas marcadas'}`;
  clearTimeout(MAPA._grava);
  MAPA._grava=setTimeout(()=>{try{localStorage.setItem('mapa_vista',JSON.stringify({lat:MAPA.lat,lng:MAPA.lng,z:MAPA.z,rotulos:MAPA.rotulos}))}catch(e){}},400);
}

// ---------------------------------------------------------------- pinos: uma casa, várias fotos
function gruposCasa(){
  const g={};
  Object.values(PESSOAS).forEach(p=>{const c=localDe(p); if(!c||!noFiltroMapa(p))return;
    const k=c.lat.toFixed(4)+','+c.lng.toFixed(4); (g[k]=g[k]||{c,ps:[]}).ps.push(p)});
  Object.values(g).forEach(x=>x.ps.sort((a,b)=>(b.circ??0)-(a.circ??0)||norm(a.nome).localeCompare(norm(b.nome))));
  return g;
}
// Tamanho do rosto conforme o zoom: de longe menor, para caber a cidade inteira.
function tamRosto(z){return z>=17?38:z>=15?31:z>=13?25:20}
const MAX_ROSTOS=16;   // num grupo muito grande, os 16 mais próximos de você + "+N"
// Cada pino é criado UMA vez e depois só muda de lugar. Antes o pino era recriado a cada quadro
// (e o mapa redesenha várias vezes por segundo enquanto o satélite carrega): cada <img> nascia
// em branco, e as fotos ficavam piscando vazias.
function desenharPinos(W,H,x0,y0,z){
  const box=$('#mpinos'); box._p=box._p||{};
  const tam=tamRosto(z), raio=tam*1.25;
  // casas que ficariam uma em cima da outra na tela viram um grupo só (com todos os rostos)
  const casas=Object.entries(gruposCasa()).map(([k,g])=>({ks:[k],ps:[...g.ps],x:mX(g.c.lng,z)-x0,y:mY(g.c.lat,z)-y0}))
    .sort((a,b)=>b.ps.length-a.ps.length);
  const grupos=[];
  for(const c of casas){
    const alvo=grupos.find(g=>Math.abs(g.x-c.x)<raio*Math.min(4,Math.ceil(Math.sqrt(g.ps.length)))&&Math.abs(g.y-c.y)<raio*1.6);
    if(alvo){const n=alvo.ps.length,m=c.ps.length; alvo.x=(alvo.x*n+c.x*m)/(n+m); alvo.y=(alvo.y*n+c.y*m)/(n+m);
      alvo.ks.push(...c.ks); alvo.ps.push(...c.ps)}
    else grupos.push(c);
  }
  const vivos=new Set();
  for(const g of grupos){
    if(g.x<-200||g.y<-120||g.x>W+200||g.y>H+220)continue;
    g.ps.sort((a,b)=>(b.circ??0)-(a.circ??0)||(a.dist??99)-(b.dist??99));
    const chave=g.ks.slice().sort().join('|'); vivos.add(chave);
    const mostra=g.ps.slice(0,MAX_ROSTOS), resto=g.ps.length-mostra.length;
    const porLinha=g.ps.length<=6?6:Math.min(6,Math.ceil(Math.sqrt(mostra.length+(resto>0?1:0))*1.4));   // até 6 numa fileira só
    const assinatura=tam+'#'+porLinha+'#'+mostra.map(p=>p.id+(p.foto||'')).join(',')+'#'+resto;
    let el=box._p[chave];
    if(!el){el=document.createElement('div');el.className='pino';box.appendChild(el);box._p[chave]=el;
      el.onpointerdown=e=>e.stopPropagation()}
    if(el._a!==assinatura){
      el._a=assinatura;
      const multi=g.ks.length>1;
      el.classList.toggle('grupo',multi);
      el.style.setProperty('--cor',COR_C[g.ps[0].circ??0]);
      el.style.setProperty('--t',tam+'px');
      el.style.setProperty('--por',Math.min(porLinha,mostra.length+(resto>0?1:0)));
      el.title=(multi?g.ks.length+' casas · ':'')+g.ps.map(q=>q.nome).join(', ');
      el.innerHTML=`<div class="cab">${mostra.map(p=>`<span class="rosto" style="--c:${COR_C[p.circ??0]}">${p.foto?`<img src="${fotoSrc(p.foto)}" alt="" draggable="false" decoding="async">`:(fem(p)?'👩':'👤')}</span>`).join('')}
        ${resto>0?`<span class="rosto mais">+${resto}</span>`:''}</div><div class="rabo"></div>${multi?`<span class="nc">${g.ks.length} casas</span>`:''}`;
      el.onclick=e=>{e.stopPropagation();
        if(multi&&!MAPA.modo){   // grupo de várias casas: aproxima até elas se separarem
          const el2=$('#mv'); mapaZoom(Math.max(1,Math.min(3,19-Math.round(MAPA.z))),g.x,g.y); return}
        mapaCliquePino(g.ks[0])};
    }
    el.style.left=g.x+'px'; el.style.top=g.y+'px';
    el.classList.toggle('alvo',g.ks.includes(MAPA.balao));
  }
  for(const k in box._p) if(!vivos.has(k)){box._p[k].remove();delete box._p[k]}
  // o balão também é criado uma vez: recriar apagaria o que você está digitando nele
  const gs=gruposCasa(), gb=MAPA.balao&&gs[MAPA.balao];
  let b=box._b;
  if(!gb){if(b){b.remove();box._b=null}return}
  const bx=mX(gb.c.lng,z)-x0, by=mY(gb.c.lat,z)-y0;
  const ass=MAPA.balao+'#'+gb.ps.map(p=>p.id+p.local_data+p.endereco).join(',');
  if(!b||b._a!==ass){
    const antes=b&&b.querySelector('#casa_in'), texto=antes?antes.value:'', foco=antes&&document.activeElement===antes;
    if(b)b.remove();
    const tmp=document.createElement('div'); tmp.innerHTML=balaoCasa(MAPA.balao,gb,bx,by,H); b=tmp.firstElementChild;
    b._a=ass; box.appendChild(b); box._b=b;
    if(texto){const i=b.querySelector('#casa_in'); i.value=texto; casaBuscar(MAPA.balao,texto); if(foco)i.focus({preventScroll:true})}
  }
  b.style.left=bx+'px'; b.style.top=by+'px';
  const baixo=H-by>by-60; b.classList.toggle('baixo',baixo);
  b.style.setProperty('--cabe',Math.max(110,(baixo?H-by-20:by-80)-150)+'px');
}
function balaoCasa(k,g,x,y,H){
  const baixo=H-y>y-60, cabe=Math.max(110,(baixo?H-y-20:y-80)-150);
  const ends=[...new Set(g.ps.map(q=>q.endereco).filter(Boolean))];
  return `<div class="balao ${baixo?'baixo':''}" style="left:${x}px;top:${y}px;--cabe:${cabe}px" onclick="event.stopPropagation()" onpointerdown="event.stopPropagation()" onwheel="event.stopPropagation()">
    <button class="fx" onclick="MAPA.balao=null;agendar()">✕</button>
    <div class="end">${ends.length?esc(ends.join(' · ')):'sem endereço escrito — só o pino'}
      · <b style="color:var(--ink)">${g.ps.length} ${g.ps.length>1?'moram aqui':'mora aqui'}</b></div>
    <div class="ps">${g.ps.map(q=>`<div class="pq2">${foto(q)}<div style="min-width:0">
      <a href="#/p/${q.id}"><b>${esc(q.nome)}</b></a>
      <small>${esc(relTxt(q))}${q.local_data?' · marcado em '+esc(q.local_data):''}</small></div>
      <div class="acs3"><button title="marcou no lugar errado — mover o pino desta pessoa" onclick="mapaMarcar('${q.id}')">✥</button>
      <button title="tirar do mapa" onclick="mapaTirar('${q.id}')">✕</button></div></div>`).join('')}</div>
    <div class="add-casa">
      <input id="casa_in" placeholder="＋ adicionar quem mora aqui…" autocomplete="off" oninput="casaBuscar('${k}',this.value)">
      <div id="casa_res"></div></div>
  </div>`;
}
// clique num pino: se está marcando alguém, a pessoa entra NESTA casa (mesma coordenada exata)
function mapaCliquePino(k){
  if(MAPA.modo){const g=gruposCasa()[k]; if(g){const c=localDe(g.ps[0]);
    MAPA.endPend=MAPA.endPend||g.ps.find(p=>p.endereco)?.endereco||''; mapaSalvarPino(MAPA.modo,c.lat,c.lng); return}}
  MAPA.balao=MAPA.balao===k?null:k; agendar();
}
function casaBuscar(k,q){
  const box=$('#casa_res'); q=norm(q); if(q.length<2){box.innerHTML='';return}
  const g=gruposCasa()[k], ja=new Set(g.ps.map(p=>p.id));
  const m=Object.values(PESSOAS).filter(p=>!ja.has(p.id)&&!p.falecido&&(norm(p.nome).includes(q)||norm(p.apelido||'').includes(q)))
    .sort((a,b)=>(!!localDe(a))-(!!localDe(b))||(b.circ??0)-(a.circ??0)).slice(0,6);
  box.innerHTML=m.map(p=>`<div class="pq2" style="cursor:pointer" onclick="casaAdicionar('${k}','${p.id}')">${foto(p)}
    <div style="min-width:0"><b>${esc(p.nome)}</b><small>${esc(relTxt(p))}${localDe(p)?' · <span style="color:var(--warn)">já tem pino em outro lugar — vai mudar para cá</span>':''}</small></div></div>`).join('')
    ||'<div class="mut small" style="padding:6px">ninguém com esse nome</div>';
}
async function casaAdicionar(k,id){
  const g=gruposCasa()[k]; const c=localDe(g.ps[0]);
  MAPA.endPend=g.ps.find(p=>p.endereco)?.endereco||'';
  await mapaSalvarPino(id,c.lat,c.lng,true);
  setTimeout(()=>{const i=$('#casa_in'); if(i)i.focus({preventScroll:true})},50);
}

// ---------------------------------------------------------------- arrastar (com inércia), zoom contínuo
function mapaLigar(){
  const el=$('#mv'); let ini=null, moveu=false, hist=[], inerc=null;
  const pararInercia=()=>{if(inerc){cancelAnimationFrame(inerc);inerc=null}};
  el.onpointerdown=e=>{if(e.button!==0||!e.isPrimary)return; pararInercia();
    ini={x:e.clientX,y:e.clientY,cx:mX(MAPA.lng,MAPA.z),cy:mY(MAPA.lat,MAPA.z)}; moveu=false; hist=[];
    el.setPointerCapture(e.pointerId)};
  el.onpointermove=e=>{if(!ini||!e.isPrimary||MAPA.pinca)return; const dx=e.clientX-ini.x, dy=e.clientY-ini.y;
    if(!moveu&&Math.hypot(dx,dy)<4)return; moveu=true; el.classList.add('arrastando');
    hist.push({x:e.clientX,y:e.clientY,t:performance.now()}); if(hist.length>6)hist.shift();
    centrarMundo(ini.cx-dx,ini.cy-dy); agendar()};
  el.onpointerup=e=>{if(!e.isPrimary)return;el.classList.remove('arrastando');if(MAPA.pincou){ini=null;return}
    if(ini&&!moveu){                       // foi clique, não arrasto
      const r=el.getBoundingClientRect(), W=el.clientWidth,H=el.clientHeight;
      const wx=mX(MAPA.lng,MAPA.z)-W/2+(e.clientX-r.left), wy=mY(MAPA.lat,MAPA.z)-H/2+(e.clientY-r.top);
      if(MAPA.modo) mapaSalvarPino(MAPA.modo,latDe(wy,MAPA.z),lngDe(wx,MAPA.z));
      else if(MAPA.balao){MAPA.balao=null;agendar()}
      $('#geo_res').innerHTML='';
    }else if(hist.length>=2){               // soltou em movimento: desliza e para
      const a=hist[0],b=hist[hist.length-1],dt=Math.max(16,b.t-a.t);
      let vx=(b.x-a.x)/dt*16, vy=(b.y-a.y)/dt*16;
      if(performance.now()-b.t<80&&Math.hypot(vx,vy)>1.5){
        const passo=()=>{vx*=.9;vy*=.9; if(Math.hypot(vx,vy)<.4){inerc=null;return}
          centrarMundo(mX(MAPA.lng,MAPA.z)-vx,mY(MAPA.lat,MAPA.z)-vy); mapaDesenhar(); inerc=requestAnimationFrame(passo)};
        inerc=requestAnimationFrame(passo);
      }
    }
    ini=null};
  el.onwheel=e=>{e.preventDefault(); pararInercia();
    const r=el.getBoundingClientRect();
    // trackpad (pinça ou dois dedos) manda passos pequenos e muitos; roda de mouse manda ~100
    const d=-e.deltaY*(e.ctrlKey?0.012:(Math.abs(e.deltaY)>=50?0.0045:0.006));
    zoomEm(MAPA.z+Math.max(-1,Math.min(1,d)),e.clientX-r.left,e.clientY-r.top); agendar()};
  el.ondblclick=e=>{const r=el.getBoundingClientRect(); mapaZoom(1,e.clientX-r.left,e.clientY-r.top)};
  document.onkeydown=e=>{if(e.key==='Escape'&&MAPA.modo){MAPA.modo=null;agendar();mapaLado()}};
  window.onresize=()=>{if(location.hash.startsWith('#/mapa'))agendar()};
  ligarPinca(el);
}
function centrarMundo(wx,wy){
  const n=TS*2**MAPA.z;
  MAPA.lng=lngDe(wx,MAPA.z); MAPA.lat=Math.max(-85,Math.min(85,latDe(Math.max(0,Math.min(n,wy)),MAPA.z)));
}
// muda o zoom mantendo parado o ponto que está embaixo do cursor
function zoomEm(nz,mx,my){
  const el=$('#mv'); const W=el.clientWidth,H=el.clientHeight, z=MAPA.z;
  nz=Math.max(ZMIN,Math.min(ZMAX,nz)); if(nz===z)return;
  const lng=lngDe(mX(MAPA.lng,z)-W/2+mx,z), lat=latDe(mY(MAPA.lat,z)-H/2+my,z);
  MAPA.z=nz; MAPA.lng=lngDe(mX(lng,nz)-mx+W/2,nz); MAPA.lat=latDe(mY(lat,nz)-my+H/2,nz);
}
// botões e duplo clique: animado, ~220 ms
function mapaZoom(d,mx,my){
  const el=$('#mv'); if(!el)return; mx=mx??el.clientWidth/2; my=my??el.clientHeight/2;
  const de=MAPA.z, para=Math.max(ZMIN,Math.min(ZMAX,Math.round(MAPA.z)+d)), t0=performance.now();
  const passo=t=>{const k=Math.min(1,(t-t0)/220), e=1-Math.pow(1-k,3);
    zoomEm(de+(para-de)*e,mx,my); mapaDesenhar(); if(k<1)requestAnimationFrame(passo)};
  requestAnimationFrame(passo);
}
function mapaIr(lat,lng,z){MAPA.lat=lat;MAPA.lng=lng;MAPA.z=z||MAPA.z;agendar()}
function mapaEnquadrar(){
  const cs=Object.values(PESSOAS).filter(noFiltroMapa).map(localDe).filter(Boolean);
  if(!cs.length){toast('Ainda não há ninguém marcado no mapa');return}
  const el=$('#mv'), W=el.clientWidth-80, H=el.clientHeight-120;
  const la=cs.map(c=>c.lat), ln=cs.map(c=>c.lng);
  const lat=(Math.min(...la)+Math.max(...la))/2, lng=(Math.min(...ln)+Math.max(...ln))/2;
  let z=18; while(z>ZMIN){const w=mX(Math.max(...ln),z)-mX(Math.min(...ln),z), h=mY(Math.min(...la),z)-mY(Math.max(...la),z);
    if(w<=W&&h<=H)break; z--}
  mapaIr(lat,lng,z);
}

// ---------------------------------------------------------------- endereço digitado
async function mapaBuscar(q,paraPino){
  const box=$('#geo_res'); if(!q||q.trim().length<3)return;
  box.innerHTML='<div class="geo-res"><div>procurando…</div></div>';
  const j=await (await fetch('/api/geocode?q='+encodeURIComponent(q))).json();
  const rs=j.resultados||[];
  if(!rs.length){box.innerHTML='<div class="geo-res"><div>nada encontrado — tente só a rua e a cidade</div></div>';return}
  if(rs[0].erro){box.innerHTML=`<div class="geo-res"><div>${esc(rs[0].erro)}</div></div>`;return}
  window._geo=rs;
  box.innerHTML=`<div class="geo-res">${rs.map((r,i)=>`<div onclick="mapaEscolherGeo(${i},${paraPino?1:0})">📍 ${esc(r.nome)}</div>`).join('')}</div>`;
}
function mapaEscolherGeo(i,paraPino){
  const r=window._geo[i]; $('#geo_res').innerHTML='';
  mapaIr(r.lat,r.lng,paraPino?18:15);
  if(paraPino&&MAPA.modo) toast('Agora clique no telhado exato — o endereço fica guardado junto');
}
function mapaEndereco(){
  const p=PESSOAS[MAPA.modo]; if(!p)return;
  const q=prompt('Endereço de '+p.nome.split(' ')[0]+' (rua, número, bairro, cidade):',p.endereco||MAPA.endPend||'');
  if(!q)return; MAPA.endPend=q.trim(); mapaBuscar(q,true);
}

// ---------------------------------------------------------------- gravar
function mapaMarcar(id){MAPA.modo=id; MAPA.balao=null; MAPA.endPend=''; mapaDesenhar(); mapaLado();
  toast('Clique no mapa onde '+PESSOAS[id].nome.split(' ')[0]+' mora')}
async function mapaSalvarPino(id,lat,lng,naCasa){
  const corpo={id,local:lat.toFixed(6)+','+lng.toFixed(6)};
  if(MAPA.endPend) corpo.endereco=MAPA.endPend;
  const j=await (await fetch('/api/salvar',{method:'POST',body:JSON.stringify(corpo)})).json();
  if(j.erro){toast('Erro: '+j.erro);return}
  PESSOAS=j.pessoas; PAD=null; _cacheF=null;
  MAPA.balao=lat.toFixed(4)+','+lng.toFixed(4); MAPA.modo=null; MAPA.endPend='';
  toast(naCasa?'🏠 '+PESSOAS[id].nome.split(' ')[0]+' adicionado nesta casa':'📍 '+PESSOAS[id].nome.split(' ')[0]+' marcado no mapa');
  mapaDesenhar(); mapaLado(); desenharMenu();
}
async function mapaTirar(id){
  if(!confirm('Tirar '+PESSOAS[id].nome+' do mapa?'))return;
  const j=await (await fetch('/api/salvar',{method:'POST',body:JSON.stringify({id,local:''})})).json();
  if(j.erro){toast('Erro: '+j.erro);return}
  PESSOAS=j.pessoas; PAD=null; MAPA.balao=null; mapaDesenhar(); mapaLado();
}

// ---------------------------------------------------------------- lista do lado
function mapaLado(){
  const el=$('#mlado'); if(!el)return;
  const q=norm(MAPA.q);
  const base=Object.values(PESSOAS).filter(p=>noFiltroMapa(p)&&!p.falecido&&(!q||norm(p.nome).includes(q)||norm(p.apelido||'').includes(q)));
  const com=base.filter(p=>localDe(p)), sem=base.filter(p=>!localDe(p)&&!p.esqueleto);
  const l=(MAPA.aba==='sem'?sem:com).sort((a,b)=>(b.circ??0)-(a.circ??0)||(a.dist??99)-(b.dist??99)||norm(a.nome).localeCompare(norm(b.nome)));
  el.innerHTML=`<div class="cab2">
      <div class="seg" style="width:100%"><button style="flex:1" class="${MAPA.aba==='sem'?'on':''}" onclick="MAPA.aba='sem';mapaLado()">Sem pino (${sem.length})</button>
        <button style="flex:1" class="${MAPA.aba==='com'?'on':''}" onclick="MAPA.aba='com';mapaLado()">No mapa (${com.length})</button></div>
      <input placeholder="filtrar por nome…" value="${esc(MAPA.q)}" oninput="MAPA.q=this.value;mapaLado();this.focus();this.setSelectionRange(this.value.length,this.value.length)"></div>
    <div class="lst">${l.slice(0,250).map(p=>{const c=localDe(p);

function exportarCSV(){
  const cab=['id','nome','apelido','nascimento','sexo','cpf','telefone','email','oficio','pai','mae','circulo','links'];
  const esc2=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const linhas=Object.values(PESSOAS).sort((a,b)=>norm(a.nome).localeCompare(norm(b.nome))).map(p=>
    [p.id,p.nome,p.apelido,p.data_nascimento,p.sexo,p.cpf,p.telefone,p.email,p.oficio,p.pai_nome,p.mae_nome,
     CIRC_ROT[p.circ??0][1],(p.links||[]).map(x=>x.url).join(' | ')].map(esc2).join(','));
  const blob=new Blob(['﻿'+cab.join(',')+'\n'+linhas.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='banco-de-pessoas-'+new Date().toISOString().slice(0,10)+'.csv';
  a.click(); URL.revokeObjectURL(a.href);
  toast(Object.keys(PESSOAS).length+' fichas exportadas');
}

function f_todos(marcar){
  const dec=IMP.decisoes||{};

async function criarSelecionados(){
  const dec=IMP.decisoes||{};

  if(!alvo.length)return;
  if(!confirm(`Criar ${alvo.length} ficha(s) nova(s)?\n\nCada uma nasce com nome, telefone e ofício da agenda. Você completa depois.`))return;
  const r=await fetch('/api/importacao',{method:'POST',
    body:JSON.stringify({lote:IMP.lote,acoes:alvo.map(c=>({tipo:'criar',chave:c.chave,contato:c}))})});
  const j=await r.json();
  if(j.erro){toast('Erro: '+j.erro);return}
  PESSOAS=j.pessoas; PAD=null; alvo.forEach(c=>IMP.decisoes[c.chave]={tipo:'criar'});

// ------------------------------------------------------------ descobertas
// Nenhum número desta tela está gravado em ficha nenhuma. Tudo sai de data de
// nascimento + sexo + pai/mãe, cruzados de cima. São perguntas que os dados já
// respondiam e que ninguém tinha feito.
// rosca em SVG puro: sem biblioteca, sem CDN. Recebe [{rot,n,cor}].
function rosca(dados,tam){
  tam=tam||168;
  const tot=dados.reduce((a,b)=>a+b.n,0)||1, R=tam/2, r=R*0.62, C=2*Math.PI*((R+r)/2);
  let acc=0;
  const aneis=dados.map(d=>{
    const frac=d.n/tot, dash=frac*C, off=-acc*C; acc+=frac;
    return `<circle cx="${R}" cy="${R}" r="${(R+r)/2}" fill="none" stroke="${d.cor}"

  }).join('');
  return `<div class="rosca">
    <svg width="${tam}" height="${tam}" viewBox="0 0 ${tam} ${tam}">${aneis}
      <text x="${R}" y="${R-3}" text-anchor="middle" fill="#f3f4f9" font-size="25" font-weight="700"

  </div>`;
}
// colunas verticais, no estilo do gráfico de receita da referência

}

function chips(F){

function fato(v,k,cls){return v===''||v===null||v===undefined?'':`<div class="fato"><div class="v ${cls||''}">${v}</div><div class="k">${k}</div></div>`}
function blocoFatos(F,p){
  const A=F.ancestral_mais_antigo, f=[];
  if(F.idade!==undefined) f.push(fato(p.falecido?`Faria ${F.idade}`:F.idade+' anos', p.falecido?'idade que teria':'idade hoje'));
  if(F.dias_ate_aniversario!==undefined&&!p.falecido)
    f.push(fato(F.dias_ate_aniversario===0?'Hoje':F.dias_ate_aniversario+' dias','para o aniversário','b'));
  if(F.signo) f.push(fato(F.signo,'signo · nasceu numa '+F.dia_semana,'s'));
  if(F.ordem) f.push(fato(F.ordem,'entre os irmãos'));
  if(F.linhas&&F.linhas.mae_id) f.push(fato(F.linhas.mae_id.replace('Parto aos ',''),'idade da mãe no parto','b'));
  if(F.linhas&&F.linhas.pai_id) f.push(fato(F.linhas.pai_id.replace('Pai aos ',''),'idade do pai','b'));
  if(F.idade_primeiro_filho!==undefined) f.push(fato(F.idade_primeiro_filho,'idade no primeiro filho'));
  if(F.n_filhos) f.push(fato(F.n_filhos+(F.janela_filhos?` <span class="mut" style="font-size:12px">(${F.janela_filhos})</span>`:''),'filhos'));
  if(F.n_descendentes>F.n_filhos) f.push(fato(F.n_descendentes,'descendentes'));
  if(F.n_parentes) f.push(fato(F.n_parentes,'parentes na base'));
  if(F.geracoes_acima) f.push(fato(F.geracoes_acima,'gerações mapeadas acima'));
  if(A) f.push(fato(`<a href="#/p/${A.id}">${esc(A.nome.split(' ').slice(0,2).join(' '))}</a>`,`ancestral mais antigo · ${A.geracoes} gerações`,'s'));
  if(F.n_familia) f.push(fato(F.n_familia,`na família (${F.n_familia_completas} com ficha)`));
  if(F.dias_de_vida&&F.idade<3) f.push(fato(F.dias_de_vida,'dias de vida'));
  if((F.mesmo_dia||[]).length) f.push(fato(F.mesmo_dia.length,'nascidos no mesmo dia'));
  if((F.esqueletos_ligados||[]).length) f.push(fato(F.esqueletos_ligados.length,'parentes sem ficha completa'));
  if(!f.filter(Boolean).length) return '';
  return `<h2>◆ Calculado <span class="n">ninguém digita nada disso — sai sozinho de nome, data, sexo e pai/mãe</span></h2>
    <div class="fatos">${f.join('')}</div>`;
}

// ---------------- o que mais dá para saber desta pessoa sem digitar nada
function blocoCruzado(F,p){
  const partes=[];

  // 1. quanto da árvore de ancestrais está preenchido, geração por geração
  const A=(F.arvore_preenchida||[]).filter(g=>g.geracao<=4);
  if(A.length&&A[0].tem){
    partes.push(`<div class="bloco"><h3>🧩 Quanto da árvore está preenchido</h3>
      <div class="sub">Cada geração dobra: 2 pais, 4 avós, 8 bisavós, 16 tataravós.
      Isto mostra exatamente onde falta gente — e é calculado, não contado à mão.</div>
      <div class="barras">${A.map(g=>`<div class="bar ${g.pct<50?'fraca':''}">
        <span class="t">${g.rotulo}</span>
        <span class="f"><i style="width:${g.pct}%"></i></span>
        <span class="v">${g.tem}<small>/${g.podia}</small></span></div>`).join('')}</div></div>`);
  }

  // 2. as portas fechadas: ancestrais sem pai nem mãe na base
  const PS=(F.pontas_soltas||[]).slice(0,6);
  if(PS.length){
    partes.push(`<div class="bloco"><h3>🚪 Onde a árvore para</h3>
      <div class="sub">Estes já estão na base mas não têm pai nem mãe cadastrados. Descobrir os pais
      de quem está no topo da lista é o que mais destrava árvore de uma vez só.</div>
      <div class="recs">${PS.map(x=>`<div class="rec">
        <div class="q"><a href="#/p/${x.id}">${esc(x.nome)}</a>
          <small>${x.geracao===1?'pai/mãe':x.geracao===2?'avô/avó':x.geracao===3?'bisavô/bisavó':x.geracao+'ª geração acima'}${x.esqueleto?' · ficha esqueleto':''}</small></div>
        <div class="val">+${x.bloqueia}</div></div>`).join('')}</div>
      <div class="ressalva">A coluna da direita é quantos ancestrais entrariam de uma vez se essa porta abrisse.</div></div>`);
  }

  // 3. a vida reprodutiva: da própria pessoa e da mãe/pai dela
  const vr=(v,quem)=>{
    if(!v) return '';
    const j=v.janela?` — ${v.janela} anos entre o primeiro e o último`:'';
    const iv=v.intervalo_medio?`, um a cada ${v.intervalo_medio} anos`:'';
    return `<div class="rec"><div class="q">${quem}<small>${v.n} filho${v.n>1?'s':''}${j}${iv}</small></div>
      <div class="val">${v.primeiro}${v.ultimo!==v.primeiro?'–'+v.ultimo:''} anos</div></div>`;
  };
  const nomeM=p.mae_id&&PESSOAS[p.mae_id]?PESSOAS[p.mae_id].nome.split(' ')[0]:'A mãe';
  const nomeP=p.pai_id&&PESSOAS[p.pai_id]?PESSOAS[p.pai_id].nome.split(' ')[0]:'O pai';
  const rs=[vr(F.reprodutiva,'Esta pessoa'),vr(F.reprodutiva_mae,esc(nomeM)),vr(F.reprodutiva_pai,esc(nomeP))].filter(Boolean);
  if(rs.length){
    partes.push(`<div class="bloco"><h3>👶 Com que idade cada um teve filhos</h3>
      <div class="sub">Sai da diferença entre a data de nascimento de cada um e a dos filhos. Nada digitado.</div>
      <div class="recs">${rs.join('')}</div></div>`);
  }

  if(!partes.length) return '';
  return `<h2>🔍 Cruzamentos <span class="n">o que as datas e os vínculos respondem sozinhos${F.geracao?` · ${F.geracao}ª geração da própria família`:''}</span></h2>
    <div class="desc">${partes.join('')}</div>`;
}

// ================================================================ ÁRVORE COMPLETA (v2 · 01/10/2026)
// Pedido dele (01/10/2026): "a árvore só mostra no máximo a tia — quero que mostre TODO MUNDO que está conectado
// (primos, irmão da avó, irmão do pai…) e, embaixo de cada um, o que aquela pessoa é da ficha aberta".
//   • SANGUE  = todo descendente de todo ancestral da pessoa aberta, sem limite de grau (primo de 3º grau,
//               tio-bisavô, filho do primo…), + o pai/mãe que falta de cada filho que aparece (card "Pai de …").
//   • TUDO CONECTADO = qualquer pessoa alcançável por pai/mãe/filho (a família dos meio-irmãos, a do outro lado
//               dos primos…). Quem não é de sangue aparece tracejado e descrito pelo FATO ("Pai de Fulana" ·
//               "Fulana é meia-irmã") — nunca vira "tio de consideração" (regra dele: só parentesco documentado).
//   • Tudo é calculado aqui, só com pai_id/mae_id, então o painel do Mac e o app do celular desenham igual.
//   • Desenho em camadas (uma linha por geração), casais colados, irmãos juntos por ordem de nascimento,
//     linhas em "pente" (pais → barra → filhos), o lado do pai à esquerda e o da mãe à direita.

try{const s=JSON.parse(localStorage.getItem('arv_pref')||'{}');

function arvPref(){try{localStorage.setItem('arv_pref',JSON.stringify({modo:ARV.modo,vista:ARV.vista,idades:ARV.idades}))}catch(e){}}
const arvToque=()=>window.matchMedia('(hover:none)').matches||window.innerWidth<=900;

// ---------------------------------------------------------------- índices e utilidades
function arvIdx(){
  if(ARV._de===PESSOAS) return ARV._f;
  const f={};
  for(const q of Object.values(PESSOAS)) for(const k of ['pai_id','mae_id']){

      des.push(w?s/w:X.get(cl[0])-offs[0]); wts.push(w||.15); if(i) gaps.push(gapEntre(row[i-1],cl))});
    const L=pav(des,wts,larg,gaps); row.forEach((cl,i)=>cl.forEach((id,j)=>X.set(id,L[i]+cl._o[j])))};
  const empacota=()=>rows.forEach(row=>{let x=0; row.forEach((cl,i)=>{if(i)x+=gapEntre(row[i-1],cl); cl.forEach((id,j)=>{if(j)x+=AV.CASAL; X.set(id,x+W(id)/2); x+=W(id)})})});
  const relaxa=n=>{for(let it=0;it<n;it++){for(const r of rows) passo(r); for(let i=rows.length-1;i>=0;i--) passo(rows[i])}};
  const reordena=(row,usa)=>{
    row.forEach((cl,i)=>{cl.splice(0,cl.length,...arrumar(cl)); let s=0,n=0;
      cl.forEach(id=>{const t=usa==='P'?tP(id):tC(id); if(t!==null){s+=t; n++}});
      cl._k=n?s/n:cl.reduce((a,id)=>a+X.get(id),0)/cl.length;
      cl._n=Math.min(...cl.map(arvNasc)); cl._x=cl.reduce((a,id)=>a+X.get(id),0)/cl.length});
    row.sort((a,b)=>Math.abs(a._k-b._k)>.5?a._k-b._k:(a._n-b._n)||(a._x-b._x));
  };
  const cruzamentos=()=>{let c=0,len=0;
    for(const u of M.U.values()){const ps=u.pais.filter(p=>X.has(p)); if(!ps.length)continue; const ux=ps.reduce((a,p)=>a+X.get(p),0)/ps.length;
      for(const c1 of u.filhos) len+=Math.abs(X.get(c1)-ux)}
    const ar=[]; for(const u of M.U.values()){const ps=u.pais; const ux=ps.reduce((a,p)=>a+X.get(p),0)/ps.length; const g=M.gen.get(u.filhos[0]);
      for(const c1 of u.filhos) ar.push([g,ux,X.get(c1)])}
    for(let i=0;i<ar.length;i++)for(let j=i+1;j<ar.length;j++){const a=ar[i],b=ar[j]; if(a[0]===b[0]&&(a[1]-b[1])*(a[2]-b[2])<-1e-6) c++}
    return c*100000+len};
  empacota(); rows.forEach(r=>r.forEach(cl=>cl.splice(0,cl.length,...arrumar(cl)))); relaxa(6);
  let melhor=null, nota=Infinity;
  const guarda=()=>{const n=cruzamentos(); if(n<nota){nota=n; melhor=rows.map(r=>r.map(cl=>cl.slice()))}};
  guarda();
  for(let it=0;it<8;it++){
    for(let i=1;i<rows.length;i++) reordena(rows[i],'P');
    empacota(); relaxa(5); guarda();
    for(let i=rows.length-2;i>=0;i--) reordena(rows[i],'C');
    empacota(); relaxa(5); guarda();
  }
  rows=melhor; empacota(); rows.forEach(r=>r.forEach(cl=>cl.splice(0,cl.length,...arrumar(cl)))); empacota(); relaxa(40);
  // y: cada geração numa linha; o vão entre linhas cresce com o nº de barras que precisam passar ali
  let minX=Infinity,maxX=-Infinity; for(const [id,x] of X){minX=Math.min(minX,x-W(id)/2); maxX=Math.max(maxX,x+W(id)/2)}
  const dx=AV.MARG-minX; for(const [id,x] of X) X.set(id,x+dx);
  const idades=id=>{if(!(ARV.idades?M.S.has(id):M.D.has(id))) return []; const q=PESSOAS[id];
    return arvPais(id).filter(p=>M.N.has(p)).map(p=>[p,anosEntre(PESSOAS[p].data_nascimento,q.data_nascimento)]).filter(a=>a[1]!==null)};
  const Y=new Map(), rowsY=[]; let y=AV.TOPO; const lanes={};
  rows.forEach((row,ri)=>{
    const ids=row.flat(), h=Math.max(...ids.map(H));
    if(ri>0){
      const g=gens[ri]; const us=[...M.U.values()].filter(u=>M.gen.get(u.filhos[0])===g)
        .map(u=>{const ps=u.pais.filter(p=>X.has(p)); const ux=ps.reduce((a,p)=>a+X.get(p),0)/ps.length;
          const xs=[ux,...u.filhos.map(c=>X.get(c)),...ps.map(p=>X.get(p))]; return {u,l:Math.min(...xs),r:Math.max(...xs)}})
        .sort((a,b)=>a.l-b.l);
      const fim=[]; for(const it of us){let L=fim.findIndex(r=>r<it.l-10); if(L<0){L=fim.length; fim.push(0)} fim[L]=it.r; lanes[it.u.k]=L}
      const temIdade=ids.some(id=>idades(id).length);
      const gap=26+Math.max(0,fim.length-1)*9+(temIdade?(ids.some(id=>idades(id).length>1)?58:38):30);
      rowsY[ri-1].gap=gap; rowsY[ri-1].nl=fim.length; y+=gap;
    }
    rowsY.push({g:gens[ri],y,h}); ids.forEach(id=>Y.set(id,y)); y+=h;
  });
  const largura=maxX-minX+AV.MARG*2, altura=y+AV.MARG;
  // linhas (SVG)
  let svg='', sobre='', pills='';
  const R=9;
  const pos=id=>({x:X.get(id),y:Y.get(id),w:W(id),h:H(id)});
  for(const u of M.U.values()){
    const ps=u.pais.filter(p=>X.has(p)); if(!ps.length) continue;
    const ri=gens.indexOf(M.gen.get(u.filhos[0])); if(ri<1) continue;
    const ry=rowsY[ri-1], barY=ry.y+ry.h+22+(lanes[u.k]||0)*9;
    const direta=u.filhos.some(c=>M.D.has(c))&&ps.every(p=>M.D.has(p));
    const semSangue=!u.filhos.some(c=>M.S.has(c));
    const cls=direta?'dir':semSangue?'ss':'sg';
    let d='', ux;
    const pp=ps.map(pos).sort((a,b)=>a.x-b.x);
    const colados=ps.length===2&&pp[0].y===pp[1].y&&Math.abs((pp[1].x-pp[1].w/2)-(pp[0].x+pp[0].w/2)-AV.CASAL)<1;
    if(colados){const yc=pp[0].y+44; ux=(pp[0].x+pp[0].w/2+pp[1].x-pp[1].w/2)/2;
      d+=`<path class="cl" d="M${pp[0].x+pp[0].w/2},${yc} H${pp[1].x-pp[1].w/2}"/>`;
      d+=`<path class="ud" d="M${ux},${yc} V${barY}"/>`}
    else if(pp.length===2){ux=(pp[0].x+pp[1].x)/2;
      pp.forEach((a,i)=>{d+=`<path class="ud pd" data-p="${esc(ps.find(p=>X.get(p)===a.x)||'')}" d="M${a.x},${a.y+a.h} V${barY-R} Q${a.x},${barY} ${a.x+(i?-R:R)},${barY} H${ux}"/>`})}
    else{const a=pp[0]; ux=a.x; d+=`<path class="ud" d="M${a.x},${a.y+a.h} V${barY}"/>`}
    for(const c of u.filhos){const b=pos(c); if(b.x===undefined)continue; const s=Math.sign(b.x-ux), top=b.y;
      const dc=Math.abs(b.x-ux)<R+1?`M${ux},${barY} H${b.x} V${top}`:`M${ux},${barY} H${b.x-s*R} Q${b.x},${barY} ${b.x},${barY+R} V${top}`;
      d+=`<path class="cd ${M.D.has(c)&&direta?'dir':''}" data-c="${esc(c)}" d="${dc}"/>`;
      idades(c).forEach(([p,n],i,arr)=>{const mae=fem(PESSOAS[p]); const txt=(mae?'Parto aos ':'Pai aos ')+n, w=Math.round(txt.length*6.1)+16;
        const cy=top-13-(arr.length>1&&!mae?20:0), cor=mae?'#3fd8c2':'#9aa8ff';
        pills+=`<g class="pl"><rect x="${b.x-w/2}" y="${cy-9.5}" width="${w}" height="19" rx="9.5" fill="#12131f" stroke="${cor}" stroke-opacity=".5"/><text x="${b.x}" y="${cy+3.8}" text-anchor="middle" fill="${cor}">${txt}</text></g>`})}
    const gtag=`<g class="u ${cls}" data-u="${esc(u.k)}">${d}</g>`;
    if(cls==='dir') sobre+=gtag; else svg+=gtag;
  }
  return {X,Y,W,H,rows,rowsY,gens,largura,altura,svg:svg+sobre+pills};
}

// ---------------------------------------------------------------- tela
function arvCard(M,L,id){
  const q=PESSOAS[id], I=M.info[id]||{}, x=L.X.get(id), y=L.Y.get(id), w=L.W(id), h=L.H(id);
  const cls=['av-c',id===M.foco?'main':'',M.D.has(id)&&id!==M.foco?'dir':'',I.sangue?'':'ss',q.esqueleto?'esq':''].filter(Boolean).join(' ');
  const idade=q.idade!==null&&q.idade!==undefined&&q.idade!==''?(q.falecido?`faria ${q.idade}`:`${q.idade} anos`):'';
  const sub=[ano(q),idade].filter(Boolean).join(' · ')||(q.esqueleto?'sem dados':'');
  return `<div class="${cls}" data-id="${esc(id)}" style="left:${Math.round(x-w/2)}px;top:${Math.round(y)}px;width:${w}px;height:${h}px">
    ${foto(q,'av-f')}${q.falecido?'<span class="av-x" title="falecido(a)">✝</span>':''}
    <div class="av-n">${esc(arvNome(q))}</div>
    <div class="av-r">${id===M.foco?'ficha aberta':esc(I.rot||'')}</div>
    ${I.det?`<div class="av-d">${esc(I.det)}</div>`:''}
    <div class="av-a">${esc(sub)}</div></div>`;
}
const AV_GEN=g=>g<0?(['','Geração dos pais','Geração dos avós','Geração dos bisavós','Geração dos trisavós','Geração dos tataravós'][-g]||`${-g} gerações acima`)
  :g>0?(['','Geração dos filhos','Geração dos netos','Geração dos bisnetos'][g]||`${g} gerações abaixo`):'Geração dele(a)';

function arvDesenhar(foco,alvo){
  alvo=alvo||$('#arv-wrap'); if(!alvo||!PESSOAS[foco]) return;
  ARV._de=null;   // índice refeito a cada desenho: a ficha pode ter mudado no lugar
  document.querySelectorAll('body > .avw').forEach(a=>{if(a._alvo===alvo)a.remove()});   // a versão em tela cheia que vai ser trocada
  const M=arvModelo(foco,ARV.modo), nTudo=arvContaTudo(foco);
  const nSs=M.N.size-M.S.size;
  const gens=[...new Set(M.gen.values())];
  const resumo=`<b>${M.N.size-1}</b> ${M.N.size===2?'pessoa ligada':'pessoas ligadas'} a ${esc(arvPrim(foco))} · <b>${M.S.size-1}</b> de sangue${nSs?` · <b>${nSs}</b> ${ARV.modo==='tudo'?'sem sangue':'pai/mãe de parente (sem sangue)'}`:''} · <b>${gens.length}</b> ${gens.length===1?'geração':'gerações'}`;
  const seg=(k,v,r)=>`<button class="${ARV[k]===v?'on':''}" data-${k}="${v}">${r}</button>`;
  alvo.innerHTML=`<div class="avw ${arvToque()?'toque':''}" data-foco="${esc(foco)}">
    <div class="av-tit">🌳 Árvore de ${esc(arvNome(PESSOAS[foco]))}</div>
    <div class="av-bar">
      <div class="av-seg">${seg('vista','arvore','🌳 Árvore')}${seg('vista','lista','☰ Lista')}</div>
      <div class="av-seg">${seg('modo','tudo',`Tudo conectado <i>${nTudo-1}</i>`)}${seg('modo','sangue',`Só sangue <i>${M.S.size-1}</i>`)}</div>
      ${ARV.vista==='arvore'?`<label class="av-tg"><input type="checkbox" ${ARV.idades?'checked':''} data-idades="1"> idade dos pais em todos</label>`:''}
      <button class="av-cheia-bt" data-acao="cheia" title="tela cheia">⛶ <span>Tela cheia</span></button>
    </div>
    <div class="av-resumo">${resumo}</div>
    ${M.N.size<2?`<div class="av-vazio">Ninguém ligado a ${esc(arvPrim(foco))} ainda. Use <b>＋ Pai</b>, <b>＋ Mãe</b> ou <b>＋ Filho(a)</b> para começar a árvore.</div>`
      :ARV.vista==='lista'?arvLista(M):`<div class="av-vp"><div class="av-palco"></div><div class="av-gens"></div>
        <div class="av-ctl"><button data-acao="mais" title="aproximar">＋</button><button data-acao="menos" title="afastar">−</button>
          <button data-acao="tudo" title="ver a árvore inteira">⤢</button><button data-acao="foco" title="voltar para ${esc(arvPrim(foco))}">◎</button></div>
        <div class="av-cam"></div><div class="av-sheet"></div></div>
      <div class="legenda av-leg"><span><i class="m"></i>ficha aberta</span><span><i class="dl"></i>linha direta (ascendentes e descendentes)</span><span><i></i>parente de sangue</span><span><i class="s"></i>ligado sem sangue</span><span><i class="d"></i>esqueleto</span><span style="color:#3fd8c2">◆ etiqueta = idade do pai/mãe quando o filho nasceu</span></div>`}
  </div>`;
  const av=alvo.querySelector('.avw'); av._alvo=alvo;
  av.addEventListener('click',e=>{
    const b=e.target.closest('[data-vista],[data-modo]'); if(b){
      if(b.dataset.vista){ARV.vista=b.dataset.vista} if(b.dataset.modo){ARV.modo=b.dataset.modo}
      arvPref(); const cheia=av.classList.contains('cheia'); arvDesenhar(foco,alvo); if(cheia) arvTelaCheia(alvo.querySelector('.avw'),true); return}
    const a=e.target.closest('[data-acao]'); if(a&&a.dataset.acao==='cheia'){arvTelaCheia(av,!av.classList.contains('cheia')); return}
  });
  const tg=av.querySelector('[data-idades]'); if(tg) tg.onchange=()=>{ARV.idades=tg.checked; arvPref(); const cheia=av.classList.contains('cheia'); arvDesenhar(foco,alvo); if(cheia) arvTelaCheia(alvo.querySelector('.avw'),true)};
  const fl=av.querySelector('.av-filtro'); if(fl) fl.oninput=()=>{const q=norm(fl.value);
    av.querySelectorAll('.av-li').forEach(li=>li.style.display=!q||norm(li.dataset.n).includes(q)?'':'none');
    av.querySelectorAll('.av-lg').forEach(g=>g.style.display=[...g.querySelectorAll('.av-li')].some(li=>li.style.display!=='none')?'':'none')};
  if(ARV.vista!=='arvore'||M.N.size<2) return;
  const L=arvLayout(M);
  const vp=av.querySelector('.av-vp'), palco=av.querySelector('.av-palco');
  palco.style.width=L.largura+'px'; palco.style.height=L.altura+'px';
  palco.innerHTML=`<svg width="${L.largura}" height="${L.altura}" viewBox="0 0 ${L.largura} ${L.altura}">${L.svg}</svg>`+[...M.N].map(id=>arvCard(M,L,id)).join('');
  av.querySelector('.av-gens').innerHTML=L.rowsY.map(r=>`<span data-y="${r.y}">${esc(r.g===0?'Geração de '+arvPrim(foco):AV_GEN(r.g))}</span>`).join('');
  arvVista(av,vp,palco,M,L);
}

function arvLista(M){
  const grupos=new Map();
  for(const id of M.N){if(id===M.foco)continue; const I=M.info[id]; const c=I.cat||{t:'Outros',o:9e6};
    (grupos.get(c.t)||grupos.set(c.t,{o:c.o,ids:[]}).get(c.t)).ids.push(id)}
  const gs=[...grupos.entries()].sort((a,b)=>a[1].o-b[1].o||a[0].localeCompare(b[0]));
  const li=id=>{const q=PESSOAS[id], I=M.info[id];
    const idade=q.idade!==null&&q.idade!==undefined&&q.idade!==''?(q.falecido?`faria ${q.idade}`:`${q.idade} anos`):'';
    return `<a class="av-li ${I.sangue?'':'ss'} ${q.esqueleto?'esq':''}" href="#/p/${esc(id)}" data-n="${esc(q.nome+' '+(I.rot||''))}">${foto(q,'av-lf')}
      <span class="av-lt"><b>${esc(arvNome(q))}${q.falecido?' <span class="mut">✝</span>':''}</b><small><em>${esc(I.rot||'')}</em>${I.det?' · '+esc(I.det):''}${idade?' · '+idade:''}</small></span><span class="av-li-s">›</span></a>`};
  return `<input class="av-filtro" placeholder="procurar nesta família…" autocomplete="off">
    <div class="av-lista">${gs.map(([t,g])=>`<div class="av-lg"><h4>${esc(t)} <span class="n">${g.ids.length}</span></h4>
      <div class="av-lc">${g.ids.sort((a,b)=>arvNasc(a)-arvNasc(b)).map(li).join('')}</div></div>`).join('')}</div>`;
}

function arvTelaCheia(av,on){
  // vai para o <body> enquanto estiver em tela cheia: dentro do painel, um pai com efeito visual prenderia o "fixed"
  if(on&&!av._volta){av._volta=document.createComment('arvore'); av.replaceWith(av._volta); document.body.appendChild(av)}
  if(!on&&av._volta){av._volta.replaceWith(av); av._volta=null}
  const vp=av.querySelector('.av-vp');
  // o ponto da árvore que está no meio da tela continua no meio depois de abrir/fechar a tela cheia
  const meio=vp&&vp._st?{x:(vp.clientWidth/2-vp._st.x)/vp._st.s,y:(vp.clientHeight/2-vp._st.y)/vp._st.s}:null;
  av.classList.toggle('cheia',on); document.documentElement.classList.toggle('av-trava',on);
  const b=av.querySelector('.av-cheia-bt'); if(b) b.innerHTML=on?'✕ <span>Fechar</span>':'⛶ <span>Tela cheia</span>';
  if(vp&&vp._mira&&meio) requestAnimationFrame(()=>vp._mira(meio));
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const a=document.querySelector('.avw.cheia'); if(a) arvTelaCheia(a,false)}});
window.addEventListener('hashchange',()=>{document.documentElement.classList.remove('av-trava'); document.querySelectorAll('body > .avw').forEach(a=>a.remove())});

// ---------------------------------------------------------------- arrastar, pinça e zoom
function arvVista(av,vp,palco,M,L){
  const st={s:1,x:0,y:0}, toque=arvToque();
  const gens=av.querySelector('.av-gens');
  const aplica=()=>{palco.style.transform=`translate(${st.x}px,${st.y}px) scale(${st.s})`;
    gens.querySelectorAll('span').forEach(s=>{s.style.transform=`translateY(${Math.round(+s.dataset.y*st.s+st.y-21)}px)`})};
  const limita=()=>{st.s=Math.min(2.2,Math.max(.12,st.s)); const vw=vp.clientWidth, vh=vp.clientHeight, w=L.largura*st.s, h=L.altura*st.s;
    st.x=w<vw?(vw-w)/2:Math.min(60,Math.max(vw-w-60,st.x)); st.y=h<vh?(vh-h)/2:Math.min(60,Math.max(vh-h-60,st.y))};
  const zoomEm=(f,cx,cy)=>{const s0=st.s; st.s=Math.min(2.2,Math.max(.12,st.s*f)); const k=st.s/s0; st.x=cx-(cx-st.x)*k; st.y=cy-(cy-st.y)*k; limita(); aplica()};
  const centra=(id,s)=>{if(s)st.s=s; const x=L.X.get(id), y=L.Y.get(id)+L.H(id)/2; st.x=vp.clientWidth/2-x*st.s; st.y=vp.clientHeight/2-y*st.s; limita(); aplica()};
  const cabe=()=>Math.min(vp.clientWidth/L.largura, vp.clientHeight/L.altura);
  vp._ajusta=()=>{const f=cabe();
    if(f>=(toque?.62:.72)){st.s=Math.min(1,f); st.x=0; st.y=0; limita(); aplica()}
    else centra(M.foco,toque?.6:.8)};
  // altura da janela da árvore: no Mac acompanha o tamanho da árvore; no celular, o quanto cabe na tela
  if(!toque) vp.style.height=Math.round(Math.min(Math.max(440,L.altura*Math.min(1,Math.max(.72,cabeLarg()))+20),window.innerHeight*.8))+'px';
  function cabeLarg(){return vp.clientWidth/L.largura}
  vp._ajusta('normal'); vp._st=st;
  vp._mira=m=>{st.x=vp.clientWidth/2-m.x*st.s; st.y=vp.clientHeight/2-m.y*st.s; limita(); aplica()};
  // ponteiros: 1 dedo/mouse arrasta, 2 dedos = pinça
  const pts=new Map(); let ini=null, pinca=null; ARV.arrastou=false;
  vp.addEventListener('pointerdown',e=>{if(e.target.closest('.av-ctl,.av-sheet'))return; if(e.pointerType==='mouse'&&e.button!==0)return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){ini={x:e.clientX,y:e.clientY,sx:st.x,sy:st.y}; ARV.arrastou=false}
    if(pts.size===2){const [a,b]=[...pts.values()]; const r=vp.getBoundingClientRect();
      pinca={d:Math.hypot(a.x-b.x,a.y-b.y),s:st.s,mx:(a.x+b.x)/2-r.left,my:(a.y+b.y)/2-r.top,x:st.x,y:st.y}; ARV.arrastou=true}
  });
  const move=e=>{if(!pts.has(e.pointerId))return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pinca&&pts.size>=2){const [a,b]=[...pts.values()]; const r=vp.getBoundingClientRect();
      const d=Math.hypot(a.x-b.x,a.y-b.y), mx=(a.x+b.x)/2-r.left, my=(a.y+b.y)/2-r.top;
      st.s=Math.min(2.2,Math.max(.12,pinca.s*d/pinca.d)); const px=(pinca.mx-pinca.x)/pinca.s, py=(pinca.my-pinca.y)/pinca.s;
      st.x=mx-px*st.s; st.y=my-py*st.s; limita(); aplica(); return}
    if(ini){const dx=e.clientX-ini.x, dy=e.clientY-ini.y; if(Math.abs(dx)+Math.abs(dy)>6){ARV.arrastou=true; vp.classList.add('arrastando')}
      if(ARV.arrastou){st.x=ini.sx+dx; st.y=ini.sy+dy; limita(); aplica()}}};
  const solta=e=>{if(!pts.has(e.pointerId))return; pts.delete(e.pointerId); if(pts.size<2)pinca=null;
    if(pts.size===1){const [a]=[...pts.values()]; ini={x:a.x,y:a.y,sx:st.x,sy:st.y}} if(!pts.size){ini=null; vp.classList.remove('arrastando')}};
  window.addEventListener('pointermove',move); window.addEventListener('pointerup',solta); window.addEventListener('pointercancel',solta);

function fecharForm(){$('#modal').classList.remove('on')}
// quem já está ligado a esta pessoa — é o que distingue dois homônimos de verdade
function filhosDe(id){return Object.values(PESSOAS).filter(x=>x.pai_id===id||x.mae_id===id)}
function paisDe(p){return [p.pai_id&&PESSOAS[p.pai_id]?.nome,p.mae_id&&PESSOAS[p.mae_id]?.nome].filter(Boolean)}
function identidade(q){ // a linha que impede escolher o homônimo errado
  const par=[]; 
  const fs=filhosDe(q.id);
  if(q.data_nascimento) par.push(q.data_nascimento+(q.idade!==null&&q.idade!==undefined?` (${q.idade} anos)`:''));
  if(fs.length) par.push('filhos: <b>'+fs.slice(0,3).map(x=>esc(x.nome.split(' ')[0])).join(', ')+(fs.length>3?` +${fs.length-3}`:'')+'</b>');
  const pp=paisDe(q); if(pp.length) par.push('de '+esc(pp.map(n=>n.split(' ')[0]).join(' e ')));
  if(q.cpf) par.push('CPF '+esc(q.cpf));
  if(!par.length) par.push(q.esqueleto?'ficha esqueleto — só o nome':'sem outros dados');
  return par.join(' · ');
}
function mostrarSel(l){const idv=$('#id_'+l).value,nv=$('#novo_'+l).value,s=$('#sel_'+l);
  if(idv&&PESSOAS[idv]){const q=PESSOAS[idv];
    s.className='sel'+(q.esqueleto?' esq':'');
    s.innerHTML=`${foto(q,'av')}<span>✔ ligado à ficha <b>${q.id}</b> — ${identidade(q)}</span>`}
  else if(nv){s.className='sel novo';s.innerHTML=`<span class="av">＋</span><span>vai criar uma ficha NOVA: <b>${esc(nv)}</b></span>`}
  else{s.className='sel';s.innerHTML=''}}
function ligarAC(l,selfId){
  const inp=$('#in_'+l),dd=$('#dd_'+l);
  let foco=-1;
  const grifa=(nome,q)=>{const i=norm(nome).indexOf(q);
    return i<0?esc(nome):esc(nome.slice(0,i))+'<mark>'+esc(nome.slice(i,i+q.length))+'</mark>'+esc(nome.slice(i+q.length))};
  function abrir(){
    const bruto=inp.value.trim(), q=norm(bruto);
    $('#id_'+l).value='';$('#novo_'+l).value='';mostrarSel(l);
    if(q.length<2){dd.style.display='none';return}
    const sexoEsp=l==='pai'?'Masculino':'Feminino';
    const m=Object.values(PESSOAS)
      .filter(x=>x.id!==selfId&&norm(x.nome).includes(q))
      .sort((a,b)=>(norm(a.nome).startsWith(q)?0:1)-(norm(b.nome).startsWith(q)?0:1)
                 ||(a.sexo===sexoEsp?0:1)-(b.sexo===sexoEsp?0:1)
                 ||(a.esqueleto?1:0)-(b.esqueleto?1:0)
                 ||norm(a.nome).localeCompare(norm(b.nome)))
      .slice(0,14);
    // nomes repetidos ENTRE OS RESULTADOS: é o caso perigoso, avisa em vermelho
    const cont={}; m.forEach(x=>cont[norm(x.nome)]=(cont[norm(x.nome)]||0)+1);
    const repetidos=Object.entries(cont).filter(([,n])=>n>1);
    const aviso=repetidos.length?`<div class="avisohom">⚠ ${repetidos.map(([n,c])=>`<b>${c}</b> pessoas diferentes chamadas <b>${esc(n)}</b>`).join(' · ')}. Confira o id, a data e os filhos antes de escolher.</div>`:'';
    dd.innerHTML=aviso+m.map(x=>`<div class="op ${x.esqueleto?'esqop':''}" data-id="${x.id}" ${cont[norm(x.nome)]>1?'style="box-shadow:inset 3px 0 0 var(--red)"':''}>
        ${foto(x,'av')}
        <div><div class="n1">${grifa(x.nome,q)}${x.falecido?' <span class="mut">✝</span>':''}</div>
        <div class="n2">${identidade(x)}</div></div>
        <div class="idc">${x.id}</div></div>`).join('')
      +`<div class="op novo" data-novo="1"><span class="av">＋</span>
        <div><div class="n1">Não é nenhuma dessas — criar pessoa nova</div>
        <div class="n2">cria uma ficha só com o nome “${esc(bruto)}”; você completa depois</div></div></div>`;
    dd.style.display='block'; foco=-1;
    dd.querySelectorAll('.op').forEach(d=>d.onmousedown=e=>{e.preventDefault();escolher(d)});
  }
  function escolher(d){
    if(d.dataset.novo){
      const nome=inp.value.trim();
      const ja=Object.values(PESSOAS).filter(x=>norm(x.nome)===norm(nome));
      if(ja.length&&!confirm(`Já existe ${ja.length===1?'uma ficha':ja.length+' fichas'} com o nome "${nome}" (id ${ja.map(x=>x.id).join(', ')}).\n\nCriar mesmo assim uma pessoa NOVA e diferente?`)) return;
      $('#novo_'+l).value=nome;$('#id_'+l).value='';
    } else {
      $('#id_'+l).value=d.dataset.id;$('#novo_'+l).value='';inp.value=PESSOAS[d.dataset.id].nome;
    }
    dd.style.display='none';mostrarSel(l);
  }
  inp.oninput=abrir;
  inp.onfocus=()=>{if(inp.value.trim().length>=2&&!$('#id_'+l).value)abrir()};
  inp.onblur=()=>setTimeout(()=>dd.style.display='none',160);
  inp.onkeydown=e=>{
    const ops=[...dd.querySelectorAll('.op')];
    if(e.key==='Escape'){dd.style.display='none';return}
    if(!ops.length||dd.style.display==='none')return;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();
      foco=(foco+(e.key==='ArrowDown'?1:-1)+ops.length)%ops.length;
      ops.forEach((o,i)=>o.classList.toggle('foco',i===foco));
      ops[foco].scrollIntoView({block:'nearest'});}
    else if(e.key==='Enter'&&foco>=0){e.preventDefault();escolher(ops[foco])}
  };
}
async function salvar(id){
  const nasc=$('#in_nasc').value.trim();
  if(nasc&&!/^\d{2}\/\d{2}\/\d{4}$/.test(nasc)){toast('Data precisa ser DD/MM/AAAA');return}
  const cm=cpfStatus($('#in_cpf').value);if(cm){toast(cm);return}
  const body={id:id||'',nome:$('#in_nome').value.trim(),data_nascimento:nasc,sexo:$('#in_sexo').value,tipo_sanguineo:$('#in_ts').value,fonte:$('#in_fonte').value,ligar_a:LIGAR_A,
    pai_id:$('#id_pai').value,mae_id:$('#id_mae').value,novo_pai:$('#novo_pai').value,novo_mae:$('#novo_mae').value,
    pai_nome:$('#id_pai').value||$('#novo_pai').value?'':$('#in_pai').value.trim(),mae_nome:$('#id_mae').value||$('#novo_mae').value?'':$('#in_mae').value.trim(),
    cpf:$('#in_cpf').value.trim(),telefone:$('#in_tel').value.trim(),email:$('#in_email').value.trim(),links:$('#in_links').value.split('\n').map(x=>x.trim()).filter(Boolean).join(' | '),fonte_detalhe:$('#in_fonte_det').value.trim(),endereco:$('#in_end').value.trim(),apelido:$('#in_apelido').value.trim(),oficio:$('#in_oficio').value.trim(),
    observacoes:$('#in_obs').value.trim(),falecido:$('#in_fal').checked,esqueleto:$('#in_esq').checked};
  if(!body.nome){toast('Nome é obrigatório');return}
  // Última trava contra o erro do homônimo: antes de gravar, diz de quem essa pessoa vira irmã.
  // Foi assim que um homônimo já entrou na família errada — o nome da mãe existia e era único no banco.
  for(const [lado,rot] of [['pai','pai'],['mae','mãe']]){
    const pid=body[lado+'_id']; if(!pid||!PESSOAS[pid])continue;
    if(id&&PESSOAS[id]&&PESSOAS[id][lado+'_id']===pid)continue;   // vínculo já existia, não repergunta
    const irmaos=filhosDe(pid).filter(x=>x.id!==id);
    if(!irmaos.length)continue;
    const q=PESSOAS[pid];
    const txt=`Você está ligando "${body.nome}" a ${rot}: ${q.nome} (id ${q.id}${q.data_nascimento?', '+q.data_nascimento:''}).\n\n`
      +`Com isso, ${body.nome} passa a ser irmão(ã) de:\n`
      +irmaos.map(x=>'  • '+x.nome+(x.data_nascimento?' ('+x.data_nascimento+')':'')).join('\n')
      +`\n\nÉ essa ${rot} mesmo? Se for outra pessoa com o mesmo nome, cancele e escolha "criar pessoa nova".`;
    if(!confirm(txt))return;
  }
  const r=await fetch('/api/salvar',{method:'POST',body:JSON.stringify(body)});const j=await r.json();
  if(j.erro){toast('Erro: '+j.erro);return}
  PESSOAS=j.pessoas; PAD=null;
  if(FOTO_B64){const f=await (await fetch('/api/foto',{method:'POST',body:JSON.stringify({id:j.id,nome:FOTO_B64.nome,base64:FOTO_B64.b64})})).json();if(f.foto)PESSOAS[j.id].foto=f.foto}
  fecharForm();toast('Salvo: '+PESSOAS[j.id].nome);
  if(location.hash==='#/p/'+j.id)render();else location.hash='#/p/'+j.id;
}

const APP_ID = 'pessoas-de-bolso';
const APP_VERSION = '1.2';
const PREVIEW = !!window.PREVIEW_MODE;
let ID_EU = '';
const CAMPOS = ['id', 'nome', 'cpf', 'data_nascimento', 'sexo', 'tipo_sanguineo', 'pai_id', 'pai_nome', 'mae_id', 'mae_nome',
  'apelido', 'telefone', 'email', 'links', 'oficio', 'observacoes', 'fonte', 'fonte_detalhe',
