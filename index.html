async function apiLocal(url, o) {
  const resp = (obj, st = 200) => new Response(JSON.stringify(obj), { status: st, headers: { 'Content-Type': 'application/json' } });
  const [caminho, qs] = url.split('?');
  const partes = caminho.split('/').filter(Boolean).map(decodeURIComponent);
  const rota = partes[1], metodo = String(o.method || 'GET').toUpperCase();
  try {
    if (metodo === 'POST') {
      const corpo = JSON.parse(o.body || '{}');
      if (rota === 'salvar') return resp(await registrarSalvar(corpo));
      if (rota === 'foto') return resp(await registrarFoto(corpo));
      return resp({ erro: 'Isso só dá pra fazer no painel do Mac.' }, 400);
    }
    switch (rota) {
      case 'pessoas': return resp({ hoje: dayKey(), pessoas: PESSOAS });
      case 'resumo': return resp(resumoJS());
      case 'coerencia': return resp((BASE && BASE.coerencia) || []);
      case 'importacoes': return resp({ lotes: [] });
      case 'padroes': { const r = JSON.parse(JSON.stringify((BASE && BASE.padroes) || {})); r.resumo = resumoJS(); return resp(r); }
      case 'dossie': return resp(dossieJS(partes[2]));
      case 'parentes': return resp(parentesJS(partes[2]));
      case 'galeria': return resp({ id: partes[2], fotos: [] });
      case 'geocode': return resp({ resultados: await geocodeJS(new URLSearchParams(qs || '').get('q') || '') });
      case 'revelar': return resp({ ok: true });
    }
    return resp({ erro: 'rota desconhecida' }, 404);
  } catch (e) { return resp({ erro: String((e && e.message) || e) }, 500); }
}

// ================================================================ cofre: criptografia + GitHub privado
// Igual ao Financeiro e ao Prontuário de Bolso: tudo sai do aparelho já criptografado (AES-256-GCM,
// chave derivada da senha do cofre com PBKDF2-SHA256, 600 mil voltas) e vai pra um repositório PRIVADO.
//   vault.json   a fila de mudanças + ajustes (pequeno, muda sempre)
//   base.json    a base que veio do Mac (grande, muda quando o Mac manda outra)
//   inbox/       caixa de entrada: o que o Claude tranca pro app (só o app abre)
//   saida/       caixa de saída: as mudanças do celular trancadas com a chave do MAC (só o Mac abre)

const KDF_ITER = 600000;
const RSA = { name: 'RSA-OAEP', hash: 'SHA-256' };

const GH = {
  cfg: null,
  async req(path, opts = {}) {
    const headers = { 'Authorization': 'Bearer ' + this.cfg.token, 'Accept': opts.accept || 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
    if (opts.body) headers['Content-Type'] = 'application/json';
    const r = await _fetchOrig('https://api.github.com' + path, { method: opts.method || 'GET', headers, body: opts.body, cache: 'no-store' });

  },
  base() { return '/repos/' + this.cfg.repo; },
  async repoInfo() { const r = await this.req(this.base()); if (r.status === 404) throw Object.assign(new Error('notfound'), { code: 'notfound' }); if (!r.ok) throw new Error('repo ' + r.status); return r.json(); },
  async list(dir) { const r = await this.req(`${this.base()}/contents/${dir}`); if (r.status === 404) return []; if (!r.ok) throw new Error('list ' + r.status); const j = await r.json(); return Array.isArray(j) ? j : []; },
  async raw(path, ref) { const r = await this.req(`${this.base()}/contents/${path}${ref ? '?ref=' + ref : ''}`, { accept: 'application/vnd.github.raw+json' }); if (r.status === 404) return null; if (!r.ok) throw new Error('get ' + r.status); return new Uint8Array(await r.arrayBuffer()); },
  async put(path, bytes, sha, message) {

    if (r.status === 409 || r.status === 422) throw Object.assign(new Error('conflict'), { code: 'conflict' });

    return (await r.json()).content.sha;
  },
  async del(path, sha, message) { const r = await this.req(`${this.base()}/contents/${path}`, { method: 'DELETE', body: JSON.stringify({ message, sha }) }); if (!r.ok && r.status !== 404 && r.status !== 409 && r.status !== 422) throw new Error('del ' + r.status); },
  async commits(path) { const r = await this.req(`${this.base()}/commits?path=${encodeURIComponent(path)}&per_page=40`); if (!r.ok) throw new Error('commits ' + r.status); return r.json(); }
};

/* ---------- caixa de entrada: o que o Claude manda (a base nova do Mac) ----------
   O app cria um par de chaves. A PÚBLICA fica em inbox-key.json: com ela só dá pra TRANCAR.
   A privada fica no mesmo arquivo, criptografada com a senha do cofre — só o app abre. */
const Inbox = {
  priv: null, done: [],
  async ensureKey(root) {
    if (this.priv) return;
    if (root.some(x => x.name === 'inbox-key.json')) {
      const j = JSON.parse(TD.decode(await GH.raw('inbox-key.json')));
      const privJwk = JSON.parse(TD.decode(await decBytes(Vault.key, unb64(j.privEnc))));
      this.priv = await crypto.subtle.importKey('jwk', privJwk, RSA, false, ['decrypt']);
      return;
    }
    const kp = await crypto.subtle.generateKey({ ...RSA, modulusLength: 3072, publicExponent: new Uint8Array([1, 0, 1]) }, true, ['encrypt', 'decrypt']);
    const pub = await crypto.subtle.exportKey('jwk', kp.publicKey), privJwk = await crypto.subtle.exportKey('jwk', kp.privateKey);
    const body = { app: APP_ID, kind: 'inbox-key', v: 1, alg: 'RSA-OAEP-256 + A256GCM', created: new Date().toISOString(), device: deviceName(),
      note: 'Chave PÚBLICA da caixa de entrada do Pessoas de Bolso. Com ela só dá pra trancar arquivos pro app; abrir, só o app (a chave privada abaixo está criptografada com a senha do cofre).',
      pub: { kty: pub.kty, n: pub.n, e: pub.e, alg: pub.alg }, privEnc: b64(await encBytes(Vault.key, TE.encode(JSON.stringify(privJwk)))) };
    try { await GH.put('inbox-key.json', TE.encode(JSON.stringify(body, null, 1)), null, 'Caixa de entrada: chave pública'); }
    catch (e) { if (e.code === 'conflict') return this.ensureKey(await GH.list('')); throw e; }
    try { await GH.put('inbox/LEIA.md', TE.encode('# Caixa de entrada do Pessoas de Bolso\n\nArquivos .json nesta pasta chegam trancados com a chave pública (inbox-key.json), mandados pelo Claude a partir do banco do Mac. O app abre, troca a base e apaga daqui sozinho.\n'), null, 'Caixa de entrada'); } catch (_) {}
    this.priv = await crypto.subtle.importKey('jwk', privJwk, RSA, false, ['decrypt']);
  },
  async open(env) {
    const raw = await crypto.subtle.decrypt(RSA, this.priv, unb64(env.ek));
    const k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    let bytes = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(env.iv) }, k, unb64(env.data)));
    if (env.z === 'gzip') bytes = await gunzip(bytes);
    return JSON.parse(TD.decode(bytes));
  },
  async process(root) {
    await this.ensureKey(root);
    const items = (await GH.list('inbox')).filter(x => x.type === 'file' && /\.json$/i.test(x.name)).sort((a, b) => a.name < b.name ? -1 : 1);
    const labels = [];
    for (const it of items) {
      try {
        const pack = await this.open(JSON.parse(TD.decode(await GH.raw(it.path))));
        if (pack.app !== APP_ID || pack.kind !== 'base') throw new Error('formato');
        const ok = await adotarBase(pack);
        labels.push(ok ? (pack.label || `base do Mac de ${fmtQuando(pack.geradoEm)}`) : 'uma base mais antiga (ignorada)');
        this.done.push(it);
      } catch (e) { if (e.code === 'auth') throw e; console.warn('caixa de entrada', it.name, e && e.message); }
    }
    return labels;
  },
  async cleanup() { const d = this.done.splice(0); for (const it of d) { try { await GH.del(it.path, it.sha, 'Caixa de entrada: recebido no app'); } catch (_) {} } }
};

/* ---------- caixa de saída: as mudanças do celular, trancadas com a chave pública do MAC ----------
   A chave privada do Mac nunca sai do Mac. Nem o GitHub nem o Claude leem sem ela. */
async function trancarPara(pubJwk, texto) {
  const pub = await crypto.subtle.importKey('jwk', { kty: 'RSA', n: pubJwk.n, e: pubJwk.e, alg: 'RSA-OAEP-256', ext: true }, RSA, false, ['encrypt']);
  const aes = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt']);
  const raw = new Uint8Array(await crypto.subtle.exportKey('raw', aes)), iv = crypto.getRandomValues(new Uint8Array(12));
  const data = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, aes, await gzip(TE.encode(texto))));
  const ek = new Uint8Array(await crypto.subtle.encrypt({ name: 'RSA-OAEP' }, pub, raw));
  return { app: APP_ID, kind: 'saida', v: 1, alg: 'RSA-OAEP-256 + A256GCM', z: 'gzip', created: new Date().toISOString(), device: deviceName(), n: S.mudancas.length, ek: b64(ek), iv: b64(iv), data: b64(data) };
}
const Saida = {
  async enviar() {
    const pub = BASE && BASE.macPub; if (!pub) return;
    const atual = (await GH.list('saida')).find(x => x.name === 'mudancas.json');
    if (!S.mudancas.length) { if (atual) await GH.del(atual.path, atual.sha, 'Caixa de saída: o Mac já aplicou tudo'); Vault.cfg.lastOutHash = ''; return; }
    const plain = JSON.stringify({ app: APP_ID, kind: 'mudancas', v: 1, criadoEm: new Date().toISOString(), device: deviceName(), baseGeradaEm: BASE.geradoEm, mudancas: S.mudancas });
    const h = await sha256hex(JSON.stringify(S.mudancas));
    if (atual && h === Vault.cfg.lastOutHash) return;
    await GH.put('saida/mudancas.json', TE.encode(JSON.stringify(await trancarPara(pub, plain))), atual && atual.sha, `Caixa de saída: ${plural(S.mudancas.length, 'mudança', 'mudanças')} (${deviceName()})`);
    Vault.cfg.lastOutHash = h;
  }
};

function isVirgin(st) { return !st || !(st.mudancas || []).length; }
function mergeStates(a, b) {
  if (!a) return b; if (!b) return a;
  const N = ((a.meta && a.meta.updatedAt) || '') >= ((b.meta && b.meta.updatedAt) || '') ? a : b, O = N === a ? b : a;
  const del = { ...((O.meta && O.meta.deleted) || {}), ...((N.meta && N.meta.deleted) || {}) };
  const m = new Map(); for (const x of [...(O.mudancas || []), ...(N.mudancas || [])]) m.set(x.mid, x);
  const ap = new Set((BASE && BASE.aplicadas) || []);
  const mud = [...m.values()].filter(x => !del[x.mid] && !ap.has(x.mid)).sort((x, y) => x.quando < y.quando ? -1 : 1);
  return { ...O, ...N, mudancas: mud, settings: { ...(O.settings || {}), ...(N.settings || {}) }, meta: { ...(O.meta || {}), ...(N.meta || {}), deleted: del } };
}

const Vault = {
  cfg: null, key: null, running: false, again: 0, timer: null, fails: 0, lockUntil: 0, hiddenAt: 0, locked: false,
  async init() {
    if (PREVIEW) return;
    try { this.cfg = await Store.get('vault') || null; } catch (_) { this.cfg = null; }
    if (this.cfg) { this.key = this.cfg.key || null; GH.cfg = this.cfg; }
  },
  async persist() { const c = { ...this.cfg }; try { await Store.put('vault', c); } catch (e) { delete c.key; c.needsPassword = true; this.cfg.needsPassword = true; try { await Store.put('vault', c); } catch (_) {} } },
  schedule(ms = 3500) { if (!this.cfg || !this.key) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.sync(), ms); },
  statusText() {

    if (!navigator.onLine) return 'Sem internet · salva quando voltar';
    if (this.cfg.error) return this.cfg.error;
    if (!this.cfg.lastSync) return 'Ainda não sincronizou';
    const d = new Date(this.cfg.lastSync), hoje = dayKey() === dayKey(d);
    return `Sincronizado ${hoje ? 'hoje' : 'em ' + fmtData(d)} às ${fmtHora(d)}`;
  },
  paintStatus() { document.querySelectorAll('[data-vault-status]').forEach(el => { el.textContent = this.statusText(); }); desenharAbas(); },
  async sync() {

    if (!navigator.onLine) { this.paintStatus(); return; }
    this.running = true; this.paintStatus();
    let retry = false, mudou = false, avisos = [];
    try {
      GH.cfg = this.cfg;
      const root = await GH.list('');
      // 1. a fila de mudanças (junta com a do outro aparelho)
      const vf = root.find(x => x.name === 'vault.json');
      const remoteSha = vf ? vf.sha : null;
      if (remoteSha && remoteSha !== this.cfg.lastSha) {
        const v = JSON.parse(TD.decode(await GH.raw('vault.json')));
        const plain = TD.decode(await decBytes(this.key, unb64(v.data)));
        const remote = JSON.parse(plain);
        S = (this.cfg.lastSha || !isVirgin(S)) ? mergeStates(S, remote) : remote;
        migrate(); await save({ silent: true });
        this.cfg.lastSha = remoteSha;
        if (JSON.stringify(S) === plain) this.cfg.lastHash = await sha256hex(plain);
        mudou = true;
      }
      // 2. a base guardada no cofre (vinda do outro aparelho)
      const bf = root.find(x => x.name === 'base.json');
      if (bf && bf.sha !== this.cfg.lastBaseSha) {
        const v = JSON.parse(TD.decode(await GH.raw('base.json')));
        const nova = JSON.parse(TD.decode(await gunzip(await decBytes(this.key, unb64(v.data)))));

      }
      // 3. caixa de entrada (o que o Claude mandou)
      try { const got = await Inbox.process(root); if (got.length) { avisos.push(...got); mudou = true; } }
      catch (e) { if (e.code === 'auth') throw e; console.warn('caixa de entrada', e && e.message); }
      // 4. base daqui mais nova que a do cofre: sobe
      if (BASE && BASE.geradoEm && BASE.geradoEm > (this.cfg.baseRemota || '')) {
        const body = { app: APP_ID, kind: 'base-cofre', v: 1, z: 'gzip', kdf: { name: 'PBKDF2-SHA256', iter: this.cfg.iter, salt: this.cfg.salt }, geradoEm: BASE.geradoEm, device: deviceName(),
          data: b64(await encBytes(this.key, await gzip(TE.encode(JSON.stringify(BASE))))) };
        this.cfg.lastBaseSha = await GH.put('base.json', TE.encode(JSON.stringify(body)), bf ? bf.sha : null, `Base do Mac de ${fmtQuando(BASE.geradoEm)} (${deviceName()})`);
        this.cfg.baseRemota = BASE.geradoEm;
      }
      // 5. a fila de mudanças: sobe se mudou
      const plain = JSON.stringify(S), h = await sha256hex(plain);
      if (h !== this.cfg.lastHash) {
        const now = new Date();
        const body = { app: APP_ID, kind: 'vault', v: 1, kdf: { name: 'PBKDF2-SHA256', iter: this.cfg.iter, salt: this.cfg.salt }, updatedAt: S.meta.updatedAt || now.toISOString(), device: deviceName(), data: b64(await encBytes(this.key, TE.encode(plain))) };
        this.cfg.lastSha = await GH.put('vault.json', TE.encode(JSON.stringify(body)), remoteSha, `Atualização ${fmtData(now)} ${fmtHora(now)} (${deviceName()})`);
        this.cfg.lastHash = h;
      }
      // 6. caixa de saída pro Mac
      try { await Saida.enviar(); } catch (e) { if (e.code === 'auth') throw e; console.warn('caixa de saída', e && e.message); }
      await Inbox.cleanup();
      this.cfg.lastSync = new Date().toISOString(); this.cfg.error = null;
    } catch (e) {
      if (e.code === 'conflict') retry = true;
      else if (e.code === 'auth') this.cfg.error = 'A chave do GitHub não funciona mais (venceu ou foi apagada). Troque em Ajustes › Cofre.';
      else if (e.code === 'notfound') this.cfg.error = 'Repositório do cofre não encontrado. Confira em Ajustes › Cofre.';
      else if (e.name === 'OperationError') this.cfg.error = 'Não consegui abrir o cofre com esta senha. Reconecte em Ajustes › Cofre.';
      else { this.cfg.error = null; console.warn('cofre', e); }
    } finally {
      this.running = false;
      try { await this.persist(); } catch (_) {}
      this.paintStatus();
      if (mudou) atualizarTela();
      if (avisos.length) toast('Chegou: ' + avisos.join(' · '));
      if ((retry || this.again) && this.again < 4) { this.again = retry ? this.again + 1 : 0; setTimeout(() => this.sync(), 1200); } else this.again = 0;
    }
  },
  async keyFromPassword(pass) { const k = await deriveKey(pass, unb64(this.cfg.salt), this.cfg.iter); await decBytes(k, unb64(this.cfg.check)); return k; }
};

const Lock = {

  touch() { this.cfg.lastActive = Date.now(); this.persist(); },

const b64url = u => b64(u).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const Bio = {
  async available() { try { return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch (_) { return false; } },
  label() { return /iPhone|iPad/.test(navigator.userAgent) ? 'Face ID' : /Macintosh/.test(navigator.userAgent) ? 'Touch ID' : 'digital/rosto'; },
  async register() {
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)), rp: { name: 'Pessoas de Bolso', id: location.hostname },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'pessoas', displayName: 'Pessoas de Bolso' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' }, timeout: 60000, attestation: 'none' } });
    return b64(new Uint8Array(cred.rawId));
  },
  async verify(credId) {
    const ch = crypto.getRandomValues(new Uint8Array(32));
    const a = await navigator.credentials.get({ publicKey: { challenge: ch, rpId: location.hostname, allowCredentials: [{ type: 'public-key', id: unb64(credId) }], userVerification: 'required', timeout: 60000 } });
    if (!a || b64(new Uint8Array(a.rawId)) !== credId) return false;
    const cd = JSON.parse(TD.decode(a.response.clientDataJSON));
    if (cd.type !== 'webauthn.get' || cd.challenge !== b64url(ch)) return false;
    return !!(new Uint8Array(a.response.authenticatorData)[32] & 0x04);
  }
};

  return new Promise(res => {
    dlgAbrir(`<p>${esc(msg)}</p><div class="botoes"><button class="btn" id="dlg-nao">Cancelar</button><button class="btn ${perigo ? 'danger' : 'p'}" id="dlg-sim">${esc(sim)}</button></div>`);
    $('#dlg-nao').onclick = () => { dlgFechar(); res(false); };
    $('#dlg-sim').onclick = () => { dlgFechar(); res(true); };
  });
}
function pedirSegredo(titulo, msg, { pin = false, confirmar = false, ok = 'Confirmar' } = {}) {
  return new Promise(res => {
    const inp = id => `<input id="${id}" type="password" ${pin ? 'inputmode="numeric" maxlength="6" autocomplete="off"' : 'autocomplete="new-password"'} aria-label="${esc(titulo)}">`;
    dlgAbrir(`<form id="sg-form" autocomplete="off" style="display:grid;gap:12px"><b>${esc(titulo)}</b>${msg ? `<p>${esc(msg)}</p>` : ''}
      <label class="campo">${inp('sg-1')}</label>${confirmar ? `<label class="campo"><span>Repita</span>${inp('sg-2')}</label>` : ''}
      <p class="erro-txt" id="sg-err" hidden></p><div class="botoes"><button type="button" class="btn" id="sg-nao">Cancelar</button><button class="btn p">${esc(ok)}</button></div></form>`);
    const fim = v => { dlgFechar(); res(v); };
    $('#sg-nao').onclick = () => fim(null);
    $('#sg-form').onsubmit = e => { e.preventDefault(); const a = $('#sg-1').value, b = confirmar ? $('#sg-2').value : a, er = $('#sg-err');
      if (pin && !/^\d{4,6}$/.test(a)) { er.textContent = 'O PIN tem de 4 a 6 números.'; er.hidden = false; return; }
      if (!pin && a.length < 8) { er.textContent = 'Use pelo menos 8 caracteres.'; er.hidden = false; return; }
      if (a !== b) { er.textContent = 'Não bateu com a repetição.'; er.hidden = false; return; }
      fim(a); };
    setTimeout(() => { const i = $('#sg-1'); i && i.focus(); }, 40);
  });
}

/* ---------- tela de trava ---------- */
let MODO_TRAVA = '';
function mostrarTrava(modo) {
  const t = $('#trava'); Vault.locked = true; MODO_TRAVA = modo || (!Vault.key ? 'senha' : Lock.cfg.mode);
  const m = MODO_TRAVA, isPin = m === 'pin', isBio = m === 'bio';
  t.innerHTML = `<form id="trava-form" autocomplete="off"><div class="sig">🗂️</div><h1 style="margin:0">Pessoas</h1>
    ${isBio ? `<button type="button" class="btn p" style="justify-content:center" onclick="desbloquearBio(false)">Entrar com ${esc(Bio.label())}</button><p class="erro-txt" id="trava-err" hidden></p>
      <button type="button" class="btn" style="justify-content:center" onclick="mostrarTrava('esqueci')">Usar a senha do cofre</button>`
    : `<p class="mut" style="margin:0">${isPin ? 'Digite seu PIN' : 'Digite a senha do cofre'}</p>
      <label class="campo"><input id="trava-in" type="password" ${isPin ? 'inputmode="numeric" maxlength="6" autocomplete="off"' : 'autocomplete="current-password"'} aria-label="${isPin ? 'PIN' : 'Senha do cofre'}"></label>
      <p class="erro-txt" id="trava-err" hidden></p><button class="btn p" style="justify-content:center">Entrar</button>
      ${isPin ? `<button type="button" class="btn" style="justify-content:center" onclick="mostrarTrava('esqueci')">Esqueci o PIN</button>` : ''}`}</form>`;
  t.classList.add('on');
  $('#trava-form').onsubmit = e => { e.preventDefault(); tentarDesbloquear(); };
  if (isBio) setTimeout(() => desbloquearBio(true), 350); else setTimeout(() => { const i = $('#trava-in'); i && i.focus(); }, 60);
}
function esconderTrava() { const t = $('#trava'); t.classList.remove('on'); t.innerHTML = ''; Vault.locked = false; Lock.touch(); }
async function desbloquearBio(auto) {
  const er = $('#trava-err'); if (!Lock.cfg.credId) return;
  try { if (await Bio.verify(Lock.cfg.credId)) { esconderTrava(); Vault.schedule(300); return; } if (er) { er.textContent = 'Não reconheci. Tente de novo.'; er.hidden = false; } }
  catch (e) { if (!auto && er) { er.textContent = `${Bio.label()} cancelado. Toque pra tentar de novo ou use a senha do cofre.`; er.hidden = false; } }
}
async function tentarDesbloquear() {
  const inp = $('#trava-in'), er = $('#trava-err'), v = inp.value;
  if (Vault.lockUntil > Date.now()) { er.textContent = `Muitas tentativas. Espere ${Math.ceil((Vault.lockUntil - Date.now()) / 1000)} s.`; er.hidden = false; return; }
  if (MODO_TRAVA === 'pin') {
    if (await Lock.checkPin(v)) { Vault.fails = 0; esconderTrava(); Vault.schedule(300); return; }
    Vault.fails++; if (Vault.fails >= 5) { Vault.fails = 0; Vault.lockUntil = Date.now() + 30000; }
    er.textContent = 'PIN errado.'; er.hidden = false; inp.value = ''; inp.focus(); return;
  }
  try {
    const k = await Vault.keyFromPassword(v); Vault.key = k;
    if (Vault.cfg.needsPassword) { Vault.cfg.key = k; delete Vault.cfg.needsPassword; await Vault.persist(); }
    if (MODO_TRAVA === 'esqueci' && Lock.cfg.mode === 'pin') {
      esconderTrava();
      const pin = await pedirSegredo('Novo PIN', '4 a 6 números, pra abrir o app neste aparelho.', { pin: true, confirmar: true, ok: 'Salvar PIN' });
      if (pin) { const s = crypto.getRandomValues(new Uint8Array(16)); Lock.cfg.pinSalt = b64(s); Lock.cfg.pinHash = await pinHash(pin, s); await Lock.persist(); }
    } else esconderTrava();
    Vault.schedule(300);
  } catch (_) { er.textContent = 'Senha errada.'; er.hidden = false; inp.value = ''; inp.focus(); }
}
async function mudarTrava(v) {
  if (v === Lock.cfg.mode && v !== 'pin') return;
  if (v !== 'none' && !Vault.cfg) return toast('Ligue o cofre antes: ele é a porta de emergência se a trava falhar.');
  if (v === 'pin') {
    const pin = await pedirSegredo(Lock.cfg.mode === 'pin' ? 'Novo PIN' : 'Criar PIN', '4 a 6 números, só pra este aparelho.', { pin: true, confirmar: true, ok: 'Salvar PIN' });
    if (!pin) return; const salt = crypto.getRandomValues(new Uint8Array(16)); Lock.cfg.pinSalt = b64(salt); Lock.cfg.pinHash = await pinHash(pin, salt); Lock.cfg.mode = 'pin';
  } else if (v === 'bio') {
    try { Lock.cfg.credId = await Bio.register(); Lock.cfg.mode = 'bio'; } catch (_) { return toast(`Não consegui ligar o ${Bio.label()} agora.`); }
  } else Lock.cfg.mode = 'none';
  await Lock.persist(); Lock.touch(); render();
  toast(v === 'none' ? 'Trava desligada neste aparelho' : v === 'bio' ? `${Bio.label()} ligado` : 'PIN salvo');
}

let VD = null;
function repoPadrao() { const m = /^([\w-]+)\.github\.io$/i.exec(location.hostname); return m ? `${m[1]}/pessoas-dados` : ''; }
function abrirCofre() { VD = { passo: 1, repo: (Vault.cfg && Vault.cfg.repo) || repoPadrao(), token: '', existe: false, info: null, ocupado: false, erro: '' }; desenharCofre(); $('#modal2').classList.add('on'); }
function fecharCofre() { $('#modal2').classList.remove('on'); $('#form2').innerHTML = ''; VD = null; }
function desenharCofre() {
  const d = VD, err = d.erro ? `<p class="erro-txt">${esc(d.erro)}</p>` : '';
  const cab = `<h2 style="margin:0 0 14px">Cofre na nuvem</h2>`;

      <p class="mut" style="margin:0;line-height:1.55">Seus dados vão pra um repositório <b>privado</b> do seu GitHub, criptografados com uma senha que só você sabe. Sincroniza iPhone e Mac, recebe o que o Claude manda do banco do Mac e leva pro Mac o que você mudar aqui.</p>
      <label class="campo"><span>Repositório privado (usuário/nome)</span><input id="vd-repo" value="${esc(d.repo)}" placeholder="usuario/pessoas-dados" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
      <label class="campo"><span>Chave de acesso do GitHub</span><input id="vd-token" type="password" value="${esc(d.token)}" placeholder="github_pat_…" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      <details class="small mut"><summary>Como criar a chave</summary><ol style="padding-left:18px;margin:8px 0 0;line-height:1.6"><li>github.com › foto › Settings › Developer settings › Personal access tokens › <b>Fine-grained tokens</b> › Generate new token.</li><li>Expiration: 1 ano. Repository access: <b>Only select repositories</b> › o repositório do cofre (dá pra marcar os cofres dos outros apps na mesma chave).</li><li>Permissions › Repository › <b>Contents: Read and write</b>.</li><li>Generate token, copie e cole aqui. <b>Nunca cole a chave em conversa nenhuma.</b></li></ol></details>
      ${err}<div class="fbtns" style="margin-top:6px"><button type="button" class="btn" onclick="fecharCofre()">Cancelar</button><button class="btn p" ${d.ocupado ? 'disabled' : ''}>${d.ocupado ? 'Testando acesso…' : 'Continuar'}</button></div></form>`;
    $('#vd1').onsubmit = e => { e.preventDefault(); cofrePasso1(); };
    return;
  }
  $('#form2').innerHTML = `${cab}<form id="vd2" style="display:grid;gap:14px" autocomplete="off">
    ${d.existe ? `<p style="margin:0">Achei um cofre nesse repositório${d.info ? ` (atualizado em ${fmtQuando(d.info.updatedAt)}, ${esc(d.info.device || '')})` : ''}. Digite a senha dele.</p>
      <label class="campo"><span>Senha do cofre</span><input id="vd-pass" type="password" autocomplete="current-password"></label>`
    : `<p style="margin:0;line-height:1.55">Crie a <b>senha do cofre</b>. É ela que tranca seus dados. <b>Se esquecer, ninguém recupera</b>: guarde no app Senhas.</p>
      <label class="campo"><span>Senha do cofre (mínimo 8)</span><input id="vd-pass" type="password" autocomplete="new-password"></label>
      <label class="campo"><span>Repita a senha</span><input id="vd-pass2" type="password" autocomplete="new-password"></label>`}
    ${err}<div class="fbtns" style="margin-top:6px"><button type="button" class="btn" onclick="fecharCofre()">Cancelar</button><button class="btn p" ${d.ocupado ? 'disabled' : ''}>${d.ocupado ? 'Trabalhando… (leva alguns segundos)' : d.existe ? 'Conectar' : 'Criar cofre'}</button></div></form>`;
  $('#vd2').onsubmit = e => { e.preventDefault(); cofrePasso2(); };

async function cofrePasso1() {
  const d = VD; d.repo = $('#vd-repo').value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\.git$/, '').replace(/\/$/, ''); d.token = $('#vd-token').value.trim();
  if (!/^[\w.-]+\/[\w.-]+$/.test(d.repo)) { d.erro = 'Escreva no formato usuario/repositorio.'; return desenharCofre(); }
  if (d.token.length < 20) { d.erro = 'Cole a chave de acesso do GitHub.'; return desenharCofre(); }
  d.ocupado = true; d.erro = ''; desenharCofre();
  try {
    GH.cfg = { repo: d.repo, token: d.token };
    const info = await GH.repoInfo();
    if (!info.private) { d.ocupado = false; d.erro = 'Esse repositório é PÚBLICO. Por segurança o cofre só funciona em repositório privado.'; return desenharCofre(); }
    const root = await GH.list('');
    d.existe = root.some(x => x.name === 'vault.json');
    if (d.existe) { const v = JSON.parse(TD.decode(await GH.raw('vault.json'))); d.info = { updatedAt: v.updatedAt, device: v.device }; d.vault = v; }
    d.passo = 2; d.ocupado = false; desenharCofre();
  } catch (e) {
    d.ocupado = false;
    d.erro = e.code === 'auth' ? 'A chave não foi aceita. Confira se copiou inteira e se ela tem acesso a esse repositório.' : e.code === 'notfound' ? 'Não achei esse repositório com essa chave.' : 'Não consegui falar com o GitHub. Confira a internet e tente de novo.';
    desenharCofre();
  }
}
async function cofrePasso2() {
  const d = VD, pass = $('#vd-pass').value, pass2 = d.existe ? pass : $('#vd-pass2').value;
  if (pass.length < 8) { d.erro = 'A senha precisa de pelo menos 8 caracteres.'; return desenharCofre(); }
  if (pass !== pass2) { d.erro = 'As duas senhas não batem.'; return desenharCofre(); }
  d.ocupado = true; d.erro = ''; desenharCofre();
  try {
    let salt, iter, key, remoto = null;
    if (d.existe) {
      salt = unb64(d.vault.kdf.salt); iter = d.vault.kdf.iter; key = await deriveKey(pass, salt, iter);
      try { remoto = JSON.parse(TD.decode(await decBytes(key, unb64(d.vault.data)))); } catch (_) { d.ocupado = false; d.erro = 'Senha errada pra esse cofre.'; return desenharCofre(); }
    } else { salt = crypto.getRandomValues(new Uint8Array(16)); iter = KDF_ITER; key = await deriveKey(pass, salt, iter); }
    Vault.cfg = { repo: d.repo, token: d.token, salt: b64(salt), iter, key, check: b64(await encBytes(key, TE.encode('pessoas-ok'))), lastSha: null, lastHash: null, lastBaseSha: null, baseRemota: null, lastSync: null, error: null, connectedAt: new Date().toISOString() };
    Vault.key = key; GH.cfg = Vault.cfg;
    if (remoto) { S = isVirgin(S) ? remoto : mergeStates(S, remoto); migrate(); await save({ silent: true }); }
    await Vault.persist();
    fecharCofre(); render(); toast('Cofre conectado. Sincronizando…');
    await Vault.sync();
    toast(Vault.cfg.error ? Vault.cfg.error : BASE ? 'Tudo salvo no cofre, criptografado' : 'Cofre ligado. Agora é só pedir pro Claude mandar a base do Mac.');
  } catch (e) { d.ocupado = false; d.erro = 'Deu erro ao configurar: ' + (e.message || e); desenharCofre(); }
}
async function desligarCofre() {
  if (!await perguntar('Desconectar o cofre deste aparelho? Os dados continuam aqui e no GitHub; só para de sincronizar e desliga a trava.', 'Desconectar', true)) return;
  try { await Store.del('vault'); } catch (_) {}
  Lock.cfg.mode = 'none'; await Lock.persist(); Vault.cfg = null; Vault.key = null; GH.cfg = null; Inbox.priv = null; render(); toast('Cofre desconectado deste aparelho');
}

/* ---------- atualização do app (sozinha, quando não tem nada aberto) ---------- */
const Upd = { info: null, lastCheck: 0, busy: false };
const verNum = v => String(v || '0').split('.').map(n => parseInt(n, 10) || 0);
function isNewer(a, b) { const x = verNum(a), y = verNum(b); for (let i = 0; i < Math.max(x.length, y.length); i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); } return false; }
function algoAberto() { return $('#modal').classList.contains('on') || $('#modal2').classList.contains('on') || $('#dlg').classList.contains('on'); }
async function checkUpdate(manual) {
  if (PREVIEW || !navigator.onLine) { if (manual) toast('Sem internet agora.'); return; }
  Upd.lastCheck = Date.now();
  try {
    const r = await _fetchOrig('version.json?t=' + Date.now(), { cache: 'no-store' }); if (!r.ok) throw new Error('http ' + r.status);
    const j = await r.json();
    if (isNewer(j.version, APP_VERSION)) {
      Upd.info = j; if (manual) toast(`Versão ${j.version} disponível`);
      let tentou = 0; try { tentou = +sessionStorage.getItem('upd-' + j.version) || 0; } catch (_) {}
      if (!manual && Date.now() - tentou > 600000) autoUpdate(j.version);
      else if (location.hash.startsWith('#/ajustes')) render();
    } else { Upd.info = null; if (manual) toast(`Você já está na versão mais nova (${APP_VERSION})`); }
  } catch (_) { if (manual) toast('Não consegui verificar agora.'); }
}
function autoUpdate(ver, n = 0) {
  if (algoAberto() || Vault.locked || Vault.running || Upd.busy) { if (n < 40) setTimeout(() => autoUpdate(ver, n + 1), 3000); return; }
  try { sessionStorage.setItem('upd-' + ver, String(Date.now())); } catch (_) {}
  applyUpdate();
}
async function applyUpdate() {
  if (Upd.busy) return; Upd.busy = true; toast('Atualizando…');
  try {
    if ('serviceWorker' in navigator) { const reg = await navigator.serviceWorker.getRegistration(); if (reg) { try { await reg.update(); } catch (_) {} if (reg.waiting) reg.waiting.postMessage('skip'); } }
    if (window.caches) { for (const k of await caches.keys()) await caches.delete(k); }
  } catch (_) {}
  location.reload();
}

/* ---------- arquivo do Claude / backup ---------- */
async function importarArquivo(f) {
  try {
    const j = JSON.parse(await f.text());
    if (j.app !== APP_ID) throw new Error('Esse arquivo não é do Pessoas de Bolso.');
    if (j.kind === 'base') {
      const ok = await adotarBase(j);
      toast(ok ? `Base do Mac de ${fmtQuando(j.geradoEm)} carregada` : 'Esse arquivo é mais antigo que a base que já está aqui.');
    } else if (j.kind === 'backup' || j.kind === 'backup-enc') {
      let b = j;
      if (j.kind === 'backup-enc') {
        if (!Vault.key) throw new Error('Backup criptografado: ligue o cofre com a mesma senha antes.');
        b = JSON.parse(TD.decode(await gunzip(await decBytes(Vault.key, unb64(j.data)))));
      }
      if (!await perguntar('Restaurar esse backup? Junta as mudanças dele com as daqui e usa a base mais nova das duas.', 'Restaurar')) return;
      S = mergeStates(S, b.state); migrate(); if (b.base) await adotarBase(b.base); await save(); reconstruir();
      toast('Backup restaurado');
    } else throw new Error('Formato desconhecido.');
    if (Vault.cfg) Vault.schedule(500);
    atualizarTela();
  } catch (e) { toast(String(e.message || e)); }
}
async function exportarBackup() {
  const agora = new Date().toISOString();
  let out = { app: APP_ID, kind: 'backup', v: 1, exportedAt: agora, state: S, base: BASE }, nome = `pessoas-backup-${dayKey()}.json`;
  if (Vault.key && Vault.cfg) { out = { app: APP_ID, kind: 'backup-enc', v: 1, exportedAt: agora, z: 'gzip', kdf: { name: 'PBKDF2-SHA256', iter: Vault.cfg.iter, salt: Vault.cfg.salt }, data: b64(await encBytes(Vault.key, await gzip(TE.encode(JSON.stringify(out))))) }; nome = `pessoas-backup-${dayKey()}-criptografado.json`; }
  const arq = new File([JSON.stringify(out)], nome, { type: 'application/json' });
  try { if (navigator.canShare && navigator.canShare({ files: [arq] })) { await navigator.share({ files: [arq], title: 'Backup do Pessoas de Bolso' }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(arq); a.download = nome; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

/* ---------- mapa: pinça com dois dedos (o painel do Mac usa roda/trackpad) ---------- */
function ligarPinca(el) {
  const pts = new Map(); let ini = null;
  const dist = () => { const [a, b] = [...pts.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
  const meio = () => { const [a, b] = [...pts.values()], r = el.getBoundingClientRect(); return { x: (a.x + b.x) / 2 - r.left, y: (a.y + b.y) / 2 - r.top }; };
  el.addEventListener('pointerdown', e => { if (e.pointerType !== 'touch') return; pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (pts.size === 2) { MAPA.pinca = true; MAPA.pincou = true; ini = { d: dist(), z: MAPA.z }; } });
  el.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2 && ini) { const m = meio(); zoomEm(ini.z + Math.log2(dist() / ini.d), m.x, m.y); agendar(); }
  });
  const fim = e => { pts.delete(e.pointerId); if (pts.size < 2) { ini = null; MAPA.pinca = false; } if (!pts.size) setTimeout(() => { MAPA.pincou = false; }, 60); };
  el.addEventListener('pointerup', fim); el.addEventListener('pointercancel', fim);
}

    ${p.revisar ? `<div class="fi-fila">📝 Na fila pra completar${faltaEm(p).length ? ' — falta ' + faltaEm(p).join(', ') : ''}. <a href="javascript:void 0" onclick="abrirForm('${esc(p.id)}')">Completar</a></div>` : ''}
    ${p.esqueleto ? '<div class="fi-fila esq">Ficha esqueleto: só existe porque alguém citou como pai/mãe. Toque em Editar pra completar.</div>' : ''}
    <div class="fi-ac">${w ? `<a class="btn w" href="${w}" target="_blank" rel="noopener">💬 WhatsApp</a>` : ''}${tel ? `<a class="btn" href="tel:${esc(tel)}">📞 Ligar</a>` : ''}
      <button class="btn p" onclick="abrirForm('${esc(p.id)}')">✏️ Editar</button></div>
    <div class="fi-dd">${dado('Nascimento', esc(p.data_nascimento || ''))}${dado('Apelido', esc(p.apelido || ''))}${dado('Telefone', esc(p.telefone || ''))}
      ${dado('Ofício', esc(p.oficio || ''))}${dado('E-mail', p.email ? `<a href="mailto:${esc(p.email)}">${esc(p.email)}</a>` : '')}${dado('Sexo', esc(p.sexo || ''))}${dado('Tipo sanguíneo', esc(tsTxt(p.tipo_sanguineo)))}
      ${dado('Endereço', esc(p.endereco || ''))}${dado('CPF', esc(p.cpf || ''))}${dado('Pai', pai)}${dado('Mãe', mae)}</div>
    ${LK}
    ${p.observacoes ? `<div class="obs">${esc(p.observacoes).replace(/\n/g, '<br>')}</div>` : ''}
    <div class="cel-sec"><h3>Família <span class="n">${fam.length}</span></h3>
      ${fam.length ? `<div class="fi-fam">${fam.join('')}</div>` : '<div class="mut small">ninguém ligado ainda</div>'}
      <div class="cel-chips add">${`<button onclick="abrirForm(null,{filhoDe:'${esc(p.id)}'})">＋ filho(a)</button>`}
        ${(p.pai_id || p.mae_id) ? `<button onclick="abrirForm(null,{irmaoDe:'${esc(p.id)}'})">＋ irmão(ã)</button>` : ''}
        ${!p.pai_id ? `<button onclick="abrirForm(null,{paiDe:'${esc(p.id)}',lado:'pai'})">＋ pai</button>` : ''}
        ${!p.mae_id ? `<button onclick="abrirForm(null,{paiDe:'${esc(p.id)}',lado:'mae'})">＋ mãe</button>` : ''}</div></div>
    <div class="cel-sec fi-arv" id="det-arv"><h3>🌳 Árvore genealógica</h3>
      <div id="arv-wrap"></div></div>
    ${fatos ? `<details class="fi-det"><summary>◆ Calculado</summary>${fatos.replace(/<h2>[\s\S]*?<\/h2>/, '')}</details>` : ''}
    ${cruz ? `<details class="fi-det"><summary>🔍 Cruzamentos</summary>${cruz.replace(/<h2>[\s\S]*?<\/h2>/, '')}</details>` : ''}
    <div class="mut small" style="margin-top:14px;text-align:center">ficha ${esc(p.id)}</div>`;
  app._R = R; app._p = p; app._F = F;
  // árvore completa (v1.2): todo mundo ligado, aberta direto na ficha — arrastar, pinça, tela cheia e lista
  arvDesenhar(p.id, $('#arv-wrap'));
  window.onresize = null;
}
vPessoa = (orig => function (id) { return celular() ? vPessoaCel(id) : orig(id); })(vPessoa);

// ================================================================ CONFERÊNCIA (celular): tudo recolhido, com o número
async function vPendCel() {
  const P = Object.values(PESSOAS);
  app.innerHTML = '<div class="mut">verificando…</div>';
  const C = await (await fetch('/api/coerencia')).json();
  const filhos = {}; P.forEach(p => [p.pai_id, p.mae_id].forEach(i => { if (i) (filhos[i] ||= []).push(p); }));
  const grupos = [
    ['📝 Completar depois', filaLista()],
    ['Data inválida', P.filter(p => p.data_nascimento && p.dias === null)],
    ['Esqueletos', P.filter(p => p.esqueleto).sort((a, b) => (filhos[b.id] || []).length - (filhos[a.id] || []).length)],
    ['Completas sem data', P.filter(p => !p.esqueleto && !p.data_nascimento)],
    ['Sem pai nem mãe', P.filter(p => !p.esqueleto && !p.pai_id && !p.mae_id)],
    ['Sem foto', P.filter(p => !p.esqueleto && !p.foto)],
    ['Sem fonte', P.filter(p => !p.esqueleto && !p.fonte)]];
  const det = (t, n, corpo) => `<details class="fi-det"><summary>${t} <span class="n">${n}</span></summary>${corpo}</details>`;
  app.innerHTML = `<div class="cel-cab"><div><h1>Conferência</h1><div class="cel-data">o que o banco checa sozinho</div></div></div>
    ${det('⚠️ Coisas que não batem', C.length, `<div class="lista-cel">${C.slice(0, 150).map(a => `<div class="lp"><div class="lp-t"><b>${a.ids.map(i => `<a href="#/p/${esc(i)}">${esc(PESSOAS[i]?.nome || i)}</a>`).join(' · ')}</b><small>${esc(a.msg)}</small></div><span class="pill ${a.sev === 'erro' ? 'verm' : a.sev === 'aviso' ? 'amar' : 'cinza'}">${a.sev === 'info' ? 'talvez' : esc(a.sev)}</span></div>`).join('') || '<div class="vazio">nada incoerente 🎉</div>'}</div>`)}
    ${grupos.map(([t, l]) => det(t, l.length, `<div class="lista-cel">${l.slice(0, 150).map(linhaPessoa).join('') || '<div class="vazio">nada</div>'}${l.length > 150 ? `<div class="mut small" style="padding:8px">+${l.length - 150} (use a busca de Pessoas)</div>` : ''}</div>`)).join('')}`;
}
vPend = (orig => function () { return celular() ? vPendCel() : orig(); })(vPend);

// ================================================================ ＋ CADASTRO EXPRESSO (padrão ligado)
let XP_PRE = null, XP_FOTO = null;
function mascaraData(inp) {
  inp.setAttribute('inputmode', 'numeric'); inp.setAttribute('maxlength', '10');
  inp.addEventListener('input', () => {
    const d = inp.value.replace(/\D/g, '').slice(0, 8);
    const v = d.length > 4 ? `${d.slice(0, 2)}/${d.slice(2, 4)}/${d.slice(4)}` : d.length > 2 ? `${d.slice(0, 2)}/${d.slice(2)}` : d;
    if (v !== inp.value) inp.value = v;
    inp.classList.toggle('erro', v.length === 10 && !parseDataBR(v));
  });
}
function contextoPre(pre) {
  if (!pre) return '';
  if (pre.filhoDe && PESSOAS[pre.filhoDe]) return 'Filho(a) de ' + PESSOAS[pre.filhoDe].nome;
  if (pre.irmaoDe && PESSOAS[pre.irmaoDe]) return 'Irmão/irmã de ' + PESSOAS[pre.irmaoDe].nome + ' (mesmos pais)';
  if (pre.paiDe && PESSOAS[pre.paiDe]) return (pre.lado === 'pai' ? 'Pai' : 'Mãe') + ' de ' + PESSOAS[pre.paiDe].nome;
  return '';
}
function abrirExpresso(pre, vals) {
  XP_PRE = pre || null; XP_FOTO = null; vals = vals || {};
  const ctx = contextoPre(pre);
  $('#form').innerHTML = `<div class="xp-topo"><label class="xp-tog"><input type="checkbox" checked onchange="trocarModo(false)"><span class="sw"></span><b>⚡ Expresso</b></label>
      <span class="mut small">nome, nascimento e foto</span></div>
    <h2>Nova pessoa</h2>${ctx ? `<div class="obs" style="margin:0 0 12px">${esc(ctx)}</div>` : ''}
    <div class="xp">
      <label class="campo"><span>Nome completo</span><input id="xp_nome" autocomplete="off" autocapitalize="words" value="${esc(vals.nome || '')}"></label>
      <label class="campo"><span>Data de nascimento</span><input id="xp_nasc" placeholder="DD/MM/AAAA" value="${esc(vals.nasc || '')}"></label>
      <label class="xp-foto"><input type="file" id="xp_foto" accept="image/*" hidden><span class="xp-prev" id="xp_prev">📷</span><span id="xp_ftxt">Foto (opcional)</span></label>
      <label class="xp-chk"><input type="checkbox" id="xp_rev" ${vals.rev ? 'checked' : ''}><span><b>📝 Completar depois</b><small>vai pra fila "Completar" pra você buscar mais dados; entra como pessoa normal</small></span></label>
    </div>
    <div class="fbtns"><button class="btn" onclick="fecharForm()">Cancelar</button><button class="btn p" id="xp_ok" onclick="salvarExpresso()">Salvar</button></div>`;
  mascaraData($('#xp_nasc'));
  $('#xp_foto').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader();
    r.onload = () => { XP_FOTO = { nome: f.name, b64: r.result }; $('#xp_prev').innerHTML = `<img src="${r.result}" alt="">`; $('#xp_ftxt').textContent = 'Trocar foto'; }; r.readAsDataURL(f); };
  $('#modal').classList.add('on'); setTimeout(() => $('#xp_nome').focus(), 60);
}
function trocarModo(expresso) {
  if (expresso) {
    const vals = { nome: ($('#in_nome') || {}).value, nasc: ($('#in_nasc') || {}).value, rev: ($('#in_revisar') || {}).checked };
    abrirExpresso(XP_PRE, vals);
  } else {
    const vals = { nome: $('#xp_nome').value, nasc: $('#xp_nasc').value, rev: $('#xp_rev').checked };
    abrirForm(null, { ...(XP_PRE || {}), _completo: true });
    if (vals.nome) $('#in_nome').value = vals.nome; if (vals.nasc) $('#in_nasc').value = vals.nasc;
    const r = $('#in_revisar'); if (r) r.checked = !!vals.rev;
  }
}
async function salvarExpresso() {
  const nome = $('#xp_nome').value.trim().replace(/\s+/g, ' '), nasc = $('#xp_nasc').value.trim(), rev = $('#xp_rev').checked;
  if (!nome) { toast('Escreve o nome'); $('#xp_nome').focus(); return; }
  if (nasc && !parseDataBR(nasc)) { toast('Data precisa ser DD/MM/AAAA'); $('#xp_nasc').focus(); return; }
  const ja = Object.values(PESSOAS).filter(x => norm(x.nome) === norm(nome));
  if (ja.length && !await perguntar(`Já existe ${ja.length === 1 ? 'uma ficha' : ja.length + ' fichas'} com o nome "${nome}"${ja[0].data_nascimento ? ` (nascida em ${ja[0].data_nascimento})` : ''}. Criar outra pessoa mesmo assim?`, 'Criar outra')) return;
  const body = { id: '', nome, data_nascimento: nasc, revisar: rev };
  const pre = XP_PRE || {};
  if (pre.filhoDe && PESSOAS[pre.filhoDe]) { const g = PESSOAS[pre.filhoDe]; body[fem(g) ? 'mae_id' : 'pai_id'] = g.id; }
  if (pre.irmaoDe && PESSOAS[pre.irmaoDe]) { const g = PESSOAS[pre.irmaoDe]; if (g.pai_id) body.pai_id = g.pai_id; if (g.mae_id) body.mae_id = g.mae_id; }
  if (pre.paiDe && PESSOAS[pre.paiDe]) { body.ligar_a = { id: pre.paiDe, lado: pre.lado }; body.sexo = pre.lado === 'pai' ? 'Masculino' : 'Feminino'; }
  $('#xp_ok').disabled = true;
  const j = await (await fetch('/api/salvar', { method: 'POST', body: JSON.stringify(body) })).json();
  if (j.erro) { $('#xp_ok').disabled = false; toast('Erro: ' + j.erro); return; }
  PESSOAS = j.pessoas; PAD = null;
  if (XP_FOTO) { const f = await (await fetch('/api/foto', { method: 'POST', body: JSON.stringify({ id: j.id, nome: XP_FOTO.nome, base64: XP_FOTO.b64 }) })).json(); if (f.foto && PESSOAS[j.id]) PESSOAS[j.id].foto = f.foto; }
  fecharForm(); toast((rev ? '📝 Na fila: ' : 'Salvo: ') + nome);
  if (location.hash === '#/p/' + j.id) render(); else location.hash = '#/p/' + j.id;
}
abrirForm = (orig => function (id, pre) {
  if (!id && !(pre && pre._completo)) return abrirExpresso(pre);
  if (pre && pre._completo) { const { _completo, ...resto } = pre; pre = Object.keys(resto).length ? resto : undefined; XP_PRE = pre || null; }
  orig(id, pre);
  const p = id ? PESSOAS[id] : null;
  const esq = $('#in_esq'); if (esq) esq.closest('div').insertAdjacentHTML('beforeend',
    `<label class="chk"><input type="checkbox" id="in_revisar" ${p && p.revisar ? 'checked' : ''}> 📝 completar depois</label>`);
  if (!id) $('#form').insertAdjacentHTML('afterbegin', `<div class="xp-topo"><label class="xp-tog"><input type="checkbox" onchange="trocarModo(true)"><span class="sw"></span><b>⚡ Expresso</b></label>
    <span class="mut small">desligado: cadastro completo</span></div>`);
  const n = $('#in_nasc'); if (n) mascaraData(n);
})(abrirForm);
// o formulário completo manda o "completar depois" junto (o salvar() do painel não conhece o campo)
registrarSalvar = (orig => async function (corpo) {
  const c = document.getElementById('in_revisar');
  if (c && $('#modal').classList.contains('on') && !('revisar' in corpo)) corpo.revisar = c.checked;
  return orig(corpo);
})(registrarSalvar);
// virar o celular / mudar a largura da janela: troca entre a tela do celular e a do Mac
let _larg = celular();
window.addEventListener('resize', () => { const c = celular(); if (c !== _larg) { _larg = c; if (!algoAberto()) render(); } });

// ================================================================ início
$('#arq-importar').addEventListener('change', async e => { const f = e.target.files[0]; e.target.value = ''; if (f) await importarArquivo(f); });
$('#modal2').addEventListener('mousedown', e => { if (e.target === $('#modal2')) fecharCofre(); });
window.addEventListener('online', () => Vault.schedule(500));
window.addEventListener('pagehide', () => { if (!Vault.locked) Lock.touch(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { Vault.hiddenAt = Date.now(); if (!Vault.locked) Lock.touch(); return; }
  if (!Vault.locked && Lock.active() && Vault.hiddenAt && Date.now() - Vault.hiddenAt > Math.max(Lock.cfg.graceMin * 60000, 15000)) mostrarTrava(Lock.cfg.mode);
  if (dayKey(HOJE) !== dayKey()) atualizarTela();            // virou o dia: idades e aniversários
  if (Vault.cfg && Date.now() - Date.parse(Vault.cfg.lastSync || 0) > 60000) Vault.schedule(600);
  if (Date.now() - Upd.lastCheck > 30 * 60000) checkUpdate(false);
});
// com o app aberto: busca o que chegou no cofre a cada 90 s e versão nova a cada 30 min
setInterval(() => {
  if (document.hidden || PREVIEW) return;
  if (Vault.cfg && Vault.key && !Vault.locked && !Vault.running && Date.now() - Date.parse(Vault.cfg.lastSync || 0) > 85000) Vault.schedule(100);
  if (Date.now() - Upd.lastCheck > 30 * 60000) checkUpdate(false);
}, 90000);

(async function boot() {
  await load();
  await Vault.init();
  await Lock.init();
  if (Vault.cfg && !Vault.key) mostrarTrava('senha');
  else if (Lock.active() && Lock.expired()) mostrarTrava(Lock.cfg.mode);
  await carregar();
  render();
  if (Vault.key) Vault.schedule(1200);
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (_) {}
  if (!PREVIEW && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) navigator.serviceWorker.register('sw.js').catch(() => {});
  setTimeout(() => checkUpdate(false), 2500);
})();

</script>
