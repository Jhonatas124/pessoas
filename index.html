<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pessoas">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0b11">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Pessoas de Bolso</title>
<style>
/* ==================================================================
   CSS do painel local (4 PAINEL/painel.html), copiado pelo montar_app.py.
   Não editar aqui: editar o painel e rodar o build de novo.
   ================================================================== */
/* ==================================================================
   Banco de Pessoas — sistema visual v5 (17/09/2026)
   Fundo profundo com brilho de nebulosa, superfícies de vidro, cantos
   muito arredondados, sidebar agrupada por seção, breadcrumb no topo.
   Sem CDN, sem fonte externa, sem imagem.
   ================================================================== */
:root{
  /* --- fundo e superfícies --- */
  --bg:#0a0b11; --bg2:#101223; --bg3:#161a33;
  --surf:rgba(255,255,255,.034);
  --surf2:rgba(255,255,255,.055);
  --surf3:rgba(255,255,255,.085);
  --solid:#14151f;
  --line:rgba(255,255,255,.075);
  --line2:rgba(255,255,255,.14);
  --line3:rgba(255,255,255,.22);

  /* --- texto --- */
  --ink:#f3f4f9; --ink2:#c8cbdb; --mut:#8b90a8; --mut2:#5d6279;

  /* --- acentos --- */
  --acc:#7b8cff;        /* violeta-azul principal */
  --acc-d:#5a6bf0;
  --acc2:#3fd8c2;       /* ciano dos cálculos */
  --acc3:#b28dff;       /* roxo dos vínculos laterais */
  --ok:#4ade80; --warn:#fbbf24; --red:#f87171; --orange:#fb923c;

  
  --r:22px; --r2:16px; --r3:11px;
  --sb:268px;           /* largura da sidebar */
  --t:.2s cubic-bezier(.4,0,.2,1);
  --shadow:0 18px 50px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{
  margin:0; color:var(--ink); background:var(--bg);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
/* nebulosa do fundo */
body::before{
  content:''; position:fixed; inset:0; z-index:-2; pointer-events:none;
  background:
    radial-gradient(1200px 700px at 8% -8%, rgba(123,140,255,.20), transparent 60%),
    radial-gradient(900px 600px at 78% -12%, rgba(178,141,255,.13), transparent 62%),
    radial-gradient(700px 500px at 96% 42%, rgba(63,216,194,.06), transparent 60%),
    linear-gradient(170deg,#12142a 0%, var(--bg) 46%);
}
/* poeira de estrelas bem discreta */
body::after{
  content:''; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.5;
  background-image:
    radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 68% 8%, rgba(255,255,255,.35), transparent),
    radial-gradient(1px 1px at 84% 30%, rgba(255,255,255,.4), transparent),
    radial-gradient(1px 1px at 32% 44%, rgba(255,255,255,.25), transparent),
    radial-gradient(1px 1px at 52% 22%, rgba(255,255,255,.3), transparent);
  mask-image:linear-gradient(180deg,#000,transparent 60%);
  -webkit-mask-image:linear-gradient(180deg,#000,transparent 60%);
}
a{color:var(--acc); text-decoration:none; transition:color var(--t)}
a:hover{color:#a3b0ff}
button{font:inherit; cursor:pointer}
::selection{background:rgba(123,140,255,.34)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:9px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

@keyframes sobe{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes surge{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@keyframes pulso{0%,100%{box-shadow:0 0 0 0 rgba(123,140,255,.4)}70%{box-shadow:0 0 0 13px rgba(123,140,255,0)}}
@keyframes correr{from{transform:translateX(0)}to{transform:translateX(-50%)}}
#app{animation:sobe .3s both}
.grid>*,.lista .row,.stat>div,.desc>*{animation:sobe .28s both; animation-delay:calc(var(--i,0)*20ms)}
.pc{animation:surge .3s both; animation-delay:calc(var(--i,0)*22ms)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ================================================================ casca */
.app{display:flex; min-height:100vh}

/* ---------------- sidebar ---------------- */
.sb{
  width:var(--sb); flex:none; position:sticky; top:0; height:100vh; display:flex; flex-direction:column;
  padding:20px 14px 14px; gap:4px; overflow-y:auto;
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012));
  border-right:1px solid var(--line); backdrop-filter:blur(20px);
  transition:width var(--t), padding var(--t);
}
.sb::-webkit-scrollbar{width:0}
.marca{display:flex; align-items:center; gap:11px; padding:4px 8px 18px}
.marca .sig{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:19px;
  background:linear-gradient(145deg,rgba(123,140,255,.32),rgba(178,141,255,.16));
  border:1px solid rgba(123,140,255,.35); box-shadow:0 0 22px rgba(123,140,255,.22)}
.marca .txt{min-width:0}
.marca b{display:block; font-size:14.5px; font-weight:640; letter-spacing:-.15px; white-space:nowrap}
.marca span{display:block; font-size:11px; color:var(--mut); white-space:nowrap}
.marca .fechar{margin-left:auto; width:30px;height:30px;flex:none; border-radius:9px; display:grid; place-items:center;
  background:var(--surf); border:1px solid var(--line); color:var(--mut); transition:all var(--t)}
.marca .fechar:hover{background:var(--surf2); color:var(--ink); border-color:var(--line2)}

.sb .grupo{font-size:10.5px; text-transform:uppercase; letter-spacing:.13em; color:var(--mut2);
  padding:16px 12px 7px; font-weight:600; white-space:nowrap}
.sb a.item{display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:var(--r3);
  color:var(--ink2); border:1px solid transparent; transition:all var(--t); position:relative; white-space:nowrap}
.sb a.item i{width:20px;height:20px;flex:none;display:grid;place-items:center;font-size:15px;opacity:.85; font-style:normal}
.sb a.item:hover{background:var(--surf); color:var(--ink)}
.sb a.item.on{color:#fff; background:linear-gradient(100deg,rgba(255,255,255,.1),rgba(255,255,255,.035));
  border-color:var(--line2); box-shadow:0 6px 20px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08)}
.sb a.item.on::before{content:''; position:absolute; left:-14px; top:50%; transform:translateY(-50%);
  width:3px; height:20px; border-radius:0 3px 3px 0; background:linear-gradient(180deg,var(--acc),var(--acc3))}
.sb a.item .badge{margin-left:auto; font-size:10.5px; padding:2px 8px; border-radius:99px;
  background:var(--surf2); color:var(--mut); border:1px solid var(--line)}
.sb a.item.on .badge{background:rgba(123,140,255,.22); color:#c3cbff; border-color:rgba(123,140,255,.3)}
.sb .rodape{margin-top:auto; padding-top:14px; border-top:1px solid var(--line)}
.saude{padding:12px 13px; border-radius:var(--r2); background:var(--surf); border:1px solid var(--line)}
.saude .l{display:flex; align-items:center; justify-content:space-between; font-size:11.5px; color:var(--mut); margin-bottom:9px}
.saude .l b{color:var(--ink); font-weight:650}
.saude .tr{height:6px; border-radius:99px; background:rgba(255,255,255,.06); overflow:hidden}
.saude .tr i{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--acc2),var(--acc))}
.saude .pe{font-size:10.5px; color:var(--mut2); margin-top:8px; line-height:1.4}
body.mini .saude .l span,body.mini .saude .pe{display:none}

/* sidebar recolhida */
body.mini{--sb:78px}
body.mini .sb{padding:20px 12px 14px; align-items:center}
body.mini .marca{padding:4px 0 18px}
body.mini .marca .txt,body.mini .sb .grupo,body.mini .sb a.item span,body.mini .sb a.item .badge{display:none}
body.mini .marca .fechar{position:absolute; top:22px; right:-13px; z-index:5; background:var(--solid)}
body.mini .sb a.item{justify-content:center; padding:11px}
body.mini .sb a.item.on::before{left:-12px}

/* ---------------- área principal ---------------- */
.conteudo{flex:1; min-width:0; display:flex; flex-direction:column;
  container-type:inline-size; container-name:area}
.topo-barra{position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:14px;
  padding:14px 26px; background:rgba(10,11,17,.72); backdrop-filter:blur(22px) saturate(160%);
  -webkit-backdrop-filter:blur(22px) saturate(160%); border-bottom:1px solid var(--line)}
.crumb{display:flex; align-items:center; gap:9px; font-size:13.5px; color:var(--mut); min-width:0; flex:none}
.crumb b,.crumb>span:not(.casa){white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.crumb .casa{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surf);
  border:1px solid var(--line); font-size:13px}
.crumb b{color:var(--ink); font-weight:600}
.crumb .sep{color:var(--mut2)}
#busca{margin-left:auto; width:300px; min-width:120px; flex:0 1 300px; padding:10px 15px; color:var(--ink); border:1px solid var(--line);
  border-radius:var(--r3); font:inherit; background:var(--surf); transition:all var(--t)}
#busca::placeholder{color:var(--mut2)}
#busca:hover{border-color:var(--line2)}
#busca:focus{outline:none; flex-basis:400px; border-color:rgba(123,140,255,.6); background:rgba(123,140,255,.09);
  box-shadow:0 0 0 3px rgba(123,140,255,.12)}
.icone{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center; font-size:15px;
  background:var(--surf); border:1px solid var(--line); color:var(--ink2); transition:all var(--t); position:relative}
.icone:hover{background:var(--surf2); color:#fff; border-color:var(--line2); transform:translateY(-1px)}
.icone.tem::after{content:''; position:absolute; top:9px; right:9px; width:6px;height:6px;border-radius:50%;
  background:var(--acc); box-shadow:0 0 8px var(--acc)}
.eu{width:38px;height:38px;flex:none;border-radius:12px; display:grid; place-items:center; font-size:15px; font-weight:650;
  background:linear-gradient(145deg,var(--acc),var(--acc3)); color:#fff; box-shadow:0 0 20px rgba(123,140,255,.3)}

/* ---------------- faixa de aniversários (a "fita" das referências) --------- */
.fita{display:flex; align-items:center; gap:0; border-bottom:1px solid var(--line); overflow:hidden;
  background:rgba(255,255,255,.015)}
.fita .rot{flex:none; display:flex; align-items:center; gap:8px; padding:0 18px; height:46px; font-size:12px;
  color:var(--mut); border-right:1px solid var(--line); background:rgba(10,11,17,.6); z-index:2; white-space:nowrap}
.fita .rot b{color:var(--acc2)}
.fita .trilho{flex:1; overflow:hidden; mask-image:linear-gradient(90deg,transparent,#000 3%,#000 94%,transparent);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 3%,#000 94%,transparent)}
.fita .correia{display:flex; width:max-content; animation:correr 68s linear infinite}
.fita:hover .correia{animation-play-state:paused}
.fita .it{display:flex; align-items:center; gap:9px; padding:0 22px; height:46px; font-size:12.5px;
  border-right:1px solid var(--line); white-space:nowrap; color:var(--ink2)}
.fita .it b{color:var(--ink); font-weight:600}
.fita .it .q{color:var(--mut); font-size:11.5px}
.fita .it .hoje{color:var(--warn); font-weight:650}

main{padding:26px; max-width:1560px; width:100%; margin:0 auto; flex:1}
h1{font-size:30px; margin:2px 0 6px; font-weight:680; letter-spacing:-.9px; line-height:1.15}
h1 .fino{font-weight:380; color:var(--mut)}
.sob{color:var(--mut); font-size:13.5px; margin-bottom:22px}
h2{font-size:13px; margin:30px 0 13px; font-weight:640; display:flex; align-items:center; gap:10px;
  color:var(--ink2); text-transform:uppercase; letter-spacing:.1em}
h2::before{content:''; width:3px; height:13px; border-radius:2px; flex:none;
  background:linear-gradient(180deg,var(--acc),var(--acc2))}
h2 .n{color:var(--mut); font-weight:400; font-size:12px; text-transform:none; letter-spacing:0}
.mut{color:var(--mut)} .small{font-size:12px}

/* ================================================================ botões */
.btn{border:1px solid var(--line2); background:var(--surf); color:var(--ink);
  padding:10px 16px; border-radius:var(--r3); transition:all var(--t); display:inline-flex;
  align-items:center; gap:8px; white-space:nowrap}
.btn:hover{background:var(--surf2); border-color:var(--line3); transform:translateY(-1px)}
.btn:active{transform:none}
.btn.p{background:linear-gradient(145deg,var(--acc),var(--acc-d)); border-color:transparent; color:#fff;
  font-weight:600; box-shadow:0 8px 24px rgba(123,140,255,.3)}
.btn.p:hover{box-shadow:0 12px 32px rgba(123,140,255,.45)}
.btn.s{font-size:12.5px; padding:7px 12px; border-radius:9px}
.btn.w{border-color:rgba(74,222,128,.32); color:#86efac; background:rgba(74,222,128,.09)}
.btn.w:hover{border-color:rgba(74,222,128,.6); background:rgba(74,222,128,.16)}
.btn.danger{color:var(--red); border-color:rgba(248,113,113,.35)}
.btn[disabled]{opacity:.4; pointer-events:none}

/* ================================================================ cards */
.card,.bloco,.painel{
  background:linear-gradient(165deg,var(--surf2),var(--surf));
  border:1px solid var(--line); border-radius:var(--r); position:relative;
  transition:border-color var(--t), transform var(--t), box-shadow var(--t);
}
.painel{padding:20px 22px}
.bloco{padding:20px 22px}
.bloco:hover,.painel:hover{border-color:var(--line2)}
.bloco h3{margin:0 0 5px; font-size:15px; font-weight:640; letter-spacing:-.2px; display:flex; align-items:center; gap:9px}
.bloco .sub{color:var(--mut); font-size:12.5px; margin-bottom:16px; line-height:1.5}
.bloco.wide{grid-column:1/-1}

/* --- pills de status --- */
.pill{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600; padding:4px 11px;
  border-radius:99px; border:1px solid transparent; white-space:nowrap}
.pill.azul{background:rgba(123,140,255,.15); color:#a9b4ff; border-color:rgba(123,140,255,.3)}
.pill.verde{background:rgba(74,222,128,.14); color:#7ee6a6; border-color:rgba(74,222,128,.26)}
.pill.amar{background:rgba(251,191,36,.14); color:#fcd34d; border-color:rgba(251,191,36,.26)}
.pill.laran{background:rgba(251,146,60,.14); color:#fdba74; border-color:rgba(251,146,60,.26)}
.pill.verm{background:rgba(248,113,113,.14); color:#fca5a5; border-color:rgba(248,113,113,.26)}
.pill.cinza{background:var(--surf2); color:var(--mut); border-color:var(--line)}
.pill.ciano{background:rgba(63,216,194,.13); color:#6ee7d5; border-color:rgba(63,216,194,.26)}
.pill.roxo{background:rgba(178,141,255,.14); color:#c9b0ff; border-color:rgba(178,141,255,.28)}

/* etiquetas antigas mapeadas para as pills novas */
.tag{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:3px 9px;
  border-radius:99px; border:1px solid var(--line); background:var(--surf2); color:var(--mut); margin-right:5px}
.tag.esq{background:rgba(251,191,36,.12); color:#fcd34d; border-color:rgba(251,191,36,.24)}
.tag.fal{background:var(--surf2); color:var(--mut2)}
.tag.fd{background:rgba(74,222,128,.12); color:#7ee6a6; border-color:rgba(74,222,128,.24)}
.tag.fp{background:rgba(123,140,255,.13); color:#a9b4ff; border-color:rgba(123,140,255,.26)}
.tag.ft{background:rgba(178,141,255,.13); color:#c9b0ff; border-color:rgba(178,141,255,.26)}
.tag.fn{background:var(--surf2); color:var(--mut2)}

/* --- chips (etiquetas calculadas do dossiê) --- */
.chips{display:flex; flex-wrap:wrap; gap:7px; margin:14px 0 4px}
.chip{font-size:12px; padding:5px 12px; border-radius:99px; background:var(--surf2);
  border:1px solid var(--line); color:var(--ink2)}
.chip.b{background:rgba(63,216,194,.1); border-color:rgba(63,216,194,.26); color:#6ee7d5}

/* --- fotos redondas --- */
.ph{width:46px;height:46px;border-radius:14px;object-fit:cover;display:block;flex:none;
  background:var(--surf2); border:1px solid var(--line2); transition:all var(--t)}
.ph.none{display:grid; place-items:center; font-size:17px; color:var(--mut2)}

/* --- abas --- */
.tabs{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:18px; align-items:center}
.tabs button{padding:9px 15px; border-radius:var(--r3); border:1px solid var(--line); background:var(--surf);
  color:var(--ink2); font-size:13px; transition:all var(--t)}
.tabs button:hover{background:var(--surf2); color:var(--ink); border-color:var(--line2)}
.tabs button.on{background:linear-gradient(145deg,rgba(123,140,255,.28),rgba(123,140,255,.12));
  border-color:rgba(123,140,255,.45); color:#fff; font-weight:600}

/* --- barra de ferramentas --- */
.ferramentas{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px}
.ferramentas .cresce{flex:1}
.busca-in{flex:1; min-width:200px; max-width:420px; padding:10px 15px; color:var(--ink);
  border:1px solid var(--line); border-radius:var(--r3); font:inherit; background:var(--surf)}
.busca-in:focus{outline:none; border-color:rgba(123,140,255,.55); background:rgba(123,140,255,.07)}
.conta{color:var(--mut); font-size:12.5px}

/* --- filtros removíveis --- */
.filtros{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:14px}
.filtro{display:inline-flex; align-items:center; gap:8px; padding:6px 8px 6px 13px; border-radius:99px;
  background:var(--surf2); border:1px solid var(--line2); font-size:12.5px}
.filtro b{font-weight:600}
.filtro button{width:18px;height:18px;border-radius:50%;border:none;background:var(--surf3);color:var(--mut);
  display:grid;place-items:center;font-size:11px;line-height:1;transition:all var(--t)}
.filtro button:hover{background:var(--red); color:#fff}

/* ================================================================ tabela */
.tabela{border:1px solid var(--line); border-radius:var(--r); overflow:hidden;
  background:linear-gradient(165deg,var(--surf2),var(--surf))}
.tcab,.lista .row{display:grid; grid-template-columns:52px minmax(200px,2.1fr) 108px 150px minmax(130px,1fr) 128px 40px;
  gap:14px; align-items:center; padding:13px 20px}
.tcab{font-size:10.5px; text-transform:uppercase; letter-spacing:.11em; color:var(--mut2); font-weight:650;
  border-bottom:1px solid var(--line); background:rgba(255,255,255,.02)}
.lista .row{border-bottom:1px solid var(--line); cursor:pointer; transition:background var(--t)}
.lista .row:last-child{border-bottom:none}
.lista .row:hover{background:var(--surf2)}
.lista .row .nm{font-weight:600; font-size:13.5px; display:block}
.lista .row .sub2{color:var(--mut); font-size:11.5px; margin-top:2px}
.lista .row .cel{min-width:0; overflow:hidden; text-overflow:ellipsis; font-size:13px}
.lista .row .maisz{color:var(--mut2); text-align:center; font-size:16px; letter-spacing:1px}
.lista .row .maisz:hover{color:var(--ink)}
/* variante simples: usada nas listas de Pendências, que não têm as 7 colunas da tabela */
.lista.simples{border:1px solid var(--line); border-radius:var(--r); overflow:hidden;
  background:linear-gradient(165deg,var(--surf2),var(--surf))}
.lista.simples .row{grid-template-columns:46px minmax(180px,1.6fr) 120px minmax(120px,1.4fr); gap:14px}
.lista.simples .row .c3,.lista.simples .row .c4{min-width:0; overflow:hidden; text-overflow:ellipsis}
.lista.alertas{border:1px solid var(--line); border-radius:var(--r); overflow:hidden;
  background:linear-gradient(165deg,var(--surf2),var(--surf))}

/* paginação */
.pag{display:flex; align-items:center; gap:8px; margin-left:auto; color:var(--mut); font-size:12.5px}
.pag button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surf);
  color:var(--ink2); display:grid; place-items:center; transition:all var(--t)}
.pag button:hover:not([disabled]){background:var(--surf2); border-color:var(--line2); color:#fff}
.pag button[disabled]{opacity:.3; pointer-events:none}

/* ================================================================ gráficos */
.barras{display:flex; flex-direction:column; gap:10px}
.bar{display:grid; grid-template-columns:66px 1fr auto; gap:12px; align-items:center; font-size:12.5px}
.bar .t{color:var(--ink2)}
.bar .f{height:10px; border-radius:99px; background:rgba(255,255,255,.05); overflow:hidden}
.bar .f i{display:block; height:100%; border-radius:99px;
  background:linear-gradient(90deg,var(--acc),var(--acc3)); transition:width .55s cubic-bezier(.4,0,.2,1)}
.bar .v{color:var(--ink); font-weight:650; min-width:66px; text-align:right}
.bar .v small{color:var(--mut); font-weight:400}
.bar.fraca .f i{background:linear-gradient(90deg,var(--warn),var(--orange))}
.barras.largas .bar{grid-template-columns:minmax(150px,max-content) 1fr auto}
.barras.largas .bar .t{white-space:nowrap}

/* colunas (o gráfico de barras vertical da referência) */
.colunas{display:flex; align-items:flex-end; gap:10px; height:210px; padding:10px 0 0; position:relative}
.col{flex:1; display:flex; flex-direction:column; align-items:center; gap:9px; height:100%; justify-content:flex-end;
  cursor:default}
.col .haste{width:100%; max-width:46px; border-radius:9px 9px 4px 4px; position:relative;
  background:linear-gradient(180deg,var(--acc),rgba(123,140,255,.45)); transition:all var(--t); min-height:3px}
.col:hover .haste{background:linear-gradient(180deg,#9aa8ff,rgba(123,140,255,.7));
  box-shadow:0 0 24px rgba(123,140,255,.45)}
.col .lg{font-size:10.5px; color:var(--mut2); white-space:nowrap}
.col .vl{position:absolute; top:-22px; left:50%; transform:translateX(-50%); font-size:11px; font-weight:650;
  background:var(--solid); border:1px solid var(--line2); padding:3px 8px; border-radius:7px;
  opacity:0; transition:opacity var(--t); pointer-events:none; white-space:nowrap}
.col:hover .vl{opacity:1}

/* rosca */
.rosca{display:flex; gap:26px; align-items:center; flex-wrap:wrap}
.rosca svg{flex:none}
.rosca .leg{display:flex; flex-direction:column; gap:10px; flex:1; min-width:170px}
.rosca .leg div{display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--ink2)}
.rosca .leg i{width:9px;height:9px;border-radius:50%;flex:none}
.rosca .leg b{margin-left:auto; color:var(--ink); font-weight:650}

/* fatos calculados */
.fatos{display:grid; grid-template-columns:repeat(auto-fill,minmax(155px,1fr)); gap:12px}
.fato{padding:15px 16px; border-radius:var(--r2); border:1px solid var(--line); background:var(--surf);
  transition:all var(--t)}
.fato:hover{border-color:var(--line2); background:var(--surf2); transform:translateY(-2px)}
.fato .v{font-size:23px; font-weight:680; letter-spacing:-.7px; line-height:1.1}
.fato .v.b{color:var(--acc2)} .fato .v.s{color:var(--acc3); font-size:16px}
.fato .k{color:var(--mut); font-size:11px; margin-top:6px; line-height:1.35}

.recs{display:flex; flex-direction:column}
.rec{display:grid; grid-template-columns:1fr auto; gap:14px; padding:11px 0; border-bottom:1px solid var(--line);
  align-items:baseline}
.rec:last-child{border-bottom:none}
.rec .q{font-weight:600; font-size:13.5px}
.rec .q small{display:block; color:var(--mut); font-weight:400; font-size:11.5px; margin-top:3px; line-height:1.45}
.rec .val{color:var(--acc2); font-weight:680; white-space:nowrap; font-size:14px}
.dias{display:flex; flex-direction:column}
.dia{display:flex; gap:13px; align-items:baseline; font-size:12.5px; padding:9px 0; border-bottom:1px solid var(--line)}
.dia:last-child{border-bottom:none}
.dia b{color:var(--acc); min-width:48px; font-weight:650}
.nuvem{display:flex; flex-wrap:wrap; gap:8px}
.nuvem a{padding:7px 13px; border-radius:99px; border:1px solid var(--line2); font-size:12.5px;
  color:var(--ink2); background:var(--surf); transition:all var(--t)}
.nuvem a:hover{border-color:rgba(123,140,255,.55); color:#fff; background:rgba(123,140,255,.13)}
.nuvem a b{color:var(--acc2); font-weight:680}
.ressalva{margin-top:14px; font-size:11.5px; color:var(--mut); line-height:1.55;
  border-left:2px solid var(--line2); padding-left:12px}
.desc{display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:14px; align-items:start}

/* estatística simples */
.stat{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:20px}
.stat>div{padding:16px 18px; border-radius:var(--r2); border:1px solid var(--line); background:var(--surf);
  color:var(--mut); font-size:12px}
.stat>div b{display:block; font-size:25px; color:var(--ink); font-weight:680; letter-spacing:-.8px; margin-bottom:4px}

.vazio{padding:44px; text-align:center; color:var(--mut2); border:1px dashed var(--line2);
  border-radius:var(--r); font-size:13.5px}

/* ================================================================ aniversários */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(186px,1fr)); gap:14px}
.card{padding:18px 16px; text-align:center}
.card:hover{border-color:var(--line2); transform:translateY(-3px); box-shadow:var(--shadow)}
.card .ph{width:66px;height:66px;border-radius:50%;margin:0 auto 12px}
.card .nm{font-size:13.5px; font-weight:600; line-height:1.3; margin-bottom:4px}
.card .dt{color:var(--mut); font-size:12px}
.card .em{font-size:12px; color:var(--ink2); margin:9px 0 12px}
.card.hoje{border-color:rgba(123,140,255,.5);
  background:linear-gradient(160deg,rgba(123,140,255,.2),rgba(123,140,255,.04)); animation:pulso 2.8s infinite}

/* ================================================================ aniversários v6
   Prioridade: hoje → 7 dias → 30 dias. Os números só aparecem como gráfico, e
   gráfico dos PRÓPRIOS aniversariantes — nunca do banco inteiro nesta tela. */
.cab-aniv{display:flex; align-items:flex-end; gap:18px; flex-wrap:wrap; margin-bottom:22px}
.cab-aniv .t{flex:1; min-width:260px}
.vivo{display:inline-flex; align-items:center; gap:8px; font-size:12.5px; color:var(--mut); margin-bottom:10px}
.vivo i{width:8px;height:8px;border-radius:50%; background:var(--ok); box-shadow:0 0 0 4px rgba(74,222,128,.15)}
.vivo b{color:var(--ink); font-weight:600}
.titulo-g{font-size:40px; font-weight:700; letter-spacing:-1.6px; line-height:1.05; margin:0;
  background:linear-gradient(95deg,#fff 0%,#fff 45%,#8b90a8 100%); -webkit-background-clip:text; background-clip:text; color:transparent}
.seg{display:inline-flex; padding:4px; border-radius:13px; background:var(--surf); border:1px solid var(--line); gap:3px}
.seg button{padding:8px 13px; border-radius:9px; border:none; background:transparent; color:var(--mut); font-size:12.5px; transition:all var(--t)}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--surf3); color:#fff; box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}

/* --- rótulo de seção no estilo "Live Updates / Market Overview" --- */
.secao{display:flex; align-items:flex-end; gap:14px; margin:34px 0 15px; flex-wrap:wrap}
.secao .ey{font-size:12px; color:var(--mut); display:flex; align-items:center; gap:7px; margin-bottom:3px}
.secao h3{margin:0; font-size:22px; font-weight:660; letter-spacing:-.6px}
.secao .dir{margin-left:auto; color:var(--mut); font-size:12.5px}

/* --- cards de destaque (os "Bitcoin / Ethereum" da referência) --- */
.destaques{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(330px,420px); gap:16px;
  overflow-x:auto; padding-bottom:6px; scroll-snap-type:x mandatory}
.fc{position:relative; overflow:hidden; border-radius:26px; padding:22px 22px 0; min-height:300px;
  background:linear-gradient(170deg,rgba(255,255,255,.06),rgba(255,255,255,.015)); border:1px solid var(--line2);
  scroll-snap-align:start; display:flex; flex-direction:column}
.fc::before{content:''; position:absolute; left:-60px; top:40px; width:230px; height:230px; border-radius:50%;
  background:radial-gradient(circle,var(--glow,rgba(123,140,255,.35)),transparent 68%); opacity:.55; pointer-events:none}
.fc::after{content:''; position:absolute; left:0; top:132px; width:3px; height:30px; border-radius:0 3px 3px 0; background:var(--cor,var(--acc))}
.fc .topo{display:flex; align-items:center; gap:14px; position:relative}
.fc .foto{width:54px;height:54px;border-radius:16px;object-fit:cover;flex:none;border:1px solid var(--line2);background:var(--surf2)}
.fc .foto.none{display:grid;place-items:center;font-size:22px}
.fc .quem{min-width:0; flex:1}
.fc .quem small{display:block; font-size:12px; color:var(--mut); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.fc .quem b{display:block; font-size:18px; font-weight:640; letter-spacing:-.3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.fc .mais{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;
  background:var(--surf2);border:1px solid var(--line);color:var(--ink2);font-size:17px}
.fc .mais:hover{background:var(--surf3);color:#fff}
.fc .rot{margin-top:26px; font-size:13px; color:var(--mut); position:relative}
.fc .grande{font-size:48px; font-weight:700; letter-spacing:-2px; line-height:1.05; position:relative;
  background:linear-gradient(90deg,#fff 55%,rgba(255,255,255,.35)); -webkit-background-clip:text; background-clip:text; color:transparent}
.fc .grande small{font-size:20px; letter-spacing:-.4px}
.fc .linha{display:flex; gap:8px; align-items:center; margin-top:12px; flex-wrap:wrap; position:relative}
.fc .rodape-g{margin-top:auto; position:relative; height:92px; margin-left:-22px; margin-right:-22px}
.fc .rodape-g svg{position:absolute; left:0; bottom:0; width:100%; height:100%}
.fc .anel{position:absolute; right:20px; top:92px}
.fc .zap{position:absolute; right:18px; bottom:16px; z-index:2}

/* --- a semana: 7 colunas, uma por dia --- */
.semana{display:grid; grid-template-columns:repeat(7,1fr); gap:10px}
.dsem{border-radius:18px; border:1px solid var(--line); background:var(--surf); padding:13px 10px 12px;
  min-height:170px; display:flex; flex-direction:column; gap:9px; transition:all var(--t)}
.dsem:hover{border-color:var(--line2); background:var(--surf2)}
.dsem.hoje{border-color:rgba(123,140,255,.55); background:linear-gradient(170deg,rgba(123,140,255,.18),rgba(123,140,255,.03))}
.dsem.fds .dn{color:var(--acc3)}
.dsem .dn{font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--mut)}
.dsem .dnum{font-size:24px; font-weight:680; letter-spacing:-.8px; line-height:1}
.dsem .gente{display:flex; flex-direction:column; gap:6px; margin-top:4px}
.dsem .pp{display:flex; align-items:center; gap:7px; font-size:11.5px; line-height:1.25; color:var(--ink2); min-width:0}
.dsem .pp img,.dsem .pp .none{width:24px;height:24px;border-radius:50%;flex:none;object-fit:cover;border:1px solid var(--line2);background:var(--surf2);display:grid;place-items:center;font-size:11px}
.dsem .pp span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.dsem .pp:hover span{color:#fff}
.dsem .nada{font-size:11.5px; color:var(--mut2); margin-top:auto}
.dsem .ct2{margin-top:auto; font-size:11px; color:var(--mut)}

/* --- 30 dias: uma coluna por dia --- */
.trinta{display:flex; align-items:flex-end; gap:4px; height:180px; padding:30px 4px 0; position:relative}
.trinta .d{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; height:100%; justify-content:flex-end; min-width:0; cursor:default}
.trinta .h{width:100%; max-width:26px; border-radius:7px 7px 3px 3px; min-height:3px; position:relative;
  background:linear-gradient(180deg,var(--acc),rgba(123,140,255,.35)); transition:all var(--t)}
.trinta .d.zero .h{background:rgba(255,255,255,.06)}
.trinta .d.fds .h{background:linear-gradient(180deg,var(--acc3),rgba(178,141,255,.35))}
.trinta .d.hoje .h{background:linear-gradient(180deg,var(--warn),rgba(251,191,36,.4))}
.trinta .d:hover .h{filter:brightness(1.3); box-shadow:0 0 18px rgba(123,140,255,.45)}
.trinta .h img{position:absolute; top:-26px; left:50%; transform:translateX(-50%); width:22px; height:22px;
  border-radius:50%; object-fit:cover; border:1.5px solid var(--bg); box-shadow:0 0 0 1px var(--line2)}
.trinta .n{font-size:9.5px; color:var(--mut2); font-variant-numeric:tabular-nums}
.trinta .d.marco .n{color:var(--warn)}
.leg-trinta{display:flex; gap:18px; flex-wrap:wrap; font-size:11.5px; color:var(--mut); margin-top:12px}
.leg-trinta i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px}

/* --- lista dos 30 dias (tabela no estilo "Market Overview") --- */
.tab30 .tcab,.tab30 .row{grid-template-columns:44px minmax(210px,2.2fr) 120px 92px 92px 132px 118px}
.tab30 .row .num{color:var(--mut2); font-size:12px}
.tab30 .row .rel{color:var(--acc3); font-size:11.5px}
.tab30 .row .faz{font-weight:650}
.tab30 .row .faz.marco{color:var(--warn)}

/* --- anel de progresso (idade até o próximo marco / dias até o aniversário) --- */
.anelx text{font-family:-apple-system,sans-serif}

/* --- marcos --- */
.marcos{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px}
.mc{border-radius:16px; padding:14px; border:1px solid rgba(251,191,36,.28);
  background:linear-gradient(165deg,rgba(251,191,36,.12),rgba(251,191,36,.02)); cursor:pointer; transition:all var(--t)}
.mc:hover{transform:translateY(-2px); border-color:rgba(251,191,36,.55)}
.mc .v{font-size:30px; font-weight:720; letter-spacing:-1px; color:#fcd34d; line-height:1}
.mc .v small{font-size:13px; color:var(--mut); font-weight:500; letter-spacing:0}
.mc .q{font-size:12.5px; margin-top:8px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.mc .w{font-size:11px; color:var(--mut); margin-top:2px}

@container area (max-width:900px){
  .semana{grid-template-columns:repeat(4,1fr)}
  .tab30 .tcab,.tab30 .row{grid-template-columns:40px minmax(160px,2fr) 100px 80px 110px}
  .tab30 .esconde{display:none}
  .titulo-g{font-size:32px}
}
@container area (max-width:620px){
  .semana{grid-template-columns:repeat(2,1fr)}
  .destaques{grid-auto-columns:88%}
}

/* ================================================================ mapa
   Motor próprio (sem biblioteca): ladrilhos de satélite da Esri + ruas e nomes por cima.
   O pino é a foto da pessoa, com borda na cor do círculo. Mesma casa = um pino só. */
.mapa-wrap{display:grid; grid-template-columns:1fr 340px; gap:14px; align-items:start}
.mapa-vista{position:relative; overflow:hidden; border-radius:var(--r); border:1px solid var(--line2);
  height:calc(100vh - 230px); min-height:460px; background:#0b0d14; cursor:grab; touch-action:none; user-select:none}
.mapa-vista.arrastando{cursor:grabbing}
.mapa-vista.marcando{cursor:crosshair}
.mapa-vista .camada{position:absolute; inset:0; pointer-events:none; z-index:0}
.mapa-vista .camada.rotulos{z-index:1}
/* 257px e não 256: 1px de sobra por baixo do vizinho — sem ele, no zoom fracionário aparece
   uma fresta de meio pixel entre ladrilhos (linhas finas cruzando o satélite) */
.mapa-vista .camada img{position:absolute; left:0; top:0; width:257px; height:257px; max-width:none;
  transform-origin:0 0; opacity:0; transition:opacity .25s; will-change:transform}
.mapa-vista .camada img.ok{opacity:1}
.mapa-vista .camada.rotulos img{opacity:.92}
.mapa-vista .pinos{position:absolute; inset:0; pointer-events:none; z-index:3}
.pino{position:absolute; transform:translate(-50%,-100%); pointer-events:auto; cursor:pointer; transition:transform .15s}
.pino:hover{transform:translate(-50%,-100%) scale(1.12); z-index:5}
.pino .cab{display:grid; grid-template-columns:repeat(var(--por,4),calc(var(--t,38px) - var(--t,38px)*.28));
  padding:3px calc(3px + var(--t,38px)*.28) 3px 3px; row-gap:2px; border-radius:calc(var(--t,38px)/2 + 3px);
  background:var(--cor,#fff); box-shadow:0 6px 18px rgba(0,0,0,.6)}
.pino .rosto{width:var(--t,38px); height:var(--t,38px); border-radius:50%; overflow:hidden; display:grid; place-items:center;
  background:#1a1c2b; font-size:calc(var(--t,38px)*.42); border:2px solid var(--c,#fff); position:relative}
.pino .nc{position:absolute; left:50%; top:calc(100% + 2px); transform:translateX(-50%); font-size:10px; font-weight:650;
  padding:2px 7px; border-radius:99px; background:rgba(14,15,24,.9); color:#fff; white-space:nowrap; border:1px solid var(--line2)}
.pino.grupo .cab{outline:2px dashed rgba(255,255,255,.7); outline-offset:2px}
.pino .rosto img{width:100%; height:100%; object-fit:cover; display:block}
.pino .rosto.mais{background:#fff; color:#10101a; font-size:calc(var(--t,38px)*.32); font-weight:750; border-color:#fff}
.pino .rabo{width:0; height:0; margin:-2px auto 0; border-left:7px solid transparent; border-right:7px solid transparent;
  border-top:10px solid var(--cor,#fff)}
.pino.alvo .cab{box-shadow:0 0 0 5px rgba(255,255,255,.35),0 6px 18px rgba(0,0,0,.6)}
.balao{position:absolute; transform:translate(-50%,calc(-100% - 64px)); z-index:20; width:290px; pointer-events:auto;
  background:rgba(18,19,31,.96); border:1px solid var(--line2); border-radius:18px; padding:12px; box-shadow:0 20px 50px rgba(0,0,0,.7);
  backdrop-filter:blur(12px); cursor:default}
.balao.baixo{transform:translate(-50%,14px)}
.balao .add-casa{margin-top:9px; padding-top:9px; border-top:1px solid var(--line)}
.balao .add-casa input{width:100%; padding:8px 11px; border-radius:10px; border:1px dashed rgba(123,140,255,.45);
  background:rgba(123,140,255,.07); color:var(--ink); font:inherit; font-size:12.5px}
.balao .add-casa input:focus{outline:none; border-style:solid}
.balao #casa_res{display:flex; flex-direction:column; gap:5px; margin-top:6px; max-height:190px; overflow-y:auto}
.balao .fx{position:absolute; top:8px; right:10px; background:none; border:none; color:var(--mut); font-size:15px}
.balao .end{font-size:11.5px; color:var(--mut); margin:0 22px 9px 2px; line-height:1.4}
.balao .ps{display:flex; flex-direction:column; gap:6px; max-height:min(260px,var(--cabe,260px)); overflow-y:auto}
.balao .pq2{display:flex; gap:10px; align-items:center; padding:7px 8px; border-radius:11px; background:var(--surf); border:1px solid var(--line)}
.balao .pq2:hover{background:var(--surf2)}
.balao .pq2 .ph{width:34px; height:34px; border-radius:10px}
.balao .pq2 b{font-size:12.5px; display:block}
.balao .pq2 small{font-size:11px; color:var(--mut)}
.balao .pq2 .acs3{margin-left:auto; display:flex; gap:4px}
.balao .pq2 .acs3 button{width:26px; height:26px; border-radius:8px; border:1px solid var(--line2); background:var(--surf2); color:var(--ink2); font-size:12px}
.balao .pq2 .acs3 button:hover{background:var(--acc); color:#fff}
.mapa-ctl{position:absolute; top:12px; left:12px; display:flex; flex-direction:column; gap:6px; z-index:10}
.mapa-ctl button{width:38px; height:38px; border-radius:11px; border:1px solid var(--line2); background:rgba(14,15,24,.88);
  color:var(--ink); font-size:17px; backdrop-filter:blur(8px)}
.mapa-ctl button:hover{background:rgba(123,140,255,.3)}
.mapa-topo{position:absolute; top:12px; left:62px; right:12px; display:flex; gap:8px; z-index:10; flex-wrap:wrap; pointer-events:none}
.mapa-topo>*{pointer-events:auto}
.mapa-topo input{flex:1; min-width:180px; max-width:380px; padding:10px 14px; border-radius:12px; border:1px solid var(--line2);
  background:rgba(14,15,24,.9); color:var(--ink); font:inherit; backdrop-filter:blur(8px)}
.mapa-topo input:focus{outline:none; border-color:rgba(123,140,255,.7)}
.mapa-topo .seg{background:rgba(14,15,24,.88); backdrop-filter:blur(8px)}
.geo-res{position:absolute; top:58px; left:62px; z-index:15; width:min(420px,calc(100% - 80px)); background:rgba(18,19,31,.97);
  border:1px solid var(--line2); border-radius:14px; overflow:hidden; box-shadow:0 18px 44px rgba(0,0,0,.6)}
.geo-res div{padding:10px 14px; font-size:12.5px; cursor:pointer; border-bottom:1px solid var(--line); color:var(--ink2)}
.geo-res div:hover{background:rgba(123,140,255,.14); color:#fff}
.geo-res div:last-child{border-bottom:none}
.faixa-marcar{position:absolute; left:50%; bottom:18px; transform:translateX(-50%); z-index:15; display:flex; gap:10px; align-items:center;
  padding:10px 12px 10px 16px; border-radius:14px; background:rgba(123,140,255,.95); color:#fff; font-size:13px; font-weight:560;
  box-shadow:0 14px 40px rgba(0,0,0,.55); max-width:calc(100% - 30px)}
.faixa-marcar button{border:none; border-radius:9px; padding:6px 11px; background:rgba(0,0,0,.25); color:#fff; font-size:12px}
.creditos{position:absolute; right:8px; bottom:6px; z-index:10; font-size:10px; color:rgba(255,255,255,.75);
  background:rgba(0,0,0,.45); padding:2px 7px; border-radius:6px; pointer-events:none}
.mapa-lado{border:1px solid var(--line); border-radius:var(--r); background:linear-gradient(165deg,var(--surf2),var(--surf));
  display:flex; flex-direction:column; height:calc(100vh - 230px); min-height:460px; overflow:hidden}
.mapa-lado .cab2{padding:15px 15px 10px; border-bottom:1px solid var(--line)}
.mapa-lado .cab2 input{width:100%; margin-top:10px; padding:9px 13px; border-radius:11px; border:1px solid var(--line); background:var(--surf); color:var(--ink); font:inherit}
.mapa-lado .lst{overflow-y:auto; flex:1; padding:6px}
.mapa-lado .it2{display:flex; gap:10px; align-items:center; padding:8px 9px; border-radius:12px; cursor:pointer; border:1px solid transparent}
.mapa-lado .it2:hover{background:var(--surf2); border-color:var(--line)}
.mapa-lado .it2.ativo{background:rgba(123,140,255,.16); border-color:rgba(123,140,255,.45)}
.mapa-lado .it2 .ph{width:36px; height:36px; border-radius:11px}
.mapa-lado .it2 .tx{min-width:0; flex:1}
.mapa-lado .it2 b{display:block; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.mapa-lado .it2 small{display:block; font-size:11px; color:var(--mut); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.mapa-lado .it2 .marca-pin{font-size:11px; padding:4px 9px; border-radius:99px; border:1px solid rgba(123,140,255,.4);
  color:#b6c0ff; background:rgba(123,140,255,.1); white-space:nowrap}
.mapa-lado .rodape3{padding:10px 14px; border-top:1px solid var(--line); font-size:11.5px; color:var(--mut)}
@container area (max-width:900px){
  .mapa-wrap{grid-template-columns:1fr}
  .mapa-lado{height:420px}
}

/* ================================================================ perfil */
.perfil{display:flex; gap:24px; padding:26px; border-radius:var(--r); border:1px solid var(--line);
  background:linear-gradient(160deg,var(--surf2),var(--surf)); flex-wrap:wrap}
.perfil>.ph{align-self:flex-start}
.perfil>.ph,.perfil .gfoto .ph{width:132px;height:132px;border-radius:26px}
.perfil .gfoto{position:relative; display:block; flex:none; align-self:flex-start; line-height:0}
.perfil .gfoto::after{content:'🖼️'; position:absolute; right:-6px; bottom:-6px; width:30px;height:30px;
  border-radius:10px; background:var(--solid); border:1px solid var(--line2); display:grid; place-items:center; font-size:13px}
.perfil .info{flex:1; min-width:270px}
.perfil h1{margin:0 0 10px}
.kv{display:grid; grid-template-columns:auto 1fr; gap:9px 20px; margin:18px 0 4px; font-size:13.5px; align-items:baseline}
.kv b{color:var(--mut); font-weight:500; font-size:12.5px}
.obs{margin-top:16px; padding:14px 16px; border-radius:var(--r2); background:var(--surf);
  border:1px solid var(--line); border-left:3px solid var(--acc3); font-size:13px; line-height:1.6}
.acoes{display:flex; gap:9px; flex-wrap:wrap; margin-top:20px}
.circ{font-size:11.5px; font-weight:600; padding:3px 11px; border-radius:99px; border:1px solid transparent}
.circ.c3{background:rgba(74,222,128,.14); color:#7ee6a6; border-color:rgba(74,222,128,.28)}
.circ.c2{background:rgba(123,140,255,.15); color:#a9b4ff; border-color:rgba(123,140,255,.3)}
.circ.c1{background:rgba(251,191,36,.13); color:#fcd34d; border-color:rgba(251,191,36,.26)}
.circ.c0{background:var(--surf2); color:var(--mut2); border-color:var(--line)}

/* links externos */
.links{display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 2px}
.lk{display:inline-flex; align-items:center; gap:8px; padding:8px 14px; border-radius:99px;
  border:1px solid var(--line2); background:var(--surf); color:var(--ink2); font-size:12.5px; transition:all var(--t)}
.lk:hover{color:#fff; border-color:rgba(123,140,255,.55); background:rgba(123,140,255,.13); transform:translateY(-1px)}
.lk .ic{font-size:14px; line-height:1}
.lk .qual{color:var(--mut); font-size:11.5px; max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.lk.zap{border-color:rgba(74,222,128,.34); color:#86efac; background:rgba(74,222,128,.08)}
.lk.zap:hover{border-color:rgba(74,222,128,.7); background:rgba(74,222,128,.16)}

/* ================================================================ árvore completa (v2 · 01/10/2026)
   Uma linha por geração, casais colados, linhas em pente (pais → barra → filhos), arrastar/pinça/zoom.
   Embaixo do nome: o que a pessoa é da ficha aberta. Tracejado verde = ligado sem sangue. */
.avw{position:relative}
.av-tit{display:none}
.av-bar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0 0 9px}
.av-seg{display:inline-flex; flex:none; padding:3px; gap:2px; border-radius:12px; background:var(--surf); border:1px solid var(--line)}
.av-seg button{border:0; background:transparent; color:var(--ink2); padding:7px 12px; border-radius:9px; font-size:12.5px; font-weight:600; white-space:nowrap; transition:background var(--t),color var(--t)}
.av-seg button:hover{color:#fff}
.av-seg button.on{background:linear-gradient(145deg,var(--acc),var(--acc-d)); color:#fff; box-shadow:0 4px 14px rgba(123,140,255,.32)}
.av-seg button i{font-style:normal; font-size:11px; padding:1px 7px; border-radius:99px; background:rgba(255,255,255,.12); margin-left:5px}
.av-tg{display:inline-flex; flex:none; gap:7px; align-items:center; font-size:12.5px; color:var(--ink2); cursor:pointer; white-space:nowrap}
.av-tg input{accent-color:var(--acc)}
.av-cheia-bt{margin-left:auto; flex:none; border:1px solid var(--line2); background:var(--surf); color:var(--ink); border-radius:11px; padding:7px 13px; font-size:12.5px; font-weight:600; white-space:nowrap}
.av-cheia-bt:hover{border-color:rgba(123,140,255,.6)}
.av-resumo{font-size:12.5px; color:var(--mut); margin:0 0 10px}
.av-resumo b{color:var(--ink); font-weight:650}
.av-vazio{padding:22px; border:1px dashed var(--line2); border-radius:var(--r2); color:var(--mut); text-align:center}
/* janela da árvore */
.av-vp{position:relative; height:560px; border:1px solid var(--line); border-radius:var(--r); overflow:hidden;
  touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  background:radial-gradient(900px 440px at 50% 0%,rgba(123,140,255,.09),transparent 64%),
    radial-gradient(circle at 1px 1px,rgba(255,255,255,.05) 1px,transparent 0) 0 0/22px 22px,var(--surf)}
.av-vp.arrastando{cursor:grabbing}
.av-palco{position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform}
.av-palco svg{position:absolute; left:0; top:0; overflow:visible; pointer-events:none}
.av-palco .u path{fill:none; stroke-linecap:round; stroke-linejoin:round; transition:opacity .2s}
.av-palco .u.sg path,.av-palco .u.dir path{stroke:rgba(150,162,255,.5); stroke-width:1.5}
.av-palco .u.dir .ud,.av-palco .u.dir .cl,.av-palco .u.dir .pd,.av-palco .u.dir .cd.dir{stroke:#8b9bff; stroke-width:2.4; filter:drop-shadow(0 0 4px rgba(123,140,255,.55))}
.av-palco .u.ss path{stroke:rgba(63,216,194,.55); stroke-width:1.4; stroke-dasharray:5 5}
.av-palco .pl text{font:600 11px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}
.av-palco.apaga .av-c:not(.cam){opacity:.26}
.av-palco.apaga .u path,.av-palco.apaga .pl{opacity:.2}
.av-palco.apaga .u path.cam{opacity:1; stroke:#fff; stroke-width:2.6; stroke-dasharray:none; filter:drop-shadow(0 0 5px rgba(255,255,255,.55))}
/* cards */
.av-c{position:absolute; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; text-align:center; overflow:hidden;
  padding:11px 8px 9px; border:1px solid var(--line2); border-radius:16px; cursor:pointer; z-index:1;
  background:linear-gradient(165deg,rgba(30,32,52,.97),rgba(17,18,30,.97));
  transition:border-color .2s,box-shadow .2s,opacity .2s}
.av-c:hover{border-color:rgba(123,140,255,.75); box-shadow:0 10px 28px rgba(0,0,0,.5),0 0 22px rgba(123,140,255,.28)}
.av-f{width:50px; height:50px; border-radius:50%; flex:none; margin:0 0 8px; object-fit:cover; display:block; pointer-events:none;
  box-shadow:0 0 0 2px rgba(255,255,255,.06)}
.av-f.none{display:grid; place-items:center; background:var(--surf2); font-size:20px; color:var(--mut2)}
.av-n{font-size:12px; font-weight:650; line-height:1.25; color:var(--ink); min-height:30px; width:100%;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.av-r{margin-top:5px; font-size:11px; font-weight:700; line-height:1.22; color:#aab5ff; width:100%;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.av-d{margin-top:2px; font-size:10px; color:var(--mut); width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.av-a{margin-top:auto; padding-top:3px; font-size:10.5px; color:var(--mut2); white-space:nowrap}
.av-x{position:absolute; top:8px; right:10px; font-size:12px; color:var(--mut)}
.av-c.main{border-color:rgba(123,140,255,.9); background:linear-gradient(160deg,rgba(123,140,255,.32),rgba(20,21,34,.97));
  box-shadow:0 0 0 4px rgba(123,140,255,.13),0 0 46px rgba(123,140,255,.34)}
.av-c.main .av-f{width:70px; height:70px; box-shadow:0 0 0 3px rgba(123,140,255,.45)}
.av-c.main .av-n{font-size:13px}
.av-c.main .av-r{color:#cfd5ff; text-transform:uppercase; letter-spacing:.1em; font-size:9.5px}
.av-c.dir{border-color:rgba(123,140,255,.5)}
.av-c.ss{border-style:dashed; border-color:rgba(63,216,194,.42); background:linear-gradient(165deg,rgba(20,33,40,.96),rgba(14,18,26,.96))}
.av-c.ss .av-r{color:#62e4d0}
.av-c.esq{border-style:dashed; border-color:rgba(251,191,36,.45)}
.av-c.esq .av-f{color:var(--warn); background:rgba(251,191,36,.1)}
.av-c.cam{border-color:#fff; border-style:solid; box-shadow:0 0 0 3px rgba(255,255,255,.14),0 0 30px rgba(123,140,255,.5)}
/* controles, rótulo das gerações, caminho */
.av-ctl{position:absolute; right:10px; bottom:10px; z-index:3; display:flex; flex-direction:column; gap:6px}
.av-ctl button{width:38px; height:38px; border-radius:12px; border:1px solid var(--line2); background:rgba(18,19,32,.86); color:var(--ink);
  font-size:17px; line-height:1; display:grid; place-items:center; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px)}
.av-ctl button:hover{border-color:rgba(123,140,255,.6)}
.av-gens{position:absolute; inset:0; pointer-events:none; z-index:2; overflow:hidden}
.av-gens span{position:absolute; left:10px; top:0; font-size:9.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  color:var(--mut); background:rgba(10,11,17,.72); border:1px solid var(--line); padding:2px 8px; border-radius:99px; white-space:nowrap}
.av-cam{position:absolute; left:10px; right:60px; bottom:10px; z-index:3; display:none; flex-wrap:wrap; gap:4px 6px; align-items:center;
  padding:8px 12px; border-radius:12px; background:rgba(14,15,26,.93); border:1px solid var(--line2); font-size:12px; pointer-events:none}
.av-cam.on{display:flex}
.av-cam small{color:var(--mut); text-transform:uppercase; letter-spacing:.1em; font-size:9.5px; margin-right:4px}
.av-cam span.f,.av-sc span.f{color:#cfd5ff; font-weight:700}
.av-cam span em,.av-sc span em{font-style:normal; color:#aab5ff; font-size:11px}
.av-cam i,.av-sc i{font-style:normal; color:var(--mut2)}
/* ficha rápida (toque no celular) */
.av-sheet{position:absolute; left:8px; right:8px; bottom:8px; z-index:5; padding:14px; border-radius:18px;
  background:rgba(16,17,29,.97); border:1px solid var(--line2); box-shadow:0 -10px 40px rgba(0,0,0,.55);
  transform:translateY(calc(100% + 20px)); transition:transform .26s cubic-bezier(.4,0,.2,1); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px)}
.av-sheet.on{transform:none}
.av-sx{position:absolute; top:10px; right:10px; width:32px; height:32px; border-radius:50%; border:1px solid var(--line2); background:var(--surf2); color:var(--ink)}
.av-st{display:flex; gap:12px; align-items:center; padding-right:36px}
.av-sf{width:58px; height:58px; border-radius:50%; object-fit:cover; flex:none; display:block}
.av-sf.none{display:grid; place-items:center; background:var(--surf2); font-size:24px; color:var(--mut2)}
.av-st b{display:block; font-size:15px; line-height:1.25}
.av-sr{display:block; color:#aab5ff; font-weight:700; font-size:13px; margin-top:2px}
.av-st small{display:block; color:var(--mut); font-size:12px; margin-top:2px}
.av-sc{display:flex; flex-wrap:wrap; gap:4px 6px; align-items:center; margin:11px 0 0; padding:9px 11px; border-radius:12px; background:var(--surf); border:1px solid var(--line); font-size:12.5px}
.av-sb{display:flex; gap:8px; margin-top:11px}
.av-sb .btn{flex:1; justify-content:center; padding:11px 8px}
/* legenda */
.av-leg i.dl{border-color:#8b9bff; background:rgba(123,140,255,.18); box-shadow:0 0 6px rgba(123,140,255,.6)}
.av-leg i.s{border-style:dashed; border-color:rgba(63,216,194,.6); background:rgba(63,216,194,.08)}
/* vista em lista */
.av-filtro{width:100%; margin:0 0 12px; padding:10px 13px; border-radius:12px; border:1px solid var(--line2); background:var(--surf); color:var(--ink); font:inherit}
.av-lg{margin:0 0 16px}
.av-lg h4{display:flex; align-items:center; gap:8px; margin:0 0 7px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.11em; color:var(--mut)}
.av-lg h4 .n{font-size:11px; letter-spacing:0; color:var(--ink2); background:var(--surf2); border:1px solid var(--line); border-radius:99px; padding:0 8px}
.av-lc{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:1px; border:1px solid var(--line); border-radius:var(--r2); overflow:hidden; background:var(--line)}
.av-li{display:flex; gap:11px; align-items:center; padding:9px 12px; background:var(--bg2); color:var(--ink); text-decoration:none; min-width:0; transition:background var(--t)}
.av-li:hover{background:var(--bg3); color:var(--ink); text-decoration:none}
.av-lf{width:42px; height:42px; border-radius:50%; object-fit:cover; flex:none; display:block}
.av-lf.none{display:grid; place-items:center; background:var(--surf2); font-size:17px; color:var(--mut2)}
.av-li.ss .av-lf{box-shadow:0 0 0 2px rgba(63,216,194,.45)}
.av-li.esq .av-lf{box-shadow:0 0 0 2px rgba(251,191,36,.45)}
.av-lt{flex:1; min-width:0}
.av-lt b{display:block; font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.av-lt small{display:block; font-size:12px; color:var(--mut); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.av-lt small em{font-style:normal; color:#aab5ff; font-weight:650}
.av-li.ss .av-lt small em{color:#62e4d0}
.av-li-s{color:var(--mut2); font-size:18px; flex:none}
/* tela cheia */
html.av-trava,html.av-trava body{overflow:hidden}
.avw.cheia{position:fixed; inset:0; z-index:400; display:flex; flex-direction:column; background:var(--bg);
  padding:calc(env(safe-area-inset-top,0px) + 10px) 10px calc(env(safe-area-inset-bottom,0px) + 10px)}
.avw.cheia::before{content:''; position:absolute; inset:0; z-index:-1; pointer-events:none;
  background:radial-gradient(900px 600px at 10% -10%,rgba(123,140,255,.16),transparent 60%)}
.avw.cheia .av-cheia-bt{position:absolute; z-index:6; top:calc(env(safe-area-inset-top,0px) + 6px); right:10px; background:rgba(18,19,32,.92)}
.avw.cheia .av-tit{padding-right:110px!important;
  display:block; font-size:15px; font-weight:700; margin:2px 4px 9px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-right:4px}
.avw.cheia .av-vp{flex:1; height:auto!important; min-height:0}
.avw.cheia .av-leg{display:none}
.avw.cheia .av-lista{flex:1; overflow:auto; -webkit-overflow-scrolling:touch}
.avw.cheia .av-resumo{margin-bottom:8px}
/* celular / tela de toque */
.avw.toque .av-bar{flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; padding-bottom:1px}
.avw.toque .av-bar::-webkit-scrollbar{display:none}
.avw.toque .av-vp{height:calc(100dvh - 290px); min-height:400px; border-radius:18px}
.avw.toque .av-ctl{right:8px; bottom:8px}
.avw.toque .av-ctl button{width:44px; height:44px; font-size:19px}
.avw.toque .av-c:hover{box-shadow:none; border-color:var(--line2)}
.avw.toque .av-c.main:hover{border-color:rgba(123,140,255,.9)}
.avw.toque .av-leg{display:none}
.avw.toque .av-lc{grid-template-columns:1fr}
.avw.toque .av-seg button{padding:8px 12px; font-size:13px}
@media (max-width:760px){
  .av-gens span{font-size:9px; padding:2px 7px}
  .av-cam{right:58px}
}

.legenda{font-size:11.5px; color:var(--mut); margin-top:14px; display:flex; gap:20px; flex-wrap:wrap; align-items:center}
.legenda i{display:inline-block; width:12px;height:12px;border-radius:5px; border:1px solid var(--line2);
  margin-right:7px; vertical-align:-2px; background:var(--surf2)}
.legenda i.m{border-color:rgba(123,140,255,.7); background:rgba(123,140,255,.3)}
.legenda i.d{border-style:dashed; border-color:rgba(251,191,36,.5)}

/* ================================================================ alertas */
.alerta{display:flex; gap:14px; padding:15px 18px; border-bottom:1px solid var(--line); align-items:flex-start}
.alerta:last-child{border-bottom:none}
.sev{font-size:9.5px; text-transform:uppercase; letter-spacing:.1em; padding:4px 9px; border-radius:7px;
  font-weight:700; flex:none; margin-top:1px}
.sev.erro{background:rgba(248,113,113,.15); color:#fca5a5; border:1px solid rgba(248,113,113,.3)}
.sev.aviso{background:rgba(251,191,36,.13); color:#fcd34d; border:1px solid rgba(251,191,36,.28)}
.sev.info{background:var(--surf2); color:var(--mut); border:1px solid var(--line)}
.alerta:has(.sev.info){opacity:.72}

/* ================================================================ importar */
.imp{display:flex; flex-direction:column; gap:12px}
.imp .par{display:grid; grid-template-columns:minmax(190px,1fr) 34px minmax(280px,1.5fr) auto; gap:16px;
  align-items:center; padding:16px 18px; border:1px solid var(--line); border-radius:var(--r2);
  background:var(--surf); transition:all var(--t)}
.imp .par:hover{border-color:var(--line2); background:var(--surf2)}
.imp .seta{color:var(--mut2); text-align:center; font-size:17px}
.imp .acs{display:flex; flex-direction:column; gap:7px}
.imp .of{font-size:11px; padding:2px 9px; border-radius:99px; background:rgba(178,141,255,.14);
  color:#c9b0ff; border:1px solid rgba(178,141,255,.26)}
.cand{display:flex; gap:12px; align-items:center; padding:11px 13px; border:1px solid var(--line);
  border-radius:var(--r3); background:var(--surf2); margin-bottom:7px}
.cand .ph{width:40px;height:40px;border-radius:12px}
.cand .idb{font-size:11px; font-weight:700; padding:3px 9px; border-radius:7px; background:rgba(123,140,255,.18);
  color:#a9b4ff; border:1px solid rgba(123,140,255,.3)}
.selrow{display:grid; grid-template-columns:24px minmax(180px,1.6fr) 150px 1fr; gap:14px; align-items:center;
  padding:12px 16px; border:1px solid var(--line); border-radius:var(--r3); background:var(--surf); cursor:pointer;
  transition:all var(--t)}
.selrow:hover{border-color:var(--line2); background:var(--surf2)}
.barra{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px}
.barra input[type=text]{flex:1; min-width:200px; padding:10px 15px; color:var(--ink); border:1px solid var(--line);
  border-radius:var(--r3); font:inherit; background:var(--surf)}
.barra input[type=text]:focus{outline:none; border-color:rgba(123,140,255,.55)}
input[type=checkbox]{accent-color:var(--acc); width:16px;height:16px; cursor:pointer}

/* --- linhas do importador (contato à esquerda, candidato à direita) --- */
.ct .n1{font-weight:640; font-size:13.5px; margin-bottom:3px}
.ct .n2{color:var(--mut); font-size:12px; line-height:1.45}
.ct .of{display:inline-block; margin-top:7px}
.av{width:40px;height:40px;border-radius:12px;object-fit:cover;flex:none; display:block;
  background:var(--surf2); border:1px solid var(--line2)}
.av.none{display:grid; place-items:center; font-size:16px; color:var(--mut2)}
.cand{cursor:pointer; flex-wrap:wrap}
.cand .cn{min-width:130px}
.cand:hover{border-color:rgba(74,222,128,.45); background:rgba(74,222,128,.07)}
.cand .cn{flex:1; min-width:0}
.cand .cn b{font-size:13.5px; display:block; margin-bottom:2px}
.cand .cn div{color:var(--mut); font-size:11.5px; line-height:1.45}
.cand .idc{font-size:11px; font-weight:700; padding:4px 10px; border-radius:8px; flex:none;
  background:rgba(123,140,255,.18); color:#a9b4ff; border:1px solid rgba(123,140,255,.3)}
.cand .eesta{font-size:12px; font-weight:650; color:#7ee6a6; padding:5px 12px; border-radius:99px; flex:none;
  background:rgba(74,222,128,.12); border:1px solid rgba(74,222,128,.3); white-space:nowrap}
.cand:hover .eesta{background:rgba(74,222,128,.24); color:#a7f3c4}

/* --- aviso de homônimo no autocomplete --- */
.avisohom{padding:11px 14px; font-size:12px; color:#fca5a5; background:rgba(248,113,113,.1);
  border-bottom:1px solid rgba(248,113,113,.26); line-height:1.5}

/* --- rodapé de botões do formulário --- */
.fbtns{display:flex; gap:10px; justify-content:flex-end; margin-top:22px; padding-top:20px;
  border-top:1px solid var(--line)}

/* ================================================================ formulário */
.modal{position:fixed; inset:0; z-index:100; display:none; align-items:flex-start; justify-content:center;
  padding:40px 20px; background:rgba(5,6,12,.75); backdrop-filter:blur(10px); overflow-y:auto}
.modal.on{display:flex; animation:sobe .22s both}
.form{width:min(920px,100%); background:linear-gradient(170deg,#191b2b,#121320); border:1px solid var(--line2);
  border-radius:var(--r); padding:26px 28px; box-shadow:0 30px 90px rgba(0,0,0,.7)}
.form h2{margin:0 0 20px}
/* só dentro do formulário: solta, esta regra pegava a trilha das barras dos gráficos
   (a barra de 100% parava em 44% da trilha) */
.form .f{display:grid; grid-template-columns:1fr 1fr; gap:15px 18px}
.f .full{grid-column:1/-1}
.f label{display:block; font-size:12px; color:var(--mut); margin-bottom:6px}
.f input,.f select,.f textarea{width:100%; padding:11px 14px; color:var(--ink); border:1px solid var(--line);
  border-radius:var(--r3); font:inherit; background:var(--surf)}
.f input:focus,.f select:focus,.f textarea:focus{outline:none; border-color:rgba(123,140,255,.6);
  background:rgba(123,140,255,.07)}
.f textarea{min-height:82px; resize:vertical; font-family:inherit}
.f input.erro{border-color:rgba(248,113,113,.6); background:rgba(248,113,113,.07)}
.msgerro{font-size:11.5px; color:#fca5a5; margin-top:6px}
.chk{display:flex; align-items:center; gap:9px; font-size:13px; color:var(--ink2); cursor:pointer}
.f .rodape{grid-column:1/-1; display:flex; gap:10px; justify-content:flex-end; margin-top:8px;
  padding-top:18px; border-top:1px solid var(--line)}

/* autocomplete de pai/mãe */
.ac{position:relative}
.dd{position:absolute; left:0; right:0; top:100%; z-index:20; margin-top:5px; max-height:330px; overflow-y:auto;
  background:#181a29; border:1px solid var(--line2); border-radius:var(--r2); box-shadow:0 20px 60px rgba(0,0,0,.7);
  display:none}
.dd.on{display:block}
.dd .op{display:flex; gap:12px; align-items:center; padding:11px 14px; cursor:pointer; border-bottom:1px solid var(--line)}
.dd .op:last-child{border-bottom:none}
.dd .op:hover,.dd .op.foco{background:rgba(123,140,255,.14)}
.dd .op .ph{width:38px;height:38px;border-radius:11px}
.dd .op .idb{font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:6px; background:rgba(123,140,255,.2);
  color:#a9b4ff}
.dd .op.esqop{opacity:.8}
.dd .op.novo{color:var(--acc2); font-weight:600}
.dd .alertadd{padding:10px 14px; font-size:12px; color:#fca5a5; background:rgba(248,113,113,.1);
  border-bottom:1px solid rgba(248,113,113,.25)}
.sel{margin-top:8px; font-size:12px; color:var(--mut)}
.sel:not(:empty){display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:var(--r3);
  background:rgba(74,222,128,.07); border:1px solid rgba(74,222,128,.25); line-height:1.45}
.sel:not(:empty) b{color:var(--ink)}
.sel.esq:not(:empty){background:rgba(251,191,36,.07); border-color:rgba(251,191,36,.26)}
.sel.novo:not(:empty){background:rgba(63,216,194,.07); border-color:rgba(63,216,194,.28); color:#6ee7d5}
.sel .av{width:34px;height:34px;border-radius:10px}
.sel span.av{display:grid; place-items:center; font-size:16px; color:var(--acc2); background:var(--surf2)}

/* toast */
.toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%); z-index:200; display:none;
  padding:13px 22px; border-radius:var(--r3); background:#1d1f30; border:1px solid var(--line2);
  box-shadow:0 18px 50px rgba(0,0,0,.6); font-size:13.5px}

/* ---- container queries: medem a ÁREA de conteúdo, não a janela.
   Com a sidebar aberta a área é ~270px menor, e era por isso que as telas
   apertavam sem nenhum breakpoint disparar. ---- */
@container area (max-width:900px){
  .imp .par{grid-template-columns:1fr; gap:13px}
  .imp .seta{display:none}
  .imp .acs{flex-direction:row; flex-wrap:wrap}
  .selrow{grid-template-columns:24px 1fr; gap:10px}
  .selrow>div:nth-child(n+3){grid-column:2; font-size:12px}
  .tcab,.lista .row{grid-template-columns:46px minmax(150px,2fr) 110px 120px 40px}
  .tcab .esconde,.lista .row .esconde{display:none}
  .lista.simples .row{grid-template-columns:44px 1fr 100px}
  .lista.simples .row .c4{display:none}
  .desc{grid-template-columns:1fr}
  .rosca{justify-content:center}
}
@container area (max-width:620px){
  .tcab,.lista .row{grid-template-columns:42px 1fr 40px}
  .tcab span:nth-child(3),.tcab span:nth-child(6),
  .lista .row .cel:not(:last-of-type){display:none}
  .lista .row .cel:nth-last-of-type(1){display:block}
  .perfil{flex-direction:column}
  .kv{grid-template-columns:1fr; gap:3px 0}
  .kv b{margin-top:8px}
}

/* ================================================================ responsivo */
@media (max-width:1280px){ .crumb>span:not(.casa),.crumb .sep{display:none} }
@media (max-width:1100px){
  .tcab,.lista .row{grid-template-columns:44px minmax(160px,2fr) 100px 120px 40px}
  .tcab .esconde,.lista .row .esconde{display:none}
}
@media (max-width:860px){
  body{--sb:70px}
  .sb .grupo,.sb a.item span,.sb a.item .badge,.marca .txt{display:none}
  .sb{padding:18px 11px; align-items:center}
  .sb a.item{justify-content:center; padding:11px}
  main{padding:18px 16px}
  h1{font-size:24px}
  #busca{width:150px} #busca:focus{width:190px}
  .perfil{padding:20px}
  .perfil>.ph,.perfil .gfoto .ph{width:92px;height:92px;border-radius:20px}
  .form .f{grid-template-columns:1fr}
  .imp .par{grid-template-columns:1fr; gap:12px}
  .imp .seta{display:none}
}

/* ==================================================================
   Pessoas de Bolso — o que é só do app (celular + cofre)
   ================================================================== */
html{-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none; -webkit-tap-highlight-color:transparent}
.tabbar{display:none}
.topo-barra .btn.p .t{display:inline}
.pend-cel{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:600; padding:3px 9px;
  border-radius:99px; background:rgba(251,146,60,.13); color:#fdba74; border:1px solid rgba(251,146,60,.28); margin-right:5px}

/* cartões da tela Ajustes */
.aj{display:grid; gap:14px; max-width:760px}
.aj .card{padding:18px 18px; text-align:left}
.aj .card h3{margin:0 0 6px; font-size:16px; font-weight:650; display:flex; align-items:center; gap:9px}
.aj .card p{margin:6px 0; color:var(--ink2); line-height:1.5}
.aj .linha{display:flex; gap:10px; flex-wrap:wrap; margin-top:12px}
.aj .linha .btn{justify-content:center}
.aj .st{font-size:12px; padding:3px 10px; border-radius:99px; margin-left:auto; font-weight:600}
.aj .st.ok{background:rgba(74,222,128,.13); color:#7ee6a6; border:1px solid rgba(74,222,128,.26)}
.aj .st.bad{background:rgba(248,113,113,.13); color:#fca5a5; border:1px solid rgba(248,113,113,.26)}
.aj .st.meio{background:rgba(251,191,36,.13); color:#fcd34d; border:1px solid rgba(251,191,36,.26)}
.aj .mud{display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line)}
.aj .mud:first-of-type{border-top:none}
.aj .mud .tx{flex:1; min-width:0}
.aj .mud .tx b{display:block; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.aj .mud .tx small{display:block; color:var(--mut); font-size:12px}
.aj .mud button{flex:none}
.aj details summary{cursor:pointer; color:var(--mut); font-size:13px}
.aj ol{padding-left:20px; margin:8px 0 0; line-height:1.6; color:var(--ink2); font-size:13px}
.boas{max-width:560px; margin:6vh auto 0; text-align:center}
.boas .sig{width:76px;height:76px;border-radius:24px;margin:0 auto 18px;display:grid;place-items:center;font-size:36px;
  background:linear-gradient(145deg,rgba(123,140,255,.32),rgba(178,141,255,.16)); border:1px solid rgba(123,140,255,.35);
  box-shadow:0 0 40px rgba(123,140,255,.25)}
.boas p{color:var(--ink2); line-height:1.6}
.boas .linha{justify-content:center}
.faixa-upd{display:flex; align-items:center; gap:12px; width:100%; text-align:left; margin:0 0 16px; padding:13px 16px;
  border-radius:var(--r2); border:1px solid rgba(123,140,255,.45); background:rgba(123,140,255,.12); color:var(--ink); font-size:13.5px}

/* diálogos do app (senha, confirmação) */
#dlg{position:fixed; inset:0; z-index:300; display:none; align-items:center; justify-content:center; padding:20px;
  background:rgba(5,6,12,.78); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px)}
#dlg.on{display:flex}
#dlg .caixa{width:min(440px,100%); background:linear-gradient(170deg,#191b2b,#121320); border:1px solid var(--line2);
  border-radius:var(--r); padding:22px; box-shadow:0 30px 90px rgba(0,0,0,.7); display:grid; gap:12px}
#dlg .caixa b{font-size:16px}
#dlg .caixa p{margin:0; color:var(--ink2); font-size:13.5px; line-height:1.5}
#dlg .caixa .botoes{display:flex; gap:10px; justify-content:flex-end; margin-top:4px}
.campo{display:grid; gap:6px}
.campo span{font-size:12px; color:var(--mut)}
.campo input,.campo select{width:100%; padding:12px 14px; color:var(--ink); border:1px solid var(--line2);
  border-radius:var(--r3); font:inherit; font-size:16px; background:var(--surf)}
.campo input:focus{outline:none; border-color:rgba(123,140,255,.6); background:rgba(123,140,255,.07)}
.erro-txt{color:#fca5a5; font-size:12.5px; margin:0}

/* tela de trava */
#trava{position:fixed; inset:0; z-index:400; display:none; place-items:center; padding:24px; background:var(--bg)}
#trava.on{display:grid}
#trava form{width:min(360px,100%); display:grid; gap:14px; text-align:center}
#trava .sig{width:70px;height:70px;border-radius:22px;margin:0 auto;display:grid;place-items:center;font-size:32px;
  background:linear-gradient(145deg,rgba(123,140,255,.32),rgba(178,141,255,.16)); border:1px solid rgba(123,140,255,.35)}
#trava input{text-align:center; font-size:20px; letter-spacing:.2em}

/* ==================================================================
   Celular: sem sidebar, barra de abas embaixo, tudo em uma coluna
   ================================================================== */
@media (max-width:760px){
  body{font-size:15px}
  .sb{display:none}
  .topo-barra{padding:calc(env(safe-area-inset-top, 0px) + 8px) 12px 9px; gap:8px}
  .crumb,.topo-barra .icone,.eu{display:none}
  #busca{flex:1 1 auto; width:auto; min-width:0; margin-left:0; font-size:16px; padding:10px 13px}
  #busca:focus{flex-basis:auto}
  .topo-barra .btn.p{padding:10px 13px; font-size:15px}
  .topo-barra .btn.p .t{display:none}
  .fita .rot{padding:0 12px; height:40px}
  .fita .it{height:40px; padding:0 14px}
  main{padding:16px 14px calc(92px + env(safe-area-inset-bottom, 0px))}
  h1{font-size:25px}
  input,select,textarea{font-size:16px!important}
  .tabbar{display:flex; position:fixed; left:10px; right:10px; bottom:calc(8px + env(safe-area-inset-bottom, 0px)); z-index:60;
    height:62px; padding:0 4px; border-radius:22px; background:rgba(18,19,32,.88); border:1px solid var(--line2);
    backdrop-filter:blur(22px) saturate(160%); -webkit-backdrop-filter:blur(22px) saturate(160%); box-shadow:0 14px 40px rgba(0,0,0,.55)}
  .tabbar a{flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    font-size:10.5px; color:var(--mut); border-radius:16px; position:relative}
  .tabbar a i{font-style:normal; font-size:20px; line-height:1; filter:grayscale(.6); opacity:.8}
  .tabbar a.on{color:#fff}
  .tabbar a.on i{filter:none; opacity:1}
  .tabbar a.on::before{content:''; position:absolute; inset:6px 4px; border-radius:14px; background:rgba(255,255,255,.07);
    border:1px solid var(--line2); z-index:-1}
  .tabbar a .bd{position:absolute; top:7px; right:calc(50% - 22px); min-width:17px; height:17px; padding:0 5px; border-radius:99px;
    background:var(--orange); color:#111; font-size:10px; font-weight:700; display:grid; place-items:center}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom, 0px)); max-width:calc(100% - 28px); text-align:center}
  .modal{padding:0; align-items:stretch}
  .form{width:100%; border-radius:0; min-height:100%; border:none;
    padding:calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 24px)}
  .fbtns{position:sticky; bottom:0; background:linear-gradient(180deg,rgba(18,19,32,0),#121320 30%); padding-bottom:6px}
  .fbtns .btn{flex:1; justify-content:center}
  .mapa-vista{height:calc(100dvh - 330px); min-height:360px}
  .perfil{padding:18px; gap:16px}
  .perfil .info{min-width:0}
  .perfil .acoes .btn{flex:1 1 auto; justify-content:center}
  .arv{overflow-x:auto; -webkit-overflow-scrolling:touch}
  .cab-aniv{flex-wrap:wrap; gap:12px}
  .cab-aniv .seg{max-width:100%; overflow-x:auto}
  .btn:hover,.icone:hover{transform:none}
  main h2{flex-wrap:wrap; row-gap:4px}
  main h2 .n{flex:1 1 100%; padding-left:13px}
  main h2 .chk{margin-left:13px!important; text-transform:none; letter-spacing:0; font-size:13px; font-weight:500}
}
@media (max-width:760px) and (hover:none){
  .card:hover,.bloco:hover,.painel:hover{border-color:var(--line)}
}

/* ==================================================================
   v1.1 (28-09-2026) — feito pro celular (08-celular.js): quadradinhos de aniversário,
   lista enxuta, ficha compacta, cadastro expresso e a fila "Completar depois"
   ================================================================== */
.tag.rev{background:rgba(123,140,255,.13); color:#a9b4ff; border-color:rgba(123,140,255,.3)}
.tabbar a .bd.azul{background:var(--acc); color:#fff}
.cel-cab{display:flex; align-items:flex-end; justify-content:space-between; gap:10px; margin:2px 0 12px}
.cel-cab h1{margin:0; font-size:26px; letter-spacing:-.02em}
.cel-data{color:var(--mut); font-size:13px; margin-bottom:2px}
.cel-data::first-letter{text-transform:uppercase}
.cel-chips{display:flex; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; margin:0 0 14px}
.cel-chips::-webkit-scrollbar{display:none}
.cel-chips button{flex:none; padding:8px 13px; border-radius:99px; border:1px solid var(--line2); background:var(--surf); color:var(--ink2); font-size:13px; white-space:nowrap; font-family:inherit}
.cel-chips button.on{background:var(--acc); border-color:transparent; color:#fff; font-weight:600}
.cel-chips button b{margin-left:4px; padding:1px 7px; border-radius:99px; background:rgba(255,255,255,.18); font-size:11px}
.cel-sec{margin:0 0 18px}
.cel-sec h3{display:flex; align-items:center; gap:8px; margin:0 0 9px; font-size:15px; font-weight:650}
.cel-sec h3 .n,.fi-det summary .n{font-size:12px; font-weight:600; color:var(--mut); background:var(--surf2); border:1px solid var(--line); border-radius:99px; padding:1px 8px}
.cel-zap{display:flex; gap:6px; flex-wrap:wrap; margin:0 0 10px}
.cel-mais{width:100%; justify-content:center; margin:4px 0 8px}
/* aniversários: quadradinhos, 3 por linha */
.grade-ta{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
.ta{display:flex; flex-direction:column; align-items:center; text-align:center; gap:1px; padding:10px 5px 9px; border-radius:16px;
  background:var(--surf); border:1px solid var(--line); color:var(--ink); text-decoration:none; min-width:0}
.ta:hover{text-decoration:none}
.ta.breve{border-color:rgba(251,191,36,.26); background:rgba(251,191,36,.045)}
.ta.hoje{border-color:rgba(251,191,36,.6); background:rgba(251,191,36,.12)}
.ta-f{position:relative; margin-bottom:6px}
.ta-img{width:56px; height:56px; border-radius:50%; object-fit:cover; display:block}
.ta-img.none{display:grid; place-items:center; background:var(--surf2); font-size:24px; color:var(--mut2)}
.ta-marco{position:absolute; right:-4px; bottom:-2px; width:20px; height:20px; border-radius:50%; background:var(--warn); color:#111; font-size:11px; display:grid; place-items:center; border:2px solid var(--bg)}
.ta-n{font-size:12.5px; font-weight:650; line-height:1.16; width:100%; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; min-height:29px; color:var(--ink)}
.ta-i{font-size:12px; color:var(--ink2)}
.ta-i b{color:#fff; font-size:14px}
.ta-d{font-size:11px; color:var(--mut)}
.ta-q{margin-top:4px; font-size:10.5px; font-weight:650; padding:2px 8px; border-radius:99px; background:var(--surf2); color:var(--ink2)}
.ta.breve .ta-q{background:rgba(251,191,36,.16); color:#fcd34d}
.ta.hoje .ta-q{background:var(--warn); color:#111}
/* listas enxutas (Pessoas, fila, Conferência) */
.lista-cel{display:grid; border:1px solid var(--line); border-radius:var(--r2); overflow:hidden; background:var(--surf)}
.lp{display:flex; align-items:center; gap:11px; padding:9px 11px; color:var(--ink); text-decoration:none; border-top:1px solid var(--line); min-width:0}
.lp:first-child{border-top:none}
a.lp:hover{text-decoration:none; background:var(--surf2)}
.lp-img{width:42px; height:42px; border-radius:50%; object-fit:cover; flex:none; display:block}
.lp-img.none{display:grid; place-items:center; background:var(--surf2); font-size:17px; color:var(--mut2)}
.lp-t{flex:1; min-width:0; color:var(--ink); text-decoration:none}
.lp-t b{display:block; font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.lp-t small{display:block; font-size:12px; color:var(--mut); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.lp-d{display:flex; align-items:center; gap:6px; flex:none}
.circ-dot{width:9px; height:9px; border-radius:50%; background:#5d6279}
.circ-dot.c1{background:#f5c65e} .circ-dot.c2{background:#8194ff} .circ-dot.c3{background:#82e8ae}
.dot{font-size:12px}
.dot.esq{width:18px; height:18px; border-radius:50%; display:grid; place-items:center; background:rgba(251,191,36,.15); color:#fcd34d; font-weight:700; font-size:11px}
.cel-ord{max-width:48%; padding:8px 10px; border-radius:10px; border:1px solid var(--line2); background:var(--surf); color:var(--ink); font-size:13px}
/* ficha */
.fi-top{display:flex; gap:14px; align-items:center; margin:2px 0 12px}
.fi-img{width:86px; height:86px; border-radius:22px; object-fit:cover; flex:none; display:block}
.fi-img.none{display:grid; place-items:center; background:var(--surf2); font-size:34px; color:var(--mut2)}
.fi-q{min-width:0}
.fi-q h1{margin:0 0 6px; font-size:21px; line-height:1.2; letter-spacing:-.01em}
.fi-l{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:5px}
.fi-r{font-size:12.5px; color:var(--mut); margin-bottom:4px}
